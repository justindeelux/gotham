name: Umami
icon: umami
description: "Umami web analytics with PostgreSQL, persistent named volumes and an optional routed domain."
homepage: https://umami.is
category:
  - analytics
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: umami.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: app_secret
    label: Application secret
    type: secret
    required: true
    pattern: "^[A-Za-z0-9+/=_-]{32,}$"
    max_length: 256
    help: "Signs session tokens with HS256, so it needs at least 32 characters. Generate one with: openssl rand -hex 32"
routes:
  - service: umami
    port: 3000
    domain_field: domain
