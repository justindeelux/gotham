services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:26
    restart: unless-stopped
    ports:
      - "8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    healthcheck:
      test:
        - CMD-SHELL
        - exec 3<>/dev/tcp/127.0.0.1/8978 && printf 'GET / HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  cloudbeaver_data:
