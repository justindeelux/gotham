name: Karakeep
icon: karakeep
description: Karakeep bookmarks with a headless browser, Meilisearch and persistent volumes.
homepage: https://docs.karakeep.app/
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: bookmarks.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: nextauth_secret
    label: Session secret
    type: secret
    required: true
    generate: true
    help: Signs login sessions; use Generate for a strong value.
  - key: meili_key
    label: Search master key
    type: secret
    required: true
    generate: true
routes:
  - service: web
    port: 3000
    domain_field: domain
