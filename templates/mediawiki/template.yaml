name: MediaWiki
icon: mediawiki
description: MediaWiki with a persistent named volume holding the install and uploaded images, plus an optional routed domain.
homepage: https://www.mediawiki.org
category:
  - cms
  - documentation
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: wiki.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: mediawiki
    port: 80
    domain_field: domain
