services:
  invoice-ninja:
    image: invoiceninja/invoiceninja:5
    restart: unless-stopped
    ports:
      - "9000"
    environment:
      APP_NAME: Invoice Ninja
      APP_ENV: production
      APP_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      APP_KEY: "{{ .app_key }}"
      APP_DEBUG: "false"
      REQUIRE_HTTPS: "false"
      TRUSTED_PROXIES: "*"
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: "{{ .redis_password }}"
      REDIS_PORT: "6379"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: "{{ .db_name }}"
      DB_USERNAME: "{{ .db_user }}"
      DB_PASSWORD: "{{ .db_password }}"
      IN_USER_EMAIL: "{{ .admin_email }}"
      IN_PASSWORD: "{{ .admin_password }}"
      MAIL_MAILER: log
      IS_DOCKER: "true"
    volumes:
      - invoice_ninja_public:/var/www/app/public
      - invoice_ninja_storage:/var/www/app/storage
    depends_on:
      - mariadb
      - redis
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "{{ .db_root_password }}"
      MYSQL_DATABASE: "{{ .db_name }}"
      MYSQL_USER: "{{ .db_user }}"
      MYSQL_PASSWORD: "{{ .db_password }}"
    volumes:
      - invoice_ninja_mariadb_data:/var/lib/mysql
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "{{ .redis_password }}"]
    volumes:
      - invoice_ninja_redis_data:/data
volumes:
  invoice_ninja_public:
  invoice_ninja_storage:
  invoice_ninja_mariadb_data:
  invoice_ninja_redis_data:
