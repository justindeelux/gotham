name: PG Back Web
icon: pgbackweb
description: PG Back Web PostgreSQL backups with its own database, persistent named volumes and an optional routed domain.
homepage: https://github.com/eduardolat/pgbackweb
category:
  - devtools
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: encryption_key
    label: Encryption key
    type: secret
    required: true
    generate: true
    help: Encrypts the stored connection strings; use Generate for a strong value.
  - key: db_name
    label: Database name
    type: text
    default: pgbackweb
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: pgbackweb
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
    help: Used by PG Back Web and PostgreSQL; use Generate for a strong value.
routes:
  - service: pgbackweb
    port: 8085
    domain_field: domain
