name: CodiMD
icon: codimd
description: CodiMD collaborative Markdown notes with PostgreSQL and persistent volumes.
homepage: https://hackmd.io/c/codimd-documentation
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: notes.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: codimd
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: session_secret
    label: Session secret
    type: secret
    required: true
    generate: true
    help: Signs session cookies; use Generate for a strong value.
routes:
  - service: codimd
    port: 3000
    domain_field: domain
