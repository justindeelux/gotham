name: minecraft
icon: minecraft
description: Minecraft Server that will automatically download selected version at startup.
homepage: https://github.com/itzg/docker-minecraft-server
category:
  - games
fields:
  - key: game_port
    label: Server port
    type: number
    required: false
    default: 25565
    min: 1024
    max: 65535
  - key: version
    label: Minecraft version
    type: text
    required: false
    default: latest
    help: Minecraft version to download, or latest.
    pattern: ^[A-Za-z0-9._-]{1,32}$
    max_length: 32
  - key: type
    label: Server type
    type: select
    required: false
    default: VANILLA
    options:
      - VANILLA
      - PAPER
      - FABRIC
      - FORGE
      - NEOFORGE
  - key: max_players
    label: Max players
    type: number
    required: false
    default: 10
    min: 1
    max: 200
  - key: motd
    label: Message of the day
    type: text
    required: false
    default: Minecraft Server
    max_length: 120
  - key: memory
    label: Java heap
    type: text
    required: false
    default: 1G
    help: Heap size passed to the JVM, for example 1G or 4G.
    pattern: ^[0-9]{1,4}[MG]$
    max_length: 8
