name: IT Tools
icon: it-tools
description: IT Tools collection of developer utilities with a persistent data volume and an optional routed domain.
homepage: https://github.com/corentinth/it-tools
category:
  - devtools
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: it-tools
    port: 80
    domain_field: domain
