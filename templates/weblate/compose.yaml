services:
  weblate:
    image: weblate/weblate:2026.11.2.0
    restart: unless-stopped
    ports:
      - "8080"
    environment:
      WEBLATE_SITE_DOMAIN: "${GOTHAM_DOMAIN:-localhost}"
      WEBLATE_ADMIN_NAME: Admin
      WEBLATE_ADMIN_EMAIL: "{{ .admin_email }}"
      WEBLATE_ADMIN_PASSWORD: "{{ .admin_password }}"
      WEBLATE_SERVER_EMAIL: "{{ .admin_email }}"
      WEBLATE_DEFAULT_FROM_EMAIL: "{{ .admin_email }}"
      WEBLATE_EMAIL_HOST: localhost
      WEBLATE_EMAIL_PORT: "587"
      WEBLATE_EMAIL_USE_TLS: "true"
      WEBLATE_EMAIL_USE_SSL: "false"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_DATABASE: "{{ .db_name }}"
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "{{ .redis_password }}"
    volumes:
      - weblate_data:/app/data
      - weblate_cache:/app/cache
    depends_on:
      - postgresql
      - redis
  postgresql:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: "{{ .db_name }}"
    volumes:
      - postgresql_data:/var/lib/postgresql
  redis:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["--appendonly", "yes", "--requirepass", "{{ .redis_password }}"]
    volumes:
      - weblate_redis_data:/data
volumes:
  weblate_data:
  weblate_cache:
  postgresql_data:
  weblate_redis_data:
