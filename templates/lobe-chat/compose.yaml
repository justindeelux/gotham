services:
  lobe-chat:
    image: lobehub/lobehub:2.3.3
    restart: unless-stopped
    ports:
      - "3210"
    environment:
      APP_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      INTERNAL_APP_URL: "http://localhost:3210"
      KEY_VAULTS_SECRET: "{{ .key_vaults_secret }}"
      AUTH_SECRET: "{{ .auth_secret }}"
      DATABASE_URL: "postgresql://postgres:{{ .db_password }}@postgresql:5432/lobechat"
      REDIS_URL: "redis://redis:6379"
      REDIS_PREFIX: lobechat
      S3_ENDPOINT: "https://{{ .storage_domain }}"
      S3_INTERNAL_ENDPOINT: "http://rustfs:9000"
      S3_BUCKET: lobe
      S3_ENABLE_PATH_STYLE: "1"
      S3_ACCESS_KEY: rustfs
      S3_ACCESS_KEY_ID: rustfs
      S3_SECRET_ACCESS_KEY: "{{ .rustfs_password }}"
      S3_SET_ACL: "0"
      LLM_VISION_IMAGE_USE_BASE64: "1"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
  postgresql:
    image: paradedb/paradedb:0.26.7-pg17
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_search,pg_cron,pg_stat_statements"]
    environment:
      POSTGRES_DB: lobechat
      POSTGRES_PASSWORD: "{{ .db_password }}"
    volumes:
      - lobe_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: redis-server --save 60 1000 --appendonly yes
    volumes:
      - lobe_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  rustfs:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: "{{ .rustfs_password }}"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "9000"
    volumes:
      - lobe_rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
  rustfs-init:
    image: rustfs/rc:v0.1.37
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        rc alias set rustfs http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"
        rc mb "rustfs/$$S3_BUCKET" --ignore-existing
        rc anonymous set download "rustfs/$$S3_BUCKET"
        printf '%s' '<CORSConfiguration><CORSRule><AllowedOrigin>*</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>' | rc bucket cors set "rustfs/$$S3_BUCKET" -
    environment:
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: "{{ .rustfs_password }}"
      S3_BUCKET: lobe
    depends_on:
      rustfs:
        condition: service_healthy
volumes:
  lobe_postgresql_data:
  lobe_redis_data:
  lobe_rustfs_data:
