services:
  phpmyadmin:
    image: lscr.io/linuxserver/phpmyadmin:5.2.3
    restart: unless-stopped
    ports:
      - "80"
    environment:
      PUID: "1000"
      PGID: "1000"
      PMA_ARBITRARY: "1"
      PMA_ABSOLUTE_URI: "https://${GOTHAM_DOMAIN:-localhost}"
    volumes:
      - phpmyadmin_config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  phpmyadmin_config:
