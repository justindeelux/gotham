name: MediaWiki
icon: mediawiki
description: "MediaWiki with a persistent volume for the whole document root and an optional routed domain. An image tag bump does not update the code already copied into that volume."
homepage: https://www.mediawiki.org
category:
  - cms
  - documentation
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: wiki.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: mediawiki
    port: 80
    domain_field: domain
