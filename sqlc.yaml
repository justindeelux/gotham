# sqlc configuration (v2 schema).
#
# Generates type-safe Go from the queries in internal/store/queries against the
# schema in internal/store/migrations. The generated package is committed, so CI
# does not need the sqlc binary; `make sqlc-check` fails on drift.
version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/store/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
