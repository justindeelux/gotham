name: Martin
icon: martin
description: Martin vector tile server with PostGIS, persistent named volumes and an optional routed domain.
homepage: https://maplibre.org/martin/introduction.html/
category:
  - backend
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_name
    label: Database name
    type: text
    default: martin
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: martin
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
    help: Used by Martin and PostGIS; use Generate for a strong value.
routes:
  - service: martin
    port: 3000
    domain_field: domain
