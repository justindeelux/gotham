# Gotham control-plane update configuration (root-owned).
#
# Install this file at /etc/gotham/updater.conf, owned root:root mode 0644. It is
# read by deploy/gotham-update.sh, which runs as root through the sudoers rule.
# Keep it root-owned and outside every path the gotham service user can write:
# the wrapper takes no arguments and (under sudo) ignores GOTHAM_* environment
# overrides, so these values are the only thing that decides which binary,
# service, health URL, status and lock it touches.

# The binary the control plane swaps. Keep it in the unit's StateDirectory.
GOTHAM_BINARY=/var/lib/gotham/bin/gotham

# The systemd unit to restart.
GOTHAM_SERVICE=gotham

# Loopback health endpoint probed after the restart. Only loopback http URLs
# without userinfo/query/fragment are accepted.
GOTHAM_HEALTH=http://127.0.0.1:8000/healthz

# Seconds to wait for the health endpoint before rolling back.
GOTHAM_TIMEOUT=30

# Authoritative outcome, written by the wrapper into a root-owned directory the
# control plane can only read. Install:
#   install -d -m 0755 -o root -g root /var/lib/gotham-updater
GOTHAM_STATUS=/var/lib/gotham-updater/update.status

# Control-plane-owned pending marker (in the service StateDirectory). It gates a
# second apply until the outcome is recorded, and the wrapper removes it.
GOTHAM_PENDING=/var/lib/gotham/update.pending

# Lock shared with the control plane's Apply/Rollback.
GOTHAM_LOCK=/var/lib/gotham/update.lock

# Release base URL the wrapper fetches the signed host-helper payload from
# (JUS-188). The tag and asset names are appended; the manifest signature and the
# signed payload digest, checked against the root-owned release public key next
# to the wrapper, are the trust boundary, not this transport. Point it at a
# mirror only if that mirror serves the signed release assets unchanged.
GOTHAM_RELEASE_BASE=https://github.com/justindeelux/gotham/releases/download

# Root-owned parent for the root-only 0700 staging directory the wrapper fetches
# and verifies the payload in. Must not be writable by the service user (the
# default root-owned status directory is used when unset).
# GOTHAM_STAGING=/var/lib/gotham-updater
