name: Joplin Server
icon: joplin
description: Joplin sync server with PostgreSQL and a persistent named volume.
homepage: https://github.com/laurent22/joplin/blob/dev/packages/server/README.md
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: joplin.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: joplin
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: joplin
    port: 22300
    domain_field: domain
