name: calibre-web-automated-book-downloader
icon: calibre-web-automated-book-downloader
description: An intuitive web interface for searching and requesting book downloads, designed to work seamlessly with Calibre-Web-Automated.
homepage: https://github.com/calibrain/calibre-web-automated-book-downloader
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: downloader_domain
    label: Book downloader domain
    type: text
    required: false
    default: ""
    placeholder: download.example.com
    help: Optional. Host for the separate book downloader, served on port 8084.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: calibre-web-automated
    port: 8083
    domain_field: domain
  - service: calibre-web-downloader
    port: 8084
    domain_field: downloader_domain
