services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls5
    restart: unless-stopped
    ports:
      - '8989'
    environment:
      _APP_URL: https://${GOTHAM_DOMAIN:-localhost}
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - sonarr_config:/config
volumes:
  sonarr_config:
