services:
  influxdb:
    image: influxdb:2.9-alpine
    restart: unless-stopped
    ports:
      - "8086"
    environment:
      INFLUXDB_HTTP_BIND_ADDRESS: ":8086"
      INFLUXDB_INIT_MODE: setup
      INFLUXDB_INIT_USERNAME: "{{ .admin_user }}"
      INFLUXDB_INIT_PASSWORD: "{{ .admin_password }}"
      INFLUXDB_INIT_ORG: "{{ .org }}"
      INFLUXDB_INIT_BUCKET: "{{ .bucket }}"
      INFLUXDB_INIT_RETENTION: "0"
      INFLUXDB_INIT_ADMIN_TOKEN: "{{ .admin_token }}"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
volumes:
  influxdb_data:
  influxdb_config:
