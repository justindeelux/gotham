name: pgAdmin
icon: pgadmin
description: pgAdmin 4 web console for PostgreSQL with a persistent volume and an optional routed domain.
homepage: https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
category:
  - database
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: pgadmin.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: admin_email
    label: Login email
    type: text
    default: admin@example.com
    pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    max_length: 254
  - key: admin_password
    label: Login password
    type: secret
    required: true
    generate: true
routes:
  - service: pgadmin
    port: 80
    domain_field: domain
