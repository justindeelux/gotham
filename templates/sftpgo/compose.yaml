services:
  sftpgo:
    image: ghcr.io/drakkan/sftpgo:v2.7-alpine
    restart: unless-stopped
    ports:
      - "8080"
      - "2222"
    environment:
      SFTPGO_DATA_PROVIDER__DRIVER: postgresql
      SFTPGO_DATA_PROVIDER__CONNECTION_STRING: "postgresql://{{ .db_user }}:{{ .db_password }}@postgresql:5432/{{ .db_name }}"
      SFTPGO_SFTPD__BINDINGS__0__PORT: "2222"
      SFTPGO_LOG_LEVEL: info
    volumes:
      - sftpgo_data:/srv/sftpgo/data
      - sftpgo_keys:/var/lib/sftpgo
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 20s
      retries: 10
  postgresql:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: "{{ .db_name }}"
    volumes:
      - sftpgo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  sftpgo_data:
  sftpgo_keys:
  sftpgo_db:
