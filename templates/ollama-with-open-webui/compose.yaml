services:
  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    restart: unless-stopped
    ports:
      - "8080"
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama
volumes:
  ollama_data:
  open_webui_data:
