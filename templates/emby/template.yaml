name: emby
icon: emby
description: A media server software that allows you to organize, stream, and access your multimedia content effortlessly.
homepage: https://emby.media/support/articles/Home.html
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: emby
    port: 8096
    domain_field: domain
