name: NodeBB
icon: nodebb
description: NodeBB discussion forum with PostgreSQL, persistent named volumes and an optional routed domain.
homepage: https://docs.nodebb.org/
category:
  - messaging
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: forum.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: nodebb
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: nodebb
    port: 4567
    domain_field: domain
