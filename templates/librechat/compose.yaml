services:
  librechat:
    image: ghcr.io/danny-avila/librechat-dev-api:6ecd1b510faaa593ad954fb6276c18e5f12a8e53
    restart: unless-stopped
    ports:
      - "3080"
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      DOMAIN_CLIENT: "https://${GOTHAM_DOMAIN:-localhost}"
      DOMAIN_SERVER: "https://${GOTHAM_DOMAIN:-localhost}"
      APP_TITLE: LibreChat
      MONGO_URI: "mongodb://librechat:{{ .mongo_password }}@mongodb:27017/librechat?authSource=admin"
      MEILI_HOST: "http://meilisearch:7700"
      MEILI_MASTER_KEY: "{{ .meili_key }}"
      RAG_PORT: "8000"
      RAG_API_URL: "http://rag-api:8000"
      JWT_SECRET: "{{ .jwt_secret }}"
      JWT_REFRESH_SECRET: "{{ .jwt_refresh_secret }}"
      CREDS_KEY: "{{ .creds_key }}"
      CREDS_IV: "{{ .creds_iv }}"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_REGISTRATION: "true"
      ALLOW_SOCIAL_LOGIN: "false"
      ALLOW_PASSWORD_RESET: "false"
      NO_INDEX: "true"
    volumes:
      - librechat_images:/app/client/public/images
      - librechat_logs:/app/api/logs
      - librechat_uploads:/app/uploads
    depends_on:
      - mongodb
      - meilisearch
      - vectordb
      - rag-api
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: librechat
      MONGO_INITDB_ROOT_PASSWORD: "{{ .mongo_password }}"
    volumes:
      - librechat_mongodb_data:/data/db
  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "{{ .meili_key }}"
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - librechat_meilisearch_data:/meili_data
  vectordb:
    image: ankane/pgvector:v0.5.1
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: "{{ .db_password }}"
    volumes:
      - librechat_vectordb_data:/var/lib/postgresql/data
  rag-api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.9.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: "{{ .db_password }}"
      DB_HOST: vectordb
      DB_USER: rag
      DB_PASSWORD: "{{ .db_password }}"
      DB_NAME: rag
      RAG_PORT: "8000"
    depends_on:
      - vectordb
volumes:
  librechat_images:
  librechat_logs:
  librechat_uploads:
  librechat_mongodb_data:
  librechat_meilisearch_data:
  librechat_vectordb_data:
