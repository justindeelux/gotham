services:
  actual_server:
    image: actualbudget/actual-server:26.11.0
    restart: unless-stopped
    ports:
      - "5006"
    environment:
      ACTUAL_LOGIN_METHOD: password
    volumes:
      - actual_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/5006' || exit 1"]
      interval: 5s
      timeout: 20s
      retries: 3
volumes:
  actual_data:
