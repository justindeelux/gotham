services:
  jupyter-notebook-python:
    image: quay.io/jupyter/base-notebook:2026-11-16
    restart: unless-stopped
    ports:
      - "8888"
    environment:
      JUPYTER_TOKEN: "{{ .token }}"
    command: start-notebook.sh
    volumes:
      - jupyter_data:/home/jovyan/work
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8888/
      interval: 30s
      timeout: 20s
      retries: 10
volumes:
  jupyter_data:
