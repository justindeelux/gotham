name: castopod
icon: castopod
description: Castopod is a free & open-source hosting platform made for podcasters who want engage and interact with their audience.
homepage: https://docs.castopod.org/main/en/
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    required: false
    default: castopod
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: db_root_password
    label: MariaDB root password
    type: secret
    required: true
    generate: true
  - key: redis_password
    label: Redis password
    type: secret
    required: true
    generate: true
  - key: analytics_salt
    label: Analytics salt
    type: secret
    required: true
    help: Exactly 64 random characters that hash listener IPs; generate with openssl rand -base64 48. Rotating it resets episode stats.
    pattern: ^[A-Za-z0-9+/=]{64}$
    max_length: 64
routes:
  - service: castopod
    port: 8080
    domain_field: domain
