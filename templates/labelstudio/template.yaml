name: Label Studio
icon: labelstudio
description: Label Studio data labeling with PostgreSQL, persistent named volumes and an optional routed domain.
homepage: https://labelstud.io/guide/
category:
  - ai
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: labelstudio.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: admin_email
    label: Admin email
    type: text
    default: admin@example.com
    pattern: ^[A-Za-z0-9_.@+-]{1,254}$
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: labelstudio
    port: 8080
    domain_field: domain
