services:
  sequin:
    image: sequin/sequin:v0.14.6
    restart: unless-stopped
    ports:
      - "7376"
    environment:
      SERVER_HOST: "${GOTHAM_DOMAIN:-localhost}"
      PG_HOSTNAME: postgres
      PG_DATABASE: sequin-db
      PG_PORT: "5432"
      PG_USERNAME: sequin
      PG_PASSWORD: "{{ .db_password }}"
      PG_POOL_SIZE: "20"
      SECRET_KEY_BASE: "{{ .secret_key }}"
      VAULT_KEY: "{{ .vault_key }}"
      REDIS_URL: redis://redis:6379
      CONFIG_FILE_PATH: /config/playground.yml
      FEATURE_ACCOUNT_SELF_SIGNUP: "false"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: sequin-db
      POSTGRES_USER: sequin
      POSTGRES_PASSWORD: "{{ .db_password }}"
    volumes:
      - sequin_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - sequin_redis_data:/data
volumes:
  sequin_postgres_data:
  sequin_redis_data:
