services:
  cap:
    image: tiago2/cap:4.0.15
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      ADMIN_KEY: "{{ .admin_key }}"
      VALKEY_URL: redis://valkey:6379
    volumes:
      - cap_data:/usr/src/app/data
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  cap_data:
  valkey_data:
