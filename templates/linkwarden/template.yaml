name: Linkwarden
icon: linkwarden
description: Linkwarden bookmark archive with PostgreSQL, Meilisearch and persistent volumes.
homepage: https://docs.linkwarden.app/self-hosting/setup
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: links.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: linkwarden
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: nextauth_secret
    label: Session secret
    type: secret
    required: true
    generate: true
    help: Signs login sessions; use Generate for a strong value.
  - key: meili_key
    label: Search master key
    type: secret
    required: true
    generate: true
routes:
  - service: linkwarden
    port: 3000
    domain_field: domain
