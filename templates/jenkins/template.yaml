name: Jenkins
icon: jenkins
description: Jenkins automation server with a persistent home volume and an optional routed domain.
homepage: https://www.jenkins.io/doc/
category:
  - ci
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: jenkins
    port: 8080
    domain_field: domain
