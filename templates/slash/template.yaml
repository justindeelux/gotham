name: Slash
icon: slash
description: Slash is a self-hosted link shortener and sharing platform, with a persistent named volume and an optional routed domain.
homepage: https://github.com/yourselfhosted/slash
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: go.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: slash
    port: 5231
    domain_field: domain
