name: Grist
icon: grist
description: Grist relational spreadsheet with PostgreSQL, Redis and persistent volumes.
homepage: https://support.getgrist.com/
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: grist.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: grist
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: session_secret
    label: Session secret
    type: secret
    required: true
    generate: true
    help: Signs session cookies; use Generate for a strong value.
routes:
  - service: grist
    port: 8484
    domain_field: domain
