services:
  neon-proxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    restart: unless-stopped
    ports:
      - "80"
      - "2112"
    environment:
      APPEND_PORT: postgres:5432
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
      LOG_CONN_INFO: "true"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80"]
      interval: 5s
      timeout: 2s
      retries: 20
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: "{{ .db_name }}"
      POSTGRES_HOST_AUTH_METHOD: password
    volumes:
      - neon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  neon_postgres_data:
