name: Keycloak
icon: keycloak
description: Keycloak identity and access management with a persistent data volume.
homepage: https://www.keycloak.org
category:
  - auth
fields:
  - key: domain
    label: Domain
    type: text
    required: true
    placeholder: login.example.com
    help: Public host Keycloak uses as its issuer; required on the first start.
    pattern: ^[A-Za-z0-9][A-Za-z0-9.-]*$
    max_length: 253
  - key: admin_user
    label: Admin user
    type: text
    default: admin
    pattern: ^[A-Za-z0-9_.@-]{1,64}$
    max_length: 64
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
    help: Initial administrator password; use Generate for a strong value.
routes:
  - service: keycloak
    port: 8080
    domain_field: domain
