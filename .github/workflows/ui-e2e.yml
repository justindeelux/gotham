name: UI E2E

# Browser-level smoke for the embedded SPA against a real control plane.
# Separate from ci.yml (unit/build) and internal/e2e (API-level suite) so the
# Playwright run only fires on UI changes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ui-e2e.yml"

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright smoke (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gotham
          POSTGRES_PASSWORD: gotham
          POSTGRES_DB: gotham_ui_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gotham -d gotham_ui_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dedicated test database and fixed port, kept off the production
      # defaults used by the shared test server.
      GOTHAM_DATABASE_DSN: postgres://gotham:gotham@localhost:5433/gotham_ui_e2e?sslmode=disable
      GOTHAM_REDIS_ADDR: localhost:6380
      GOTHAM_SERVER_ADDR: 127.0.0.1
      GOTHAM_SERVER_PORT: "8099"
      GOTHAM_GRPC_ADDR: 127.0.0.1:9444
      GOTHAM_LOG_LEVEL: info
      GOTHAM_LOG_FORMAT: text
      # Applications are enabled by default; pinned explicitly so the smoke
      # would catch an accidental default flip.
      FEATURE_APPLICATIONS: "true"
      # Compose services + template gallery (BE-7.1/BE-7.2) are enabled by
      # default too; pinned explicitly, and the services smoke skips when the
      # flag is off (404 on the template surface).
      FEATURE_SERVICES: "true"
      # The SSL surface (BE-6.2) refuses credential writes without a secret
      # key; the domains smoke exercises the DNS-provider CRUD path.
      GOTHAM_SECRET_KEY: "ui-e2e-secret-key-not-for-production"
      GOTHAM_E2E_BASE_URL: http://127.0.0.1:8099
      # The smoke account is a platform operator so the platform-global DNS
      # surface (BE-8.2) is reachable; per-application cert/redirect management
      # stays team-scoped.
      GOTHAM_E2E_EMAIL: ui-e2e-admin@example.com
      PLATFORM_ADMINS: ui-e2e-admin@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Migrate test database
        run: go run ./cmd/gotham migrate up

      - name: Build control plane
        run: go build -o bin/gotham ./cmd/gotham

      - name: Stop any leftover control plane
        run: pkill -f 'bin/gotham serve' || true

      - name: Start control plane
        run: |
          nohup ./bin/gotham serve > gotham-ui-e2e.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8099/healthz" >/dev/null; then
              echo "control plane is up"
              exit 0
            fi
            sleep 1
          done
          echo "control plane failed to become healthy"
          cat gotham-ui-e2e.log
          exit 1

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke
        working-directory: web
        run: npm run e2e

      - name: Show control-plane log on failure
        if: failure()
        run: cat gotham-ui-e2e.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop control plane
        if: always()
        run: pkill -f 'bin/gotham serve' || true
