name: linkding-plus
icon: linkding-plus
description: A self-hosted bookmark manager designed to be minimal, fast, and easy to set up. (Includes feature for archiving websites as HTML snapshots)
homepage: https://linkding.link/
category:
  - rss
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: superuser_name
    label: Admin user
    type: text
    required: false
    default: admin
    help: Created on first start; change the password after signing in.
    pattern: ^[A-Za-z0-9_.@+-]{1,150}$
    max_length: 150
  - key: superuser_password
    label: Admin password
    type: secret
    required: true
    help: Password of the account created on first start.
    generate: true
routes:
  - service: linkding-plus
    port: 9090
    domain_field: domain
