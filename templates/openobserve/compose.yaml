services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.1.2
    restart: unless-stopped
    ports:
      - "5080"
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: "{{ .root_email }}"
      ZO_ROOT_USER_PASSWORD: "{{ .root_password }}"
      ZO_TELEMETRY: "false"
      ZO_COOKIE_SECURE_ONLY: "true"
    volumes:
      - openobserve_data:/data
volumes:
  openobserve_data:
