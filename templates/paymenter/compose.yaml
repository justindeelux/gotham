services:
  paymenter:
    image: ghcr.io/paymenter/paymenter:v1.5.9
    restart: unless-stopped
    ports:
      - "80"
    environment:
      APP_ENV: production
      APP_KEY: "{{ .app_key }}"
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: "{{ .db_name }}"
      DB_USERNAME: "{{ .db_user }}"
      DB_PASSWORD: "{{ .db_password }}"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_USERNAME: default
      REDIS_PASSWORD: "{{ .redis_password }}"
    volumes:
      - paymenter_logs:/app/storage/logs
      - paymenter_extensions:/app/extensions
      - paymenter_themes:/app/themes
      - paymenter_storage:/app/storage/app
      - paymenter_public_storage:/app/storage/app/public
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 1s
      retries: 3
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
  mariadb:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "{{ .db_root_password }}"
      MYSQL_DATABASE: "{{ .db_name }}"
      MYSQL_USER: "{{ .db_user }}"
      MYSQL_PASSWORD: "{{ .db_password }}"
    volumes:
      - paymenter_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "{{ .redis_password }}"]
    volumes:
      - paymenter_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 1s
      retries: 3
volumes:
  paymenter_logs:
  paymenter_extensions:
  paymenter_themes:
  paymenter_storage:
  paymenter_public_storage:
  paymenter_mariadb_data:
  paymenter_redis_data:
