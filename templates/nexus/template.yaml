name: Nexus Repository
icon: nexus
description: Sonatype Nexus Repository Manager with a persistent data volume and an optional routed domain.
homepage: https://help.sonatype.com/en/sonatype-nexus-repository.html
category:
  - devtools
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page. The first sign-in is admin / admin123; change that password right away.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: nexus
    port: 8081
    domain_field: domain
