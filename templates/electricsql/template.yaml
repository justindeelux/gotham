name: ElectricSQL
icon: electricsql
description: Electric sync service for Postgres with a persistent storage volume and an optional routed domain.
homepage: https://electric-sql.com/docs/guides/deployment
category:
  - backend
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: database_url
    label: Postgres URL
    type: secret
    required: true
    help: "postgres://user:password@host:5432/db on a Postgres with logical replication enabled."
  - key: secret
    label: Sync secret
    type: secret
    required: true
    generate: true
    help: Appended to shape requests by your backend; use Generate for a strong value.
routes:
  - service: electric
    port: 3000
    domain_field: domain
