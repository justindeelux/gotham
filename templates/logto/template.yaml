name: Logto
icon: logto
description: Logto identity platform with PostgreSQL and a persistent database volume.
homepage: https://docs.logto.io/docs/tutorials/get-started/
category:
  - auth
fields:
  - key: domain
    label: Domain
    type: text
    required: true
    placeholder: login.example.com
    help: Public host of the Logto API and admin console.
    pattern: ^[A-Za-z0-9][A-Za-z0-9.-]*$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: logto
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: db_name
    label: Database name
    type: text
    default: logto
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
routes:
  - service: logto
    port: 3001
    domain_field: domain
