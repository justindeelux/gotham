services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:3.3.0
    restart: unless-stopped
    ports:
      - "8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
    volumes:
      - stirling_training_data:/usr/share/tesseract-ocr/5/tessdata
      - stirling_configs:/configs
      - stirling_custom_files:/customFiles/
      - stirling_logs:/logs/
volumes:
  stirling_training_data:
  stirling_configs:
  stirling_custom_files:
  stirling_logs:
