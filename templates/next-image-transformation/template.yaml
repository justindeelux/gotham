name: next-image-transformation
icon: next-image-transformation
description: Drop-in replacement for Vercel's Nextjs image optimization service.
homepage: https://github.com/coollabsio/next-image-transformation
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: next-image-transformation
    port: 3000
    domain_field: domain
