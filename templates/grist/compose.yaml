services:
  grist:
    image: gristlabs/grist:1.7.22
    restart: unless-stopped
    ports:
      - "8484"
    environment:
      APP_HOME_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      APP_DOC_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      GRIST_DOMAIN: "${GOTHAM_DOMAIN:-localhost}"
      TZ: "${TZ:-UTC}"
      GRIST_SUPPORT_ANON: "false"
      GRIST_FORCE_LOGIN: "true"
      COOKIE_MAX_AGE: "86400000"
      GRIST_PAGE_TITLE_SUFFIX: " - Grist"
      GRIST_HIDE_UI_ELEMENTS: billing,sendToDrive,supportGrist,multiAccounts,tutorials
      GRIST_UI_FEATURES: helpCenter,billing,templates,createSite,multiSite,sendToDrive,tutorials,supportGrist
      GRIST_DEFAULT_EMAIL: "${GRIST_DEFAULT_EMAIL:-admin@example.com}"
      GRIST_ORG_IN_PATH: "true"
      GRIST_SESSION_SECRET: "{{ .session_secret }}"
      GRIST_HOME_INCLUDE_STATIC: "true"
      GRIST_SANDBOX_FLAVOR: "${SANDBOX_FLAVOR:-gvisor}"
      ALLOWED_WEBHOOK_DOMAINS: "${ALLOWED_WEBHOOK_DOMAINS:-}"
      COMMENTS: "true"
      TYPEORM_TYPE: postgres
      TYPEORM_DATABASE: grist
      TYPEORM_USERNAME: "{{ .db_user }}"
      TYPEORM_PASSWORD: "{{ .db_password }}"
      TYPEORM_HOST: postgres
      TYPEORM_PORT: "5432"
      TYPEORM_LOGGING: "false"
      REDIS_URL: redis://redis:6379
      GRIST_HELP_CENTER: "https://${GOTHAM_DOMAIN:-localhost}/help"
      GRIST_TERMS_OF_SERVICE_URL: "https://${GOTHAM_DOMAIN:-localhost}/terms"
    volumes:
      - grist_data:/persist
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: grist
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
    volumes:
      - grist_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - grist_redis_data:/data
volumes:
  grist_data:
  grist_postgres_data:
  grist_redis_data:
