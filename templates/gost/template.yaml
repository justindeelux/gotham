name: gost
icon: gost
description: Lightweight SOCKS5 and HTTP forward proxy from gost v3, protected by a username and a generated password.
homepage: https://gost.run
category:
  - proxy
fields:
  - key: http_port
    label: HTTP proxy port
    type: number
    default: 8080
    min: 1024
    max: 65535
    help: Host port clients use for HTTP and HTTPS (CONNECT) proxying.
  - key: socks_port
    label: SOCKS5 proxy port
    type: number
    default: 1080
    min: 1024
    max: 65535
    help: Host port clients use for SOCKS5 proxying.
  - key: username
    label: Username
    type: text
    default: gotham
    pattern: ^[A-Za-z0-9._-]{1,32}$
    max_length: 32
    help: Required by both proxies; letters, digits, dots, dashes and underscores only.
  - key: password
    label: Password
    type: secret
    required: true
    generate: true
    help: "Use Generate. gost reads it from the listener URL, so a value with @, : or / breaks startup."
