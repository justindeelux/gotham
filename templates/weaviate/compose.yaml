services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.5
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8080"
    environment:
      DISABLE_TELEMETRY: "true"
      QUERY_DEFAULTS_LIMIT: "1000"
      LOG_LEVEL: info
      GOMEMLIMIT: 1024MiB
      GOMAXPROCS: "2"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "{{ .api_key }}"
      AUTHENTICATION_APIKEY_USERS: "{{ .admin_user }}"
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: "{{ .admin_user }}"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      ENABLE_MODULES: text2vec-openai,generative-openai,qna-openai
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
volumes:
  weaviate_data:
