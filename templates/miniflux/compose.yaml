services:
  miniflux:
    image: ghcr.io/miniflux/miniflux:2.3.5
    restart: unless-stopped
    ports:
      - '8080'
    environment:
      BASE_URL: https://${GOTHAM_DOMAIN:-localhost}
      PORT: '8080'
      RUN_MIGRATIONS: '1'
      CREATE_ADMIN: '1'
      ADMIN_USERNAME: '{{ .admin_username }}'
      ADMIN_PASSWORD: '{{ .admin_password }}'
      DATABASE_URL: postgres://{{ .db_user }}:{{ .db_password }}@postgres:5432/miniflux-db?sslmode=disable
    depends_on:
      - postgres
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: '{{ .db_user }}'
      POSTGRES_PASSWORD: '{{ .db_password }}'
      POSTGRES_DB: miniflux-db
    volumes:
      - miniflux_postgres_data:/var/lib/postgresql
volumes:
  miniflux_postgres_data:
