name: Evolution API
icon: evolution-api
description: Evolution API messaging gateway with PostgreSQL and Redis, persistent named volumes and a routed domain.
homepage: https://doc.evolution-api.com/v2/en/get-started/introduction
category:
  - backend
fields:
  - key: domain
    label: Domain
    type: text
    required: true
    placeholder: app.example.com
    help: The public host served by the node's Traefik proxy.
    pattern: ^[A-Za-z0-9][A-Za-z0-9.-]*$
    max_length: 253
  - key: api_key
    label: API key
    type: secret
    required: true
    generate: true
    help: Sent as the apikey header by every client; use Generate for a strong value.
  - key: db_name
    label: Database name
    type: text
    default: evolution
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: evolution
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
    help: Used by Evolution API and PostgreSQL; use Generate for a strong value.
routes:
  - service: evolution-api
    port: 8080
    domain_field: domain
