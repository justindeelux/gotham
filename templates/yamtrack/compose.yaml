services:
  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack:0.26.3
    restart: unless-stopped
    ports:
      - "8000"
    environment:
      URLS: "https://${GOTHAM_DOMAIN:-localhost}"
      SECRET: "{{ .secret }}"
      REGISTRATION: "true"
      REDIS_URL: redis://redis:6379
    volumes:
      - yamtrack_data:/yamtrack/db
    depends_on:
      - redis
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - yamtrack_redis_data:/data
volumes:
  yamtrack_data:
  yamtrack_redis_data:
