services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    labels:
      gotham.domain: "{{ .domain }}"
      gotham.domain.port: "3001"
    ports:
      - "3001"
    environment:
      TZ: "{{ .tz }}"
    volumes:
      - uptime_kuma_data:/app/data
volumes:
  uptime_kuma_data:
