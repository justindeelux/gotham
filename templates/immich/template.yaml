name: immich
icon: immich
description: Self-hosted photo and video management solution.
homepage: https://immich.app/docs/overview/introduction
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    required: false
    default: immich
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: db_name
    label: Database name
    type: text
    required: false
    default: immich
    pattern: ^[A-Za-z0-9_-]{1,64}$
    max_length: 64
routes:
  - service: immich-server
    port: 2283
    domain_field: domain
