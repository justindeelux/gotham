services:
  classicpress:
    image: classicpress/classicpress:2.7.4-php8.5-apache
    restart: unless-stopped
    ports:
      - "80"
    environment:
      CLASSICPRESS_DB_HOST: mariadb
      CLASSICPRESS_DB_USER: "{{ .db_user }}"
      CLASSICPRESS_DB_PASSWORD: "{{ .db_password }}"
      CLASSICPRESS_DB_NAME: "{{ .db_name }}"
    volumes:
      - classicpress_files:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      interval: 2s
      timeout: 10s
      retries: 10
    depends_on:
      - mariadb
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "{{ .db_root_password }}"
      MYSQL_DATABASE: "{{ .db_name }}"
      MYSQL_USER: "{{ .db_user }}"
      MYSQL_PASSWORD: "{{ .db_password }}"
    volumes:
      - classicpress_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  classicpress_files:
  classicpress_mariadb_data:
