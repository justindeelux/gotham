services:
  firefly:
    image: fireflyiii/core:version-6.7.9
    restart: unless-stopped
    ports:
      - "8080"
    environment:
      APP_KEY: "{{ .app_key }}"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_CONNECTION: mysql
      DB_DATABASE: "{{ .db_name }}"
      DB_USERNAME: "{{ .db_user }}"
      DB_PASSWORD: "{{ .db_password }}"
      STATIC_CRON_TOKEN: "{{ .cron_token }}"
      TRUSTED_PROXIES: "*"
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    depends_on:
      - mysql
  mysql:
    image: mariadb:12
    restart: unless-stopped
    environment:
      MYSQL_USER: "{{ .db_user }}"
      MYSQL_PASSWORD: "{{ .db_password }}"
      MYSQL_DATABASE: "{{ .db_name }}"
      MYSQL_ROOT_PASSWORD: "{{ .db_root_password }}"
    volumes:
      - firefly_mysql_data:/var/lib/mysql
volumes:
  firefly_upload:
  firefly_mysql_data:
