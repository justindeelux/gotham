name: Grimmory
icon: grimmory
description: Grimmory book library with MariaDB, persistent data, books and bookdrop volumes, and an optional routed domain.
homepage: https://github.com/grimmory-tools/grimmory
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: books.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_name
    label: Database name
    type: text
    default: grimmory
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: grimmory
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: db_root_password
    label: MariaDB root password
    type: secret
    required: true
    generate: true
routes:
  - service: grimmory
    port: 80
    domain_field: domain
