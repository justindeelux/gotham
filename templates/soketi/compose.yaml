services:
  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    restart: unless-stopped
    ports:
      - "6001"
    environment:
      SOKETI_DEBUG: "0"
      SOKETI_DEFAULT_APP_ID: "{{ .app_id }}"
      SOKETI_DEFAULT_APP_KEY: "{{ .app_key }}"
      SOKETI_DEFAULT_APP_SECRET: "{{ .app_secret }}"
      SOKETI_PUSHER_SCHEME: https
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6001' || exit 1"]
      interval: 5s
      timeout: 20s
      retries: 3
