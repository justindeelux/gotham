name: Fizzy
icon: fizzy
description: Fizzy Kanban boards with SQLite and persistent named volumes.
homepage: https://github.com/basecamp/fizzy
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: fizzy.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: secret_key_base
    label: Secret key base
    type: secret
    required: true
    pattern: ^[A-Za-z0-9+/=_-]{64,}$
    max_length: 512
    help: At least 64 characters from `openssl rand -hex 64`; Rails signs cookies and sessions with it.
  - key: master_key
    label: Rails master key
    type: secret
    required: true
    pattern: ^[0-9a-f]{32}$
    max_length: 32
    help: Exactly 32 hexadecimal characters from `openssl rand -hex 16`; keep it with the service.
routes:
  - service: fizzy
    port: 80
    domain_field: domain
