name: Gitea
icon: gitea
description: Gitea lightweight Git service with a persistent data volume, SQLite storage and a routed domain.
homepage: https://docs.gitea.com
category:
  - git
fields:
  - key: domain
    label: Domain
    type: text
    required: true
    placeholder: app.example.com
    help: The public host served by the node's Traefik proxy.
    pattern: ^[A-Za-z0-9][A-Za-z0-9.-]*$
    max_length: 253
  - key: ssh_port
    label: SSH port
    type: number
    default: 22222
    min: 1024
    max: 65535
    help: Host port published for git over SSH; the container listens on 22.
routes:
  - service: gitea
    port: 3000
    domain_field: domain
