name: Termix
icon: termix
description: Termix SSH and remote desktop manager with a persistent data volume and an optional routed domain.
homepage: https://docs.termix.site/install/server/docker
category:
  - devtools
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: termix
    port: 8080
    domain_field: domain
