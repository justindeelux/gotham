# Gotham control-plane configuration example.
#
# Copy to gotham.yaml in the working directory and edit as needed. Every key is
# optional; the defaults shown below apply when a key is omitted. A missing
# gotham.yaml is not an error.
#
# Environment variables override the file. Supported variables:
#   GOTHAM_SERVER_ADDR, GOTHAM_SERVER_PORT, GOTHAM_DATABASE_DSN,
#   GOTHAM_REDIS_ADDR, GOTHAM_LOG_LEVEL, GOTHAM_LOG_FORMAT,
#   GOTHAM_AUTH_JWT_PRIVATE_KEY_PATH, GOTHAM_AUTH_JWT_PUBLIC_KEY_PATH,
#   GOTHAM_OAUTH_GITHUB_CLIENT_ID, GOTHAM_OAUTH_GITHUB_CLIENT_SECRET,
#   GOTHAM_OAUTH_GITHUB_REDIRECT_URL,
#   GOTHAM_GRPC_ADDR, GOTHAM_CA_DIR, GOTHAM_SECRET_KEY

# HTTP listener.
server:
  # Interface to bind. Default: 0.0.0.0
  addr: 0.0.0.0
  # TCP port to listen on. Default: 8000
  port: 8000

# PostgreSQL connection.
database:
  # libpq/pgx connection string used by the health check, the store, and the
  # embedded migrations (`gotham migrate` / `make migrate`).
  # Default: postgres://gotham:gotham@localhost:5432/gotham?sslmode=disable
  dsn: postgres://gotham:gotham@localhost:5432/gotham?sslmode=disable

# Redis connection.
redis:
  # host:port of the Redis server. Default: localhost:6379
  addr: localhost:6379

# gRPC gateway that node agents dial (AgentService + UpdateService).
grpc:
  # host:port to bind. Default: :9442
  addr: ":9442"

# Certificate authority used to issue agent and control-plane mTLS certificates.
ca:
  # Directory holding ca.crt and ca.key. When the CA is absent the gateway
  # falls back to an insecure listener (development only). Default: ./data/ca/
  dir: ./data/ca/

# Secret used to encrypt stored SSH private keys (AES-256-GCM). When empty an
# ephemeral secret is generated at startup and a warning is logged: encrypted
# keys then do not survive a restart.
# secret_key: <32+ random bytes, e.g. `openssl rand -base64 32`>

# Logging.
log:
  # One of: debug, info, warn, error. Default: info
  level: info
  # One of: json, text. Default: json
  format: json

# Authentication.
auth:
  # PEM-encoded Ed25519 keypair signing access tokens. The private key must be
  # PKCS#8 ("PRIVATE KEY") and the public key PKIX ("PUBLIC KEY"), as produced
  # by `openssl genpkey -algorithm ed25519`. Both paths must be set together.
  # When unset, an ephemeral keypair is generated at startup and sessions do not
  # survive a restart.
  # jwt_private_key_path: /etc/gotham/jwt_ed25519.key
  # jwt_public_key_path: /etc/gotham/jwt_ed25519.pub

# OAuth2 identity providers. A provider is disabled while its client_id or
# client_secret is empty; its login route then answers 404.
oauth:
  github:
    # GitHub OAuth app credentials (Settings > Developer settings > OAuth apps).
    # The app's "Authorization callback URL" must be:
    #   http://localhost:8000/api/v1/auth/oauth/github/callback
    # client_id: <github-oauth-app-client-id>
    # client_secret: <github-oauth-app-client-secret>
    # Must match the registered callback URL. When empty the browser is sent to
    # a relative /oauth/callback route on the current origin.
    # redirect_url: http://localhost:8000/api/v1/auth/oauth/github/callback

# Hot reload: Gotham watches this file (fsnotify) and re-applies changes at
# runtime, including the log level. No SIGHUP signal is required.
