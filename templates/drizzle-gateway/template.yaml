name: Drizzle Gateway
icon: drizzle-gateway
description: Drizzle Studio gateway with a persistent store and an optional routed domain.
homepage: https://gateway.drizzle.team/
category:
  - devtools
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: masterpass
    label: Master password
    type: secret
    required: true
    generate: true
    help: Unlocks the gateway; use Generate for a strong value.
routes:
  - service: drizzle-gateway
    port: 4983
    domain_field: domain
