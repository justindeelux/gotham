name: InfluxDB
icon: influxdb
description: InfluxDB time series database with an initial organisation, bucket and admin token, on persistent volumes and an optional routed domain.
homepage: https://docs.influxdata.com/influxdb/
category:
  - database
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: influx.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: admin_user
    label: Admin user
    type: text
    default: admin
    pattern: ^[A-Za-z0-9_.-]{1,64}$
    max_length: 64
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
    help: InfluxDB requires at least 8 characters.
  - key: admin_token
    label: Admin token
    type: secret
    required: true
    generate: true
  - key: org
    label: Organisation
    type: text
    default: home
    pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
    max_length: 64
  - key: bucket
    label: Bucket
    type: text
    default: home
    pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
    max_length: 64
routes:
  - service: influxdb
    port: 8086
    domain_field: domain
