# Gotham node-agent update configuration (root-owned).
#
# Install this file at /etc/gotham/agent-updater.conf, owned root:root mode 0644.
# It is read by the shared deploy/gotham-update.sh wrapper when that script is
# installed under the name /usr/libexec/gotham/gotham-agent-update. Keep it
# root-owned and outside every path the gotham-agent service user can write: the
# wrapper takes no arguments and (under sudo) ignores GOTHAM_* environment
# overrides, so these values are the only thing that decides which binary,
# service, health URL, status and lock it touches.

# The agent binary the updater swaps. Keep it in the unit's StateDirectory, so
# it is owned by gotham-agent: the updater hardlinks it to <binary>.old and
# fs.protected_hardlinks=1 refuses a hardlink to a file the user cannot write.
GOTHAM_BINARY=/var/lib/gotham-agent/bin/gotham-agent

# The systemd unit to restart.
GOTHAM_SERVICE=gotham-agent

# Loopback health endpoint probed after the restart. The agent serves /healthz
# on this address as a process-liveness check. Only loopback http URLs without
# userinfo/query/fragment are accepted.
GOTHAM_HEALTH=http://127.0.0.1:8001/healthz

# Seconds to wait for the health endpoint before rolling back.
GOTHAM_TIMEOUT=30

# Authoritative outcome, written by the wrapper into a root-owned directory the
# agent can only read. Install:
#   install -d -m 0755 -o root -g root /var/lib/gotham-agent-updater
GOTHAM_STATUS=/var/lib/gotham-agent-updater/update.status

# Agent-owned pending marker (in the service StateDirectory). It gates a second
# apply until the outcome is recorded, and the wrapper removes it.
GOTHAM_PENDING=/var/lib/gotham-agent/update.pending

# Lock shared with the agent's Apply/Rollback.
GOTHAM_LOCK=/var/lib/gotham-agent/update.lock
