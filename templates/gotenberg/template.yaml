name: Gotenberg
icon: gotenberg
description: Gotenberg stateless PDF conversion API with basic auth and an optional routed domain.
homepage: https://gotenberg.dev/docs/getting-started/introduction
category:
  - devtools
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: api_user
    label: API user
    type: text
    default: gotenberg
    pattern: ^[A-Za-z0-9_.-]{1,32}$
    max_length: 32
  - key: api_password
    label: API password
    type: secret
    required: true
    generate: true
    help: Sent with every request; use Generate for a strong value.
routes:
  - service: gotenberg
    port: 3000
    domain_field: domain
