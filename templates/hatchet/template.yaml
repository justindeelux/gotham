name: Hatchet
icon: hatchet
description: Hatchet background task platform with PostgreSQL and RabbitMQ, persistent named volumes and an optional routed domain.
homepage: https://docs.hatchet.run/self-hosting/docker-compose
category:
  - automation
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: hatchet.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: postgres_password
    label: PostgreSQL password
    type: secret
    required: true
    generate: true
  - key: rabbitmq_password
    label: RabbitMQ password
    type: secret
    required: true
    generate: true
routes:
  - service: hatchet-dashboard
    port: 80
    domain_field: domain
