services:
  nodebb:
    image: ghcr.io/nodebb/nodebb:4.16.8
    restart: unless-stopped
    ports:
      - "4567"
    environment:
      DB_USER: "{{ .db_user }}"
      DB_PASSWORD: "{{ .db_password }}"
    volumes:
      - nodebb_build:/usr/src/app/build
      - nodebb_uploads:/usr/src/app/public/uploads
      - nodebb_config:/opt/config
    command:
      - /bin/bash
      - -c
      - |
        cat > /usr/src/app/setup.json <<EOL
        {
          "defaults": {
            "postgres": {
              "host": "postgres",
              "port": 5432,
              "database": "nodebb",
              "username": "$${DB_USER}",
              "password": "$${DB_PASSWORD}"
            }
          }
        }
        EOL
        exec tini -- entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/4567' || exit 1"]
      interval: 5s
      timeout: 20s
      retries: 3

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: nodebb
    volumes:
      - nodebb_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  nodebb_build:
  nodebb_uploads:
  nodebb_config:
  nodebb_postgres_data:
