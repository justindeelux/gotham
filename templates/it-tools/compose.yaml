services:
  it-tools:
    image: corentinth/it-tools:2024.10.22-7ca5933
    restart: unless-stopped
    ports:
      - "80"
    volumes:
      - it_tools_data:/app/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:80
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  it_tools_data:
