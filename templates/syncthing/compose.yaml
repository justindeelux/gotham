services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:2.1.7
    restart: unless-stopped
    ports:
      - "8384"
      - "22000"
      - "21027/udp"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "{{ .timezone }}"
    volumes:
      - syncthing_config:/config
      - syncthing_data:/data1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8384/"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  syncthing_config:
  syncthing_data:
