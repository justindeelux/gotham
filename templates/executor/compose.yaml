services:
  executor:
    image: ghcr.io/rhyssullivan/executor-selfhost:1.6.10
    restart: unless-stopped
    ports:
      - "4788"
    environment:
      EXECUTOR_WEB_BASE_URL: "https://{{ .domain }}"
      EXECUTOR_HOST: 0.0.0.0
      EXECUTOR_DATA_DIR: /data
      EXECUTOR_DB_PATH: /data/data.db
      EXECUTOR_ALLOW_LOCAL_NETWORK: "false"
    volumes:
      - executor_data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:4788/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  executor_data:
