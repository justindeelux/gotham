name: imgcompress
icon: imgcompress
description: Offline image compression, conversion, and AI background removal for Docker homelabs.
homepage: https://imgcompress.karimzouine.com
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: imgcompress
    port: 5000
    domain_field: domain
