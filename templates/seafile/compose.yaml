services:
  seafile:
    image: seafileltd/seafile-mc:12.0-latest
    restart: unless-stopped
    ports:
      - "80"
    environment:
      SEAFILE_SERVER_HOSTNAME: "{{ .domain }}"
      SEAFILE_SERVER_PROTOCOL: https
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_ROOT_PASSWD: "{{ .mysql_root_password }}"
      DB_USER: "{{ .mysql_user }}"
      DB_PASSWORD: "{{ .mysql_password }}"
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      TIME_ZONE: UTC
      INIT_SEAFILE_ADMIN_EMAIL: "{{ .admin_email }}"
      INIT_SEAFILE_ADMIN_PASSWORD: "{{ .admin_password }}"
      JWT_PRIVATE_KEY: "{{ .jwt_private_key }}"
      FILE_SERVER_ROOT: "https://{{ .domain }}/seafhttp"
      ENABLE_SEADOC: "true"
      SEADOC_SERVER_URL: http://seadoc
      SEAFILE_LOG_TO_STDOUT: "true"
    volumes:
      - seafile_data:/shared
    depends_on:
      mariadb:
        condition: service_healthy
      memcached:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/api2/ping"]
      interval: 10s
      timeout: 20s
      retries: 5
  seadoc:
    image: seafileltd/sdoc-server:1.0-latest
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: "{{ .mysql_user }}"
      DB_PASSWORD: "{{ .mysql_password }}"
      DB_NAME: seahub_db
      TIME_ZONE: UTC
      JWT_PRIVATE_KEY: "{{ .jwt_private_key }}"
      SEAHUB_SERVICE_URL: http://seafile
    volumes:
      - seadoc_data:/shared
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/ping"]
      interval: 10s
      timeout: 20s
      retries: 5
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "{{ .mysql_root_password }}"
      MYSQL_USER: "{{ .mysql_user }}"
      MYSQL_PASSWORD: "{{ .mysql_password }}"
      MYSQL_DATABASE: seafile_db
    volumes:
      - seafile_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 20s
      retries: 5
  memcached:
    image: memcached:1.6.45
    restart: unless-stopped
    entrypoint: ["memcached", "-m", "256"]
volumes:
  seafile_data:
  seadoc_data:
  seafile_mariadb_data:
