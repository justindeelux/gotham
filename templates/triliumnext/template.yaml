name: TriliumNext
icon: triliumnext
description: TriliumNext Notes builds a personal knowledge base with notes, todos and wikis in a persistent named volume.
homepage: https://github.com/TriliumNext/Trilium
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: notes.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: timezone
    label: Timezone
    type: text
    default: UTC
    placeholder: Europe/Berlin
    pattern: ^[A-Za-z0-9_/+-]+$
    max_length: 64
    help: IANA timezone name used by the container clock.
routes:
  - service: triliumnext
    port: 8080
    domain_field: domain
