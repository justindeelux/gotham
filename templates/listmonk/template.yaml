name: Listmonk
icon: listmonk
description: Listmonk newsletter and mailing list manager with PostgreSQL, persistent named volumes and an optional routed domain.
homepage: https://listmonk.app/
category:
  - email
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: lists.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: listmonk
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: listmonk
    port: 9000
    domain_field: domain
