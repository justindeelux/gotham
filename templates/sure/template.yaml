name: Sure
icon: sure
description: "Sure personal finance platform with PostgreSQL, Valkey and a background worker. Sign-up is open, so the first visitor can create the admin account."
homepage: https://github.com/we-promise/sure
category:
  - finance
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: money.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: secret_key_base
    label: Rails secret key base
    type: secret
    generate:
      length: 128
      charset: hex
  - key: db_name
    label: Database name
    type: text
    default: sure
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: sure
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: web
    port: 3000
    domain_field: domain
