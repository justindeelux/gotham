name: LibreSpeed
icon: librespeed
description: LibreSpeed lightweight self-hosted speed test with an optional routed domain.
homepage: https://github.com/librespeed/speedtest
category:
  - devtools
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: librespeed
    port: 82
    domain_field: domain
