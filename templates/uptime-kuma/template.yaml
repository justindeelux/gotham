name: Uptime Kuma
icon: uptime-kuma
description: Uptime Kuma monitoring with a persistent named volume and an optional routed domain.
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: status.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: tz
    label: Timezone
    type: text
    default: UTC
    placeholder: Europe/Berlin
    pattern: ^[A-Za-z0-9_/+-]+$
    max_length: 64
    help: IANA timezone name used by the container clock and notifications.
routes:
  - service: uptime-kuma
    port: 3001
    domain_field: domain
