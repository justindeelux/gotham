name: Docmost
icon: docmost
description: Docmost collaborative wiki with PostgreSQL, Redis and persistent volumes.
homepage: https://docmost.com/docs/
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: wiki.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: docmost
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: app_secret
    label: Application secret
    type: secret
    required: true
    generate: true
    help: Signs sessions; use Generate for a strong value.
routes:
  - service: docmost
    port: 3000
    domain_field: domain
