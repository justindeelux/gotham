name: Orbit
icon: orbit
description: Orbit is a self-hosted team workspace with tasks, docs, chat and an MCP server for AI clients, with persistent named volumes.
homepage: https://github.com/coollabsio/orbit/blob/main/docs/operations.md
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: orbit.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: app_key
    label: App key
    type: secret
    generate:
      length: 32
      charset: base64
routes:
  - service: orbit
    port: 8080
    domain_field: domain
