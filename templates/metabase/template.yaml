name: Metabase
icon: metabase
description: "Metabase analytics with PostgreSQL, persistent named volumes and an optional routed domain."
homepage: https://www.metabase.com
category:
  - analytics
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: metabase.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: metabase
    port: 3000
    domain_field: domain
