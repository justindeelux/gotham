name: Directus
icon: directus
description: Directus content platform on SQLite, with persistent database, uploads, extensions and templates volumes.
homepage: https://directus.io
category:
  - cms
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: cms.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: admin_email
    label: Admin email
    type: text
    default: admin@example.com
    pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    max_length: 254
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
  - key: app_key
    label: Key
    type: secret
    required: true
    generate: true
  - key: app_secret
    label: Secret
    type: secret
    required: true
    generate: true
routes:
  - service: directus
    port: 8055
    domain_field: domain
