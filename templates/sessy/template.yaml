name: Sessy
icon: sessy
description: "Email observability behind HTTP basic auth, with a persistent named volume and an optional routed domain."
homepage: https://github.com/marckohlbrugge/sessy/blob/main/docs/docker-deployment.md
category:
  - monitoring
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: sessy.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: auth_user
    label: HTTP auth user
    type: text
    default: admin
    pattern: ^[A-Za-z0-9_.-]{1,64}$
    max_length: 64
  - key: auth_password
    label: HTTP auth password
    type: secret
    required: true
    generate: true
  - key: secret_key
    label: Application secret key
    type: secret
    required: true
    generate: true
    help: Signs sessions and tokens; use Generate for a strong value.
routes:
  - service: sessy
    port: 80
    domain_field: domain
