services:
  peertube:
    image: chocobozzz/peertube:v8.3.2
    restart: unless-stopped
    ports:
      - '9000'
    environment:
      PEERTUBE_WEBSERVER_HOSTNAME: ${GOTHAM_DOMAIN:-localhost}
      PEERTUBE_WEBSERVER_PORT: '443'
      PEERTUBE_WEBSERVER_HTTPS: 'true'
      PEERTUBE_TRUST_PROXY: '["127.0.0.1", "loopback", "172.16.0.0/12"]'
      PEERTUBE_SECRET: '{{ .peertube_secret }}'
      PEERTUBE_DB_HOSTNAME: postgres
      PEERTUBE_DB_USERNAME: '{{ .db_user }}'
      PEERTUBE_DB_PASSWORD: '{{ .db_password }}'
      PEERTUBE_DB_NAME: peertube
      PEERTUBE_DB_SSL: 'false'
      PEERTUBE_REDIS_HOSTNAME: redis
      PEERTUBE_SMTP_HOSTNAME: postfix
      PEERTUBE_SMTP_PORT: '25'
      PEERTUBE_SMTP_FROM: noreply@${GOTHAM_DOMAIN:-localhost}
      PEERTUBE_SMTP_TLS: 'false'
      PEERTUBE_SMTP_DISABLE_STARTTLS: 'false'
      PEERTUBE_ADMIN_EMAIL: '{{ .admin_email }}'
    volumes:
      - peertube_data:/data
      - peertube_config:/config
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: '{{ .db_user }}'
      POSTGRES_PASSWORD: '{{ .db_password }}'
      POSTGRES_DB: peertube
    volumes:
      - peertube_db:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - peertube_redis:/data
  postfix:
    image: mwader/postfix-relay:1.2.17
    restart: unless-stopped
    environment:
      POSTFIX_myhostname: ${GOTHAM_DOMAIN:-localhost}
volumes:
  peertube_data:
  peertube_config:
  peertube_db:
  peertube_redis:
