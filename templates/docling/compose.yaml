services:
  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.38.2
    restart: unless-stopped
    ports:
      - "5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_LOG_LEVEL: WARNING
      DOCLING_NUM_THREADS: "4"
    volumes:
      - docling_cache:/root/.cache
volumes:
  docling_cache:
