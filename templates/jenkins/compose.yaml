services:
  jenkins:
    image: jenkins/jenkins:2.590
    restart: unless-stopped
    ports:
      - "8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/login
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  jenkins_home:
