name: LibreChat
icon: librechat
description: LibreChat with MongoDB, Meilisearch and a pgvector RAG API, persistent named volumes and an optional routed domain.
homepage: https://docs.librechat.ai/install/configuration/dotenv.html
category:
  - ai
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: chat.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: mongo_password
    label: MongoDB password
    type: secret
    required: true
    generate: true
  - key: meili_key
    label: Meilisearch key
    type: secret
    required: true
    generate: true
  - key: jwt_secret
    label: JWT secret
    type: secret
    required: true
    generate: true
  - key: jwt_refresh_secret
    label: JWT refresh secret
    type: secret
    required: true
    generate: true
  - key: creds_key
    label: Credentials key
    type: secret
    generate:
      length: 64
      charset: hex
  - key: creds_iv
    label: Credentials IV
    type: secret
    generate:
      length: 32
      charset: hex
  - key: db_password
    label: Vector database password
    type: secret
    required: true
    generate: true
routes:
  - service: librechat
    port: 3080
    domain_field: domain
