name: Lowcoder
icon: lowcoder
description: Lowcoder low-code platform with a persistent named volume and a routed domain.
homepage: https://docs.lowcoder.cloud/
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: apps.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: encryption_password
    label: Encryption password
    type: secret
    required: true
    generate: true
    help: Encrypts stored data sources; keep it with the service.
  - key: encryption_salt
    label: Encryption salt
    type: secret
    required: true
    generate: true
routes:
  - service: lowcoder
    port: 3000
    domain_field: domain
