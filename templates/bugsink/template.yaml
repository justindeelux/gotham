name: Bugsink
icon: bugsink
description: "Self-hosted error tracking with PostgreSQL, a persistent named volume and an optional routed domain."
homepage: https://www.bugsink.com/docs/
category:
  - monitoring
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: errors.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: admin_email
    label: Admin email
    type: text
    default: admin@example.com
    pattern: ^[^:@\s]+@[^:@\s]+$
    max_length: 254
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: secret_key
    label: Application secret key
    type: secret
    required: true
    generate: true
    help: Signs sessions and tokens; use Generate for a strong value.
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
routes:
  - service: bugsink
    port: 8000
    domain_field: domain
