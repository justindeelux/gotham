services:
  leantime:
    image: leantime/leantime:3.15.0
    restart: unless-stopped
    ports:
      - "8080"
    environment:
      LEAN_APP_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      LEAN_DB_HOST: mysql
      LEAN_DB_USER: "{{ .db_user }}"
      LEAN_DB_PASSWORD: "{{ .db_password }}"
      LEAN_DB_DATABASE: leantime
      LEAN_SESSION_PASSWORD: "{{ .session_password }}"
      LEAN_SESSION_EXPIRATION: "28800"
      LEAN_USE_REDIS: "true"
      LEAN_REDIS_HOST: redis
      LEAN_REDIS_PORT: "6379"
      LEAN_REDIS_SCHEME: tcp
    volumes:
      - public_userfiles:/var/www/html/public/userfiles
      - userfiles:/var/www/html/userfiles
      - plugins:/var/www/html/app/Plugins
    depends_on:
      - mysql
      - redis
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=UTF8MB4", "--collation-server=UTF8MB4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: "{{ .db_root_password }}"
      MYSQL_USER: "{{ .db_user }}"
      MYSQL_PASSWORD: "{{ .db_password }}"
      MYSQL_DATABASE: leantime
    volumes:
      - leantime_mysql_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - leantime_redis_data:/data
volumes:
  public_userfiles:
  userfiles:
  plugins:
  leantime_mysql_data:
  leantime_redis_data:
