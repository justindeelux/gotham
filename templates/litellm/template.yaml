name: LiteLLM
icon: litellm
description: LiteLLM gateway with PostgreSQL and Redis, persistent named volumes and an optional routed domain.
homepage: https://docs.litellm.ai
category:
  - ai
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: litellm.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: master_key
    label: Master key
    type: secret
    required: true
    generate: true
  - key: salt_key
    label: Salt key
    type: secret
    required: true
    generate: true
  - key: admin_user
    label: Admin user
    type: text
    default: admin
    pattern: ^[A-Za-z0-9_.@-]{1,64}$
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: litellm
    port: 4000
    domain_field: domain
