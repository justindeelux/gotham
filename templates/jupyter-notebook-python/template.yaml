name: Jupyter Notebook
icon: jupyter-notebook-python
description: Jupyter base notebook for Python with a persistent work volume, a token sign-in and an optional routed domain.
homepage: https://jupyter.org/
category:
  - devtools
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: token
    label: Access token
    type: secret
    required: true
    generate: true
    help: The notebook sign-in token; use Generate for a strong value.
routes:
  - service: jupyter-notebook-python
    port: 8888
    domain_field: domain
