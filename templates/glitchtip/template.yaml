name: GlitchTip
icon: glitchtip
description: "GlitchTip error tracking with PostgreSQL and Redis, persistent named volumes and an optional routed domain."
homepage: https://glitchtip.com
category:
  - monitoring
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: errors.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: secret_key
    label: Application secret key
    type: secret
    required: true
    generate: true
    help: Signs sessions and tokens; use Generate for a strong value.
routes:
  - service: glitchtip
    port: 8000
    domain_field: domain
