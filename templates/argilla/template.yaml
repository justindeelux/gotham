name: Argilla
icon: argilla
description: Argilla dataset tooling with PostgreSQL, Redis and Elasticsearch, persistent named volumes and an optional routed domain.
homepage: https://docs.argilla.io/latest/
category:
  - ai
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: argilla.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: auth_secret
    label: Auth secret
    type: secret
    required: true
    generate: true
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
  - key: api_key
    label: API key
    type: secret
    required: true
    generate: true
routes:
  - service: argilla
    port: 6900
    domain_field: domain
