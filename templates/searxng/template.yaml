name: SearXNG
icon: searxng
description: "SearXNG metasearch with a Valkey cache, persistent named volumes and an optional routed domain."
homepage: https://docs.searxng.org
category:
  - search
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: search.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: secret_key
    label: Application secret key
    type: secret
    required: true
    generate: true
    help: Signs sessions and tokens; use Generate for a strong value.
routes:
  - service: searxng
    port: 8080
    domain_field: domain
