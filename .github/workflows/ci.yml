name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.scope.outputs.go }}
      web: ${{ steps.scope.outputs.web }}
      sqlc: ${{ steps.scope.outputs.sqlc }}
      proto: ${{ steps.scope.outputs.proto }}
      installer: ${{ steps.scope.outputs.installer }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Select checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" > changed.txt
            grep -qx '.github/workflows/ci.yml' changed.txt && all=true || all=false
          else
            all=true
          fi
          has() { [ "$all" = true ] || grep -qE "$1" changed.txt && echo true || echo false; }
          {
            echo "go=$(has '\.go$|^go\.(mod|sum)$|^Makefile$|^internal/|^agent/|^templates/|^\.golangci')"
            echo "web=$(has '^web/')"
            echo "sqlc=$(has '^internal/store/|sqlc\.ya?ml$|\.sql$')"
            echo "proto=$(has '^proto/|^buf|^Makefile$|\.pb\.go$')"
            echo "installer=$(has '^deploy/|^updatecore/|^\.github/workflows/')"
            echo "docs=$(has '^docs/')"
          } >> "$GITHUB_OUTPUT"

  build-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: fmt + vet + test + build (go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        go:
          - "1.27.x"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        if: ${{ hashFiles('go.sum') != '' }}
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

      - name: Upload gotham binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gotham-${{ matrix.os }}-go${{ matrix.go }}
          path: bin/gotham
          if-no-files-found: error

      - name: Upload gotham-agent binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gotham-agent-${{ matrix.os }}-go${{ matrix.go }}
          path: bin/gotham-agent
          if-no-files-found: error

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: web build + type-check + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install zsh for the real-PTY proof
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      - name: Type-check
        working-directory: web
        run: npm run type-check

      - name: Build
        working-directory: web
        run: npm run build

      - name: Frontend harness checks
        working-directory: web
        env:
          GOTHAM_REQUIRE_PTY_SHELLS: bash,zsh,sh
        run: npm test

      - name: Lint
        working-directory: web
        run: npm run lint

  sqlc:
    needs: changes
    if: needs.changes.outputs.sqlc == 'true'
    name: sqlc drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install sqlc
        run: |
          set -eu
          version="1.31.1"
          sha256="497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354"
          url="https://github.com/sqlc-dev/sqlc/releases/download/v${version}/sqlc_${version}_linux_amd64.tar.gz"
          curl -sSfL "${url}" -o sqlc.tar.gz
          echo "${sha256}  sqlc.tar.gz" | sha256sum --check --strict -
          tar -xzf sqlc.tar.gz
          chmod +x sqlc
          sudo mv sqlc /usr/local/bin/

      - name: Generate and check drift
        run: |
          sqlc generate
          if [ -n "$(git status --porcelain -- internal/store/sqlc)" ]; then
            echo "sqlc: generated code is out of date:"
            git status --porcelain -- internal/store/sqlc
            exit 1
          fi

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    name: proto lint + drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: Set up buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.73.0"

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: buf lint + generated-code drift check
        run: make proto-check

  db-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: DB-backed tests (postgres + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gotham
          POSTGRES_PASSWORD: gotham
          POSTGRES_DB: gotham_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U gotham -d gotham_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - "6380:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      GOTHAM_DATABASE_DSN: postgres://gotham:gotham@localhost:5433/gotham_test?sslmode=disable
      GOTHAM_TEST_DSN: postgres://gotham:gotham@localhost:5433/gotham_test?sslmode=disable
      GOTHAM_TEST_REDIS: 127.0.0.1:6380

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: Download modules
        if: ${{ hashFiles('go.sum') != '' }}
        run: go mod download

      - name: Apply migrations
        run: go run ./cmd/gotham migrate up

      - name: Run DB-backed tests
        run: go test ./internal/... -count=1

  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    name: installer scripts (shell + actionlint + release chain)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: Shell syntax check
        run: |
          for f in deploy/*.sh; do sh -n "$f"; done

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Release install chain (test-release-install.sh)
        run: sh deploy/test-release-install.sh

      - name: Agent reinstall behaviours (test-agent-install.sh)
        run: sh deploy/test-agent-install.sh

      - name: Host helper bootstrap (test-host-bootstrap.sh)
        run: sh deploy/test-host-bootstrap.sh

      - name: Host helper refresh (test-host-helper-refresh.sh)
        run: sh deploy/test-host-helper-refresh.sh

  docs:
    name: docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build
        working-directory: docs
        run: npm ci && npm run docs:build

  ci:
    name: CI gate
    if: always()
    needs: [build-test, lint, web, sqlc, proto, db-test, installer, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
