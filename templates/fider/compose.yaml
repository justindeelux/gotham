services:
  fider:
    image: getfider/fider:v0.40.0
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      BASE_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      DATABASE_URL: "postgres://{{ .db_user }}:{{ .db_password }}@database:5432/fider?sslmode=disable"
      JWT_SECRET: "{{ .jwt_secret }}"
      EMAIL_NOREPLY: "${EMAIL_NOREPLY:-noreply@example.com}"
      EMAIL_SMTP_HOST: "${EMAIL_SMTP_HOST:-}"
      EMAIL_SMTP_PORT: "${EMAIL_SMTP_PORT:-587}"
      EMAIL_SMTP_USERNAME: "${EMAIL_SMTP_USERNAME:-}"
      EMAIL_SMTP_PASSWORD: "${EMAIL_SMTP_PASSWORD:-}"
      EMAIL_SMTP_ENABLE_STARTTLS: "${EMAIL_SMTP_ENABLE_STARTTLS:-true}"
    depends_on:
      - database
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: fider
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
