name: LibreOffice
icon: libreoffice
description: LibreOffice in the browser with a persistent named volume and a routed domain.
homepage: https://docs.linuxserver.io/images/docker-libreoffice/
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: office.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: tz
    label: Timezone
    type: text
    default: UTC
    placeholder: Europe/Berlin
    pattern: ^[A-Za-z0-9_/+-]+$
    max_length: 64
    help: IANA timezone name used by the container clock.
routes:
  - service: libreoffice
    port: 3000
    domain_field: domain
