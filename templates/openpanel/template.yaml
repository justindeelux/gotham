name: Openpanel
icon: openpanel
description: "Openpanel product analytics with PostgreSQL, Redis and ClickHouse, routed on dashboard and API domains."
homepage: https://openpanel.dev/docs
category:
  - analytics
fields:
  - key: domain
    label: Dashboard domain
    type: text
    required: true
    placeholder: analytics.example.com
    help: Required; the dashboard reads its public URL at start.
    pattern: ^[A-Za-z0-9][A-Za-z0-9.-]*$
    max_length: 253
  - key: api_domain
    label: API domain
    type: text
    required: true
    placeholder: api.analytics.example.com
    help: Required; the dashboard and the browser reach the API on this host, so it must differ from the dashboard host.
    pattern: ^[A-Za-z0-9][A-Za-z0-9.-]*$
    max_length: 253
  - key: db_password
    label: PostgreSQL password
    type: secret
    required: true
    generate: true
  - key: redis_password
    label: Redis password
    type: secret
    required: true
    generate: true
  - key: cookie_secret
    label: Cookie secret
    type: secret
    required: true
    generate: true
    help: Signs dashboard cookies; use Generate for a strong value.
routes:
  - service: openpanel
    port: 3000
    domain_field: domain
  - service: openpanel-api
    port: 3000
    domain_field: api_domain
