services:
  ryot:
    image: ignisda/ryot:v10.5.8
    restart: unless-stopped
    ports:
      - "8000"
    environment:
      DATABASE_URL: "postgres://{{ .db_user }}:{{ .db_password }}@postgresql:5432/{{ .db_name }}"
      SERVER_ADMIN_ACCESS_TOKEN: "{{ .admin_token }}"
    depends_on:
      - postgresql
  postgresql:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: "{{ .db_name }}"
    volumes:
      - ryot_postgresql_data:/var/lib/postgresql
volumes:
  ryot_postgresql_data:
