name: GLPI
icon: glpi
description: GLPI IT service management with MySQL, persistent named volumes and an optional routed domain.
homepage: https://help.glpi-project.org/documentation
category:
  - helpdesk
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: helpdesk.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: glpi
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: db_root_password
    label: Database root password
    type: secret
    required: true
    generate: true
routes:
  - service: glpi
    port: 80
    domain_field: domain
