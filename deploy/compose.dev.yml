# Gotham dev stack.
#
# Starts PostgreSQL 16 and Redis 7 with fixed host ports and a named data
# volume so local development matches the production dependencies.
#
# Usage:
#   docker compose -f deploy/compose.dev.yml up -d
#   docker compose -f deploy/compose.dev.yml down
name: gotham-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: gotham-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gotham
      POSTGRES_PASSWORD: gotham
      POSTGRES_DB: gotham
    ports:
      - "5432:5432"
    volumes:
      - gotham-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotham -d gotham"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gotham-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gotham-pg-data:
    name: gotham-pg-data
