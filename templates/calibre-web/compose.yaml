services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.27
    restart: unless-stopped
    ports:
      - '8083'
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-Etc/UTC}
      DOCKER_MODS: ${DOCKER_MODS:-linuxserver/mods:universal-calibre}
    volumes:
      - calibre_web_config:/config
      - calibre_web_books:/books
volumes:
  calibre_web_config:
  calibre_web_books:
