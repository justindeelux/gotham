name: Unleash
icon: unleash
description: Unleash feature flag server with PostgreSQL, persistent named volumes and a routed domain.
homepage: https://docs.getunleash.io
category:
  - devtools
fields:
  - key: domain
    label: Domain
    type: text
    required: true
    placeholder: app.example.com
    help: The public host served by the node's Traefik proxy.
    pattern: ^[A-Za-z0-9][A-Za-z0-9.-]*$
    max_length: 253
  - key: db_name
    label: Database name
    type: text
    default: unleash
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: unleash
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
    help: Used by Unleash and PostgreSQL; use Generate for a strong value.
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
    help: The initial admin password; use Generate for a strong value.
routes:
  - service: unleash
    port: 4242
    domain_field: domain
