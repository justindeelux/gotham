services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls40
    restart: unless-stopped
    ports:
      - '8686'
    environment:
      _APP_URL: https://${GOTHAM_DOMAIN:-localhost}
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - lidarr_config:/config
      - lidarr_music:/music
      - lidarr_downloads:/downloads
volumes:
  lidarr_config:
  lidarr_music:
  lidarr_downloads:
