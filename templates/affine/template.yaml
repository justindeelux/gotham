name: AFFiNE
icon: affine
description: AFFiNE knowledge workspace with PostgreSQL, Redis and persistent volumes.
homepage: https://docs.affine.pro/docs/self-host-affine
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: affine.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: affine
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: affine
    port: 3010
    domain_field: domain
