services:
  affine:
    image: ghcr.io/toeverything/affine:0.27.4
    restart: unless-stopped
    ports:
      - "3010"
    environment:
      AFFINE_CONFIG_PATH: /root/.affine/config
      REDIS_SERVER_HOST: redis
      DATABASE_URL: "postgres://{{ .db_user }}:{{ .db_password }}@postgres:5432/affine"
      NODE_ENV: production
      AFFINE_SERVER_HOST: "${GOTHAM_DOMAIN:-localhost}"
      AFFINE_SERVER_EXTERNAL_URL: "https://${GOTHAM_DOMAIN:-localhost}"
    volumes:
      - affine_config:/root/.affine/config
      - affine_storage:/root/.affine/storage
    depends_on:
      - postgres
      - redis
  affine_migration:
    image: ghcr.io/toeverything/affine:0.27.4
    restart: on-failure
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    environment:
      AFFINE_INDEXER_ENABLED: "false"
      REDIS_SERVER_HOST: redis
      DATABASE_URL: "postgres://{{ .db_user }}:{{ .db_password }}@postgres:5432/affine"
    volumes:
      - affine_config:/root/.affine/config
      - affine_storage:/root/.affine/storage
    depends_on:
      - postgres
      - redis
  redis:
    image: redis:8.10.3
    restart: unless-stopped
    volumes:
      - affine_redis_data:/data
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: affine
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - affine_postgres_data:/var/lib/postgresql/data
volumes:
  affine_config:
  affine_storage:
  affine_redis_data:
  affine_postgres_data:
