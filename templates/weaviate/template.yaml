name: Weaviate
icon: weaviate
description: Weaviate vector database with an API key, a persistent named volume and an optional routed domain.
homepage: https://weaviate.io/developers/weaviate
category:
  - ai
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: weaviate.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: admin_user
    label: Admin user
    type: text
    default: admin@example.com
    pattern: ^[A-Za-z0-9_.@+-]{1,254}$
  - key: api_key
    label: API key
    type: secret
    required: true
    generate: true
routes:
  - service: weaviate
    port: 8080
    domain_field: domain
