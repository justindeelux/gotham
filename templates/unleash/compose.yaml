services:
  unleash:
    image: unleashorg/unleash-server:8.3.1
    restart: unless-stopped
    ports:
      - "4242"
    environment:
      UNLEASH_URL: "https://{{ .domain }}"
      UNLEASH_DEFAULT_ADMIN_PASSWORD: "{{ .admin_password }}"
      DATABASE_URL: "postgres://{{ .db_user }}:{{ .db_password }}@postgres/{{ .db_name }}"
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:4242/health
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 15s
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: "{{ .db_name }}"
    volumes:
      - unleash_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "{{ .db_user }}" -d "{{ .db_name }}"
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  unleash_postgres_data:
