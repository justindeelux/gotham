name: Homebox
icon: homebox
description: Homebox home inventory with a persistent named volume and a routed domain.
homepage: https://github.com/sysadminsmedia/homebox
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: inventory.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: homebox
    port: 7745
    domain_field: domain
