name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: fmt + vet + test + build (go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        go:
          - "1.22.x"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        if: ${{ hashFiles('go.sum') != '' }}
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

      - name: Upload gotham binary
        uses: actions/upload-artifact@v4
        with:
          name: gotham-${{ matrix.os }}-go${{ matrix.go }}
          path: bin/gotham
          if-no-files-found: error

      - name: Upload gotham-agent binary
        uses: actions/upload-artifact@v4
        with:
          name: gotham-agent-${{ matrix.os }}-go${{ matrix.go }}
          path: bin/gotham-agent
          if-no-files-found: error

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13

  web:
    name: web build + type-check + dist drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npm run type-check

      - name: Build
        working-directory: web
        run: npm run build

      - name: Check committed dist is up to date
        run: git diff --exit-code -- internal/server/webdist

  sqlc:
    name: sqlc drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sqlc
        run: |
          curl -sSfL https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz -o sqlc.tar.gz
          tar -xzf sqlc.tar.gz
          chmod +x sqlc
          sudo mv sqlc /usr/local/bin/

      - name: Generate and check drift
        run: |
          sqlc generate
          git diff --exit-code -- internal/store/sqlc
