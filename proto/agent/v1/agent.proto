syntax = "proto3";

package agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/justindeelux/gotham/proto/agent/v1;agentv1";

// AgentService runs on the control plane. Node agents dial it over mTLS to
// register themselves and stream periodic heartbeats.
service AgentService {
  // Register announces a node and requests an mTLS certificate from the CP CA.
  // The agent generates its keypair once, keeps the private key on the node,
  // sends a CSR signed by that key in RegisterRequest.csr, and receives the
  // CA-signed certificate for the matching public key in RegisterResponse.cert.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Heartbeat is a client stream: the agent pushes one message every 10s.
  rpc Heartbeat(stream HeartbeatRequest) returns (HeartbeatResponse);
}

// UpdateService runs on the control plane. Skeleton until Phase 9 implements
// signed self-update.
service UpdateService {
  // RequestUpdate asks whether a newer agent version is available.
  rpc RequestUpdate(UpdateRequest) returns (UpdateResponse);
}

// DockerService runs on the node agent. The control plane dials it to manage
// containers on that node.
service DockerService {
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc StartContainer(ContainerActionRequest) returns (ContainerActionResponse);
  rpc StopContainer(ContainerActionRequest) returns (ContainerActionResponse);
  rpc RestartContainer(ContainerActionRequest) returns (ContainerActionResponse);
  // RemoveContainer deletes a container (force + remove anonymous volumes).
  // Named volumes are never removed: deleting a resource must not delete its
  // data (Phase 5 database soft delete relies on this).
  rpc RemoveContainer(ContainerActionRequest) returns (ContainerActionResponse);
  rpc PullImage(PullImageRequest) returns (PullImageResponse);
  rpc CreateContainer(CreateContainerRequest) returns (ContainerActionResponse);
  rpc RunImage(CreateContainerRequest) returns (ContainerActionResponse);
  // StreamLogs tails container logs; chunks stream until follow ends or the
  // client cancels.
  rpc StreamLogs(StreamLogsRequest) returns (stream LogChunk);
}

// BuildService runs on the node agent. The control plane dials it to build
// application images on that node: it streams the build context tarball in
// and receives build log chunks back. Images are pushed to a node-local
// registry:2 container that the agent bootstraps on first build.
service BuildService {
  // BuildImage receives build parameters followed by the build context
  // tarball, then streams build output back. The first request must carry
  // meta; every subsequent request carries a slice of the tarball until the
  // client closes its send side. The final response carries the pushed image
  // digest and the node registry address; failures are reported as gRPC
  // status errors after any log chunks already sent.
  rpc BuildImage(stream BuildImageRequest) returns (stream BuildImageResponse);
}

// ProxyService runs on the node agent: the control plane pushes generated
// Traefik configuration to the node, and the agent writes it and verifies the
// local Traefik instance picked it up (Phase 6, BE-6.1).
service ProxyService {
  // WriteProxyConfig writes the given Traefik configuration files under the
  // node's proxy config directory and, when verify is set, pings the local
  // Traefik API to confirm the proxy answered after the write.
  rpc WriteProxyConfig(WriteProxyConfigRequest) returns (WriteProxyConfigResponse);
}

// ProxyConfigFile is one generated Traefik configuration document.
message ProxyConfigFile {
  // path is relative to the node's proxy config directory, e.g. "traefik.yml"
  // or "dynamic/gotham.yml". Absolute paths and paths containing ".." are
  // rejected so a compromised control plane cannot escape the config dir.
  string path = 1;
  // content is the rendered document (YAML or TOML).
  bytes content = 2;
}

// WriteProxyConfigRequest carries the files to write.
message WriteProxyConfigRequest {
  repeated ProxyConfigFile files = 1;
  // verify asks the agent to ping Traefik after the write. When false the
  // agent only writes (used before the Traefik container exists).
  bool verify = 2;
}

// WriteProxyConfigResponse reports what the agent did.
message WriteProxyConfigResponse {
  // written lists the relative paths that were written.
  repeated string written = 1;
  // reloaded is true when verify was set and Traefik answered the ping.
  bool reloaded = 2;
  // ping_error carries the ping failure detail when reloaded is false and
  // verify was set; empty otherwise.
  string ping_error = 3;
}

// RegisterRequest carries the node's static identity and capabilities.
message RegisterRequest {
  string node_id = 1;
  string os = 2;
  string docker_version = 3;
  string arch = 4;
  int64 total_mem = 5;   // bytes
  int64 total_disk = 6;  // bytes
  // csr is a PEM-encoded PKCS#10 certificate signing request generated from
  // the agent's private key. When present, the CP signs it and returns the
  // resulting certificate in RegisterResponse.cert.
  bytes csr = 7;
}

// RegisterResponse returns the cert the agent must present to the CP when its
// DockerService is dialed, plus the CP version for compatibility logging.
message RegisterResponse {
  bytes cert = 1;        // PEM-encoded agent certificate
  string cp_version = 2;
}

// HeartbeatRequest reports live resource usage.
message HeartbeatRequest {
  double cpu_usage = 1;    // fraction 0..1
  double mem_usage = 2;    // fraction 0..1
  double disk_usage = 3;   // fraction 0..1
  int64 container_count = 4;
  google.protobuf.Timestamp sent_at = 5;
}

// HeartbeatResponse acknowledges the stream once it closes.
message HeartbeatResponse {
  google.protobuf.Timestamp received_at = 1;
}

// UpdateRequest asks the CP about available agent versions.
message UpdateRequest {
  string agent_version = 1;
}

// UpdateResponse reports whether an update is available.
message UpdateResponse {
  bool update_available = 1;
  string latest_version = 2;
}

// ListContainersRequest filters the container list.
message ListContainersRequest {
  bool all = 1; // include stopped containers
}

// ContainerInfo describes one container.
message ContainerInfo {
  string id = 1;
  string name = 2;
  string image = 3;
  string status = 4;
  string state = 5;
  google.protobuf.Timestamp created_at = 6;
  map<string, string> labels = 7;
}

message ListContainersResponse {
  repeated ContainerInfo containers = 1;
}

// ContainerActionRequest targets one container.
message ContainerActionRequest {
  string container_id = 1;
}

message ContainerActionResponse {
  string container_id = 1;
}

// PullImageRequest pulls an image from a registry.
message PullImageRequest {
  string image = 1;
}

message PullImageResponse {}

// CreateContainerRequest describes a container to create and (for RunImage)
// start immediately.
message CreateContainerRequest {
  string image = 1;
  string name = 2;
  repeated string env = 3;       // KEY=VALUE
  repeated string command = 4;
  repeated string entrypoint = 5;
  map<string, string> labels = 6;
  repeated string ports = 7;     // host:container
  repeated string volumes = 8;   // host:container
  repeated string networks = 9;
}

// StreamLogsRequest tails the logs of one container.
message StreamLogsRequest {
  string container_id = 1;
  bool follow = 2;
  int64 tail = 3; // number of lines from the end; 0 = default
}

// LogChunk is one chunk of a container log stream.
message LogChunk {
  bytes data = 1;
}

// BuildImageRequest is one part of a BuildImage stream: either the build
// parameters (first message only) or a slice of the build context tarball.
message BuildImageRequest {
  oneof part {
    BuildMeta meta = 1;
    bytes context_chunk = 2;
  }
}

// BuildMeta describes one image build.
message BuildMeta {
  // app_id and deploy_id form the standardized image tag
  // gotham/{app_id}:{deploy_id}. Both must be non-empty ref path segments
  // (letters, digits, dot, underscore, dash).
  string app_id = 1;
  string deploy_id = 2;
  // dockerfile is the Dockerfile path relative to the context root.
  // Empty means "Dockerfile".
  string dockerfile = 3;
  // build_args are forwarded to the Docker build as --build-arg values.
  map<string, string> build_args = 4;
}

// BuildImageResponse is one message of a BuildImage stream: either a build
// log chunk or, exactly once when the build succeeds, the build result.
message BuildImageResponse {
  oneof event {
    // log carries raw build output (build and push progress merged).
    BuildLogChunk log = 1;
    // result closes a successful build.
    BuildImageResult result = 2;
  }
}

// BuildLogChunk is one chunk of build output.
message BuildLogChunk {
  bytes data = 1;
}

// BuildImageResult reports a completed build and push.
message BuildImageResult {
  // image_tag is the standardized local tag: gotham/{app_id}:{deploy_id}.
  string image_tag = 1;
  // registry_image is the full pushed reference:
  // {registry_addr}/gotham/{app_id}:{deploy_id}.
  string registry_image = 2;
  // digest is the pushed image manifest digest: sha256:...
  string digest = 3;
  // registry_addr is the node-local registry the image was pushed to, e.g.
  // "127.0.0.1:5000". It is returned so the control plane can persist it.
  string registry_addr = 4;
}
