services:
  chatwoot:
    image: chatwoot/chatwoot:v4.19.1
    restart: unless-stopped
    ports:
      - "3000"
    stop_grace_period: 30s
    environment:
      SECRET_KEY_BASE: "{{ .secret_key_base }}"
      FRONTEND_URL: https://{{ .domain }}
      FORCE_SSL: "false"
      ENABLE_ACCOUNT_SIGNUP: "{{ .enable_signup }}"
      REDIS_URL: redis://default@redis:6379
      REDIS_PASSWORD: "{{ .redis_password }}"
      REDIS_OPENSSL_VERIFY_MODE: none
      POSTGRES_DATABASE: chatwoot
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      RAILS_MAX_THREADS: "5"
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      ACTIVE_STORAGE_SERVICE: local
      SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "false"
    entrypoint: docker/entrypoints/rails.sh
    command: sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 60s

  sidekiq:
    image: chatwoot/chatwoot:v4.19.1
    restart: unless-stopped
    environment:
      SECRET_KEY_BASE: "{{ .secret_key_base }}"
      FRONTEND_URL: https://{{ .domain }}
      FORCE_SSL: "false"
      ENABLE_ACCOUNT_SIGNUP: "{{ .enable_signup }}"
      REDIS_URL: redis://default@redis:6379
      REDIS_PASSWORD: "{{ .redis_password }}"
      REDIS_OPENSSL_VERIFY_MODE: none
      POSTGRES_DATABASE: chatwoot
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      RAILS_MAX_THREADS: "5"
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      ACTIVE_STORAGE_SERVICE: local
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      chatwoot:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d chatwoot -h 127.0.0.1"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"{{ .redis_password }}\""]
    volumes:
      - chatwoot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "{{ .redis_password }}", "PING"]
      interval: 10s
      timeout: 10s
      retries: 5
volumes:
  chatwoot_storage:
  chatwoot_postgres_data:
  chatwoot_redis_data:
