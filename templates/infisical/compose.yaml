services:
  backend:
    image: infisical/infisical:v0.167.10
    restart: unless-stopped
    ports:
      - "8080"
    environment:
      NODE_ENV: production
      SITE_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      ENCRYPTION_KEY: "{{ .encryption_key }}"
      AUTH_SECRET: "{{ .auth_secret }}"
      DB_CONNECTION_URI: "postgres://{{ .db_user }}:{{ .db_password }}@db:5432/{{ .db_name }}"
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/status || exit 1"]
      interval: 5s
      timeout: 20s
      retries: 10
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: "{{ .db_name }}"
    volumes:
      - infisical_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 10s
      retries: 10
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - infisical_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
volumes:
  infisical_db:
  infisical_redis:
