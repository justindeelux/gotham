services:
  privatebin:
    image: privatebin/nginx-fpm-alpine:2.1.1
    restart: unless-stopped
    ports:
      - "8080"
    volumes:
      - privatebin_data:/srv/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  privatebin_data:
