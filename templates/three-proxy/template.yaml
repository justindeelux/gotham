name: 3proxy
icon: 3proxy
description: Tiny HTTP/HTTPS and SOCKS5 forward proxy protected by a username and a generated password.
homepage: https://3proxy.org
category:
  - proxy
fields:
  - key: http_port
    label: HTTP proxy port
    type: number
    default: 3128
    min: 1024
    max: 65535
    help: Host port clients use for HTTP and HTTPS (CONNECT) proxying.
  - key: socks_port
    label: SOCKS5 proxy port
    type: number
    default: 1080
    min: 1024
    max: 65535
    help: Host port clients use for SOCKS4/SOCKS5 proxying.
  - key: username
    label: Username
    type: text
    default: gotham
    pattern: ^[A-Za-z0-9._-]{1,32}$
    max_length: 32
    help: Required by both proxies; letters, digits, dots, dashes and underscores only.
  - key: password
    label: Password
    type: secret
    required: true
    generate: true
    help: Use Generate. A password with spaces breaks the 3proxy config file.
