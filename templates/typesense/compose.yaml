services:
  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    ports:
      - "8108"
    environment:
      TYPESENSE_ENABLE_CORS: "true"
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: "{{ .api_key }}"
    volumes:
      - typesense_data:/data
volumes:
  typesense_data:
