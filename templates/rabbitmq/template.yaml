name: RabbitMQ
icon: rabbitmq
description: RabbitMQ message broker with the management UI, a persistent named volume and an optional routed domain.
homepage: https://www.rabbitmq.com/documentation.html
category:
  - messaging
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: rabbitmq.example.com
    help: Optional. Routes the management UI; leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: admin_user
    label: Admin user
    type: text
    default: admin
    pattern: ^[A-Za-z0-9_.@-]{1,64}$
    max_length: 64
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
    help: Used by the management UI and AMQP clients; use Generate for a strong value.
routes:
  - service: rabbitmq
    port: 15672
    domain_field: domain
