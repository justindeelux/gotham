syntax = "proto3";

package agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/justindeelux/gotham/proto/agent/v1;agentv1";

// AgentService runs on the control plane. Node agents dial it over mTLS to
// register themselves and stream periodic heartbeats.
service AgentService {
  // Register announces a node and requests an mTLS certificate from the CP CA.
  // The agent generates its keypair once, keeps the private key on the node,
  // sends a CSR signed by that key in RegisterRequest.csr, and receives the
  // CA-signed certificate for the matching public key in RegisterResponse.cert.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Heartbeat is a client stream: the agent pushes one message every 10s.
  rpc Heartbeat(stream HeartbeatRequest) returns (HeartbeatResponse);
  // PushObservations is a client stream: the agent pushes one observation
  // generation every collection interval (15s). It is a separate stream from
  // Heartbeat so a slow or failing telemetry push never delays the heartbeat.
  // A server that predates this RPC answers codes.Unimplemented and the agent
  // stays on heartbeat-only monitoring.
  rpc PushObservations(stream ObservationReport) returns (ObservationAck);
}

// UpdateService runs on the control plane. Skeleton until Phase 9 implements
// signed self-update.
service UpdateService {
  // RequestUpdate asks whether a newer agent version is available.
  rpc RequestUpdate(UpdateRequest) returns (UpdateResponse);
}

// DockerService runs on the node agent. The control plane dials it to manage
// containers on that node.
service DockerService {
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  // ListVolumes reports the node's Docker volumes with their usage. The agent
  // does not decide ownership; the control plane filters out the volumes a
  // recorded resource owns.
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc StartContainer(ContainerActionRequest) returns (ContainerActionResponse);
  rpc StopContainer(ContainerActionRequest) returns (ContainerActionResponse);
  rpc RestartContainer(ContainerActionRequest) returns (ContainerActionResponse);
  // RemoveContainer deletes a container (force + remove anonymous volumes).
  // Named volumes are never removed: deleting a resource must not delete its
  // data (Phase 5 database soft delete relies on this).
  rpc RemoveContainer(ContainerActionRequest) returns (ContainerActionResponse);
  // RemoveVolume deletes one named volume. It serves the Phase 5 database
  // grace-window expiry and the orphaned-volume cleanup: a soft-deleted
  // database keeps its volume for the retention window, and a volume a deleted
  // resource left behind can be removed from the node view. The agent confines
  // the call to Gotham-managed names ("gotham-db-", "gotham-app-" and the
  // compose project form "gotham-<uuid>_") so a compromised control plane
  // cannot delete arbitrary node storage. A volume in use fails with
  // codes.FailedPrecondition. Removal is idempotent: a volume that is already
  // gone is reported as success.
  rpc RemoveVolume(VolumeActionRequest) returns (VolumeActionResponse);
  rpc PullImage(PullImageRequest) returns (PullImageResponse);
  rpc CreateContainer(CreateContainerRequest) returns (ContainerActionResponse);
  rpc RunImage(CreateContainerRequest) returns (ContainerActionResponse);
  // StreamLogs tails container logs; chunks stream until follow ends or the
  // client cancels.
  rpc StreamLogs(StreamLogsRequest) returns (stream LogChunk);
  // VolumeArchiveCapabilities reports whether this node can archive volume
  // data for backups. A node that predates the volume-archive transport answers
  // codes.Unimplemented; the control plane must treat that as "update the node
  // agent" and never fall back to a local archive.
  rpc VolumeArchiveCapabilities(VolumeArchiveCapabilitiesRequest) returns (VolumeArchiveCapabilitiesResponse);
  // ArchiveVolumes streams a tar.gz of the requested sources to the control
  // plane. Sources are named Docker volumes or absolute bind paths declared by
  // the control plane; the agent confines bind paths with a deny list and
  // rejects any source that fails validation before starting a container. The
  // caller cancels the stream to stop the archive.
  rpc ArchiveVolumes(ArchiveVolumesRequest) returns (stream ArchiveChunk);
  // RestoreVolumes streams a tar.gz produced by ArchiveVolumes into the target
  // sources. The file is validated (manifest, member names, entry types) before
  // the agent touches a target. The caller cancels the stream to stop the
  // restore.
  rpc RestoreVolumes(stream RestoreVolumesRequest) returns (RestoreVolumesResponse);
}

// BuildService runs on the node agent. The control plane dials it to build
// application images on that node: it streams the build context tarball in
// and receives build log chunks back. Images are pushed to a node-local
// registry:2 container that the agent bootstraps on first build.
service BuildService {
  // BuildImage receives build parameters followed by the build context
  // tarball, then streams build output back. The first request must carry
  // meta; every subsequent request carries a slice of the tarball until the
  // client closes its send side. The final response carries the pushed image
  // digest and the node registry address; failures are reported as gRPC
  // status errors after any log chunks already sent.
  rpc BuildImage(stream BuildImageRequest) returns (stream BuildImageResponse);
}

// ProxyService runs on the node agent: the control plane pushes generated
// Traefik configuration to the node and the agent writes it and, when asked,
// checks that the local Traefik process still answers its ping (Phase 6,
// BE-6.1). The ping is a liveness signal only; configuration acceptance is
// proven by observing the resulting routes, not by the ping.
service ProxyService {
  // WriteProxyConfig writes the given Traefik configuration files under the
  // node's proxy config directory and, when verify is set, pings the local
  // Traefik API to confirm the proxy answered after the write.
  rpc WriteProxyConfig(WriteProxyConfigRequest) returns (WriteProxyConfigResponse);
  // ReadACMEStorage reads the node's Traefik ACME storage (acme.json) and
  // returns certificate metadata only (Phase 6, BE-6.3). Key material —
  // private keys and ACME account keys — is decoded into the agent's memory
  // only as far as the certificate's expiry requires and never appears in the
  // response, in logs or in error strings. A missing storage file is reported
  // as present=false, not as an error.
  rpc ReadACMEStorage(ReadACMEStorageRequest) returns (ReadACMEStorageResponse);
}

// ComposeService runs on the node agent. The control plane dials it to run one
// docker-compose project per Gotham service, using the node's compose CLI so
// compose semantics (interpolation, networks, dependencies, volumes) are
// exactly the CLI's — the control plane never re-implements them.
//
// Trust boundary: a service runs user-supplied compose by design (like the
// container RPCs), but the input is confined and bounded. The project name is
// derived by the control plane from the service id ("gotham-<uuid>") and
// re-validated here against a strict pattern; absolute paths and ".." are
// rejected, the compose document is size-capped and written under the agent's
// compose root, and every failure carries at most a bounded fragment of the
// CLI's own output. Secret responsibility is split: the agent never logs
// command output and never reads the caller's environment, while the control
// plane redacts the environment values it substituted into the document from
// every message it stores, returns or logs. A document-inline literal the user
// typed is user content and is not redacted on either side.
service ComposeService {
  // ComposeValidate writes the project's compose file under the agent compose
  // root and validates it with `docker compose config`, starting nothing. It
  // returns the compose service names and named volumes the document declares
  // so the control plane can check what a deploy would run.
  rpc ComposeValidate(ComposeValidateRequest) returns (ComposeValidateResponse);
  // ComposeUp writes the compose file and starts the project with
  // `docker compose up -d`. Named volumes are never removed or recreated:
  // recreating a service keeps its volume data. With restart set the agent
  // runs `docker compose restart` instead and only restarts the project's
  // existing containers.
  rpc ComposeUp(ComposeUpRequest) returns (ComposeUpResponse);
  // ComposeDown stops and removes the project's containers and networks with
  // `docker compose down`. It passes --volumes only when the request asks for
  // it: a stop keeps every named volume so it stays recoverable, while a
  // delete removes exactly the volumes the recorded document declares.
  rpc ComposeDown(ComposeDownRequest) returns (ComposeDownResponse);
  // ComposeLogs streams the merged stdout/stderr of one compose service (or
  // the whole project when service is empty), following until the client
  // cancels.
  rpc ComposeLogs(ComposeLogsRequest) returns (stream ComposeLogChunk);
  // ComposePs lists the project's containers with their compose service name
  // and observed state.
  rpc ComposePs(ComposePsRequest) returns (ComposePsResponse);
}

// FileService runs on the node agent. The control plane dials it to browse —
// and, from step 2 on, edit — files under the node's allow-listed roots.
// Files are addressed as (root, path): root is a name from ListRoots and path
// is relative to that root; absolute paths are rejected. Confinement is
// agent-side defense in depth, not authentication: the agent opens every entry
// under a validated root, never follows a path out of it, and reports
// non-regular entries as FILE_KIND_SPECIAL.
//
// The whole contract (read and write) is defined here in step 1 so later steps
// never touch this file. A method whose step has not landed answers
// codes.Unimplemented.
service FileService {
  // ListRoots returns the agent's allow-listed roots; it is the only source of
  // valid root names.
  rpc ListRoots(ListRootsRequest) returns (ListRootsResponse);
  // List returns one directory's entries sorted by name, capped at 5,000. A
  // truncated listing carries a cursor to resume with.
  rpc List(ListRequest) returns (ListResponse);
  // Stat returns one entry.
  rpc Stat(StatRequest) returns (StatResponse);
  // Search returns entries under one directory whose NAME contains a
  // case-insensitive substring (name-only, never file content). The walk is
  // bounded by a depth cap, a result cap and a scan cap; a search that hit any
  // cap reports truncated=true rather than returning a silently partial set.
  // It never follows a symbolic link, so it never leaves the requested
  // directory's root, and the recycle bin is never searched.
  rpc Search(SearchRequest) returns (SearchResponse);
  // Read streams one regular file in bounded chunks.
  rpc Read(ReadRequest) returns (stream ReadChunk);
  // DirectorySize returns the recursive size of one directory (JUS-162). The
  // walk never follows a symlink, stops at an entry cap and reports the partial
  // result with truncated=true rather than failing.
  rpc DirectorySize(DirectorySizeRequest) returns (DirectorySizeResponse);
  // Write creates or replaces one file. The first request must carry
  // WriteHeader; the following requests stream the body; an optional final
  // WriteCommit carries the whole body's sha256. The agent commits only when
  // every declared byte arrived (or the commit digest matches), so a truncated
  // upload never replaces the target.
  rpc Write(stream WriteRequest) returns (WriteResponse);
  // Copy copies one entry within a single root, streaming progress.
  rpc Copy(CopyRequest) returns (stream Progress);
  // Delete removes one entry, recursively when asked, streaming progress.
  rpc Delete(DeleteRequest) returns (stream Progress);
  // Mkdir creates one directory.
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);
  // Rename renames or moves one entry within a single root.
  rpc Rename(RenameRequest) returns (RenameResponse);
  // Chmod changes one entry's permission bits.
  rpc Chmod(ChmodRequest) returns (ChmodResponse);
  // Compress builds one archive (zip, tar or tar.gz) from a set of sources
  // inside a single root and writes it to a destination inside the same root,
  // streaming progress. Only regular files and directories are stored; a
  // symbolic link or a special file is skipped and counted in the final
  // Progress.skipped.
  rpc Compress(CompressRequest) returns (stream Progress);
  // Extract unpacks one archive (zip, tar or tar.gz) into a destination
  // directory inside the same root, streaming progress. The format is the
  // archive's file extension; an unknown extension is refused. Symbolic-link,
  // hard-link, device and FIFO entries are refused, an absolute name or a name
  // that escapes the root is refused, setuid/setgid/sticky bits are stripped,
  // and the total uncompressed size, the entry count and the compression ratio
  // are bounded.
  rpc Extract(ExtractRequest) returns (stream Progress);
  // TransferCapabilities reports whether this node stages transfer bundles and
  // the effective limits a caller must respect. A node that does not implement
  // this RPC answers codes.Unimplemented; one with the file manager disabled
  // answers FailedPrecondition.
  rpc TransferCapabilities(TransferCapabilitiesRequest) returns (TransferCapabilitiesResponse);
  // PrepareBundle writes a fixed tar.gz bundle of the selected sources to
  // private agent-owned staging, outside every file root, and returns the
  // opaque artifact handle the other transfer calls take. The source roots may
  // be read-only: nothing is written inside them.
  rpc PrepareBundle(PrepareBundleRequest) returns (PrepareBundleResponse);
  // ReadArtifact streams a prepared bundle back in bounded chunks. The artifact
  // is bound to the calling transfer: another transfer's handle is refused.
  rpc ReadArtifact(ReadArtifactRequest) returns (stream ArtifactChunk);
  // ReceiveArtifact streams a bundle into private staging on the destination
  // filesystem, bound to one transfer, root and directory. The first request
  // must carry ReceiveArtifactHeader; the following requests carry the body.
  // The bundle is usable only when the declared length and SHA-256 both match.
  rpc ReceiveArtifact(stream ReceiveArtifactRequest) returns (ReceiveArtifactResponse);
  // ApplyArtifact extracts a received bundle into private staging, verifies the
  // extracted top-level names and publishes each complete top-level entry with
  // an exclusive rename, streaming per-entry outcomes. Whole-selection
  // atomicity is not promised; already published entries survive a failure.
  rpc ApplyArtifact(ApplyArtifactRequest) returns (stream ApplyArtifactEvent);
  // DiscardArtifact removes one artifact's transfer-owned staging. It never
  // touches published entries or any other path.
  rpc DiscardArtifact(DiscardArtifactRequest) returns (DiscardArtifactResponse);
  // ListTrash lists a root's recycle bin, newest first. Entries are deleted
  // entries the service moved into the root's trash; the trash tree itself is
  // never browsable through List.
  rpc ListTrash(ListTrashRequest) returns (ListTrashResponse);
  // Restore moves one trash entry back to its recorded original path (or to an
  // explicit destination), recreating missing parent directories and refusing
  // an existing target unless overwrite is set.
  rpc Restore(RestoreRequest) returns (RestoreResponse);
  // Purge permanently removes one trash entry.
  rpc Purge(PurgeRequest) returns (PurgeResponse);
  // EmptyTrash permanently removes every entry in a root's recycle bin.
  rpc EmptyTrash(EmptyTrashRequest) returns (EmptyTrashResponse);
}

// ListRootsRequest is empty: roots are node-local configuration.
message ListRootsRequest {}

// FileRoot is one browsable root.
message FileRoot {
  // name is the stable identifier other calls pass as `root`.
  string name = 1;
  // path is the absolute host path, for display only.
  string path = 2;
  // writable is false for roots the agent refuses to mutate (the compose root
  // and any operator-added root).
  bool writable = 3;
  // free_bytes is the free space on the root's filesystem; 0 when unknown.
  uint64 free_bytes = 4;
}

// ListRootsResponse lists the allow-listed roots.
message ListRootsResponse {
  repeated FileRoot roots = 1;
}

// ListRequest lists one directory.
message ListRequest {
  string root = 1;
  // path is relative to the root; empty or "." lists the root itself.
  string path = 2;
  // cursor resumes a truncated listing; empty starts at the beginning. It is
  // the opaque base64 token from a previous ListResponse; a malformed token is
  // rejected with InvalidArgument.
  string cursor = 3;
}

// FileKind classifies a directory entry.
enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_FILE = 1;
  FILE_KIND_DIRECTORY = 2;
  FILE_KIND_SYMLINK = 3;
  // FILE_KIND_SPECIAL covers anything that is not a regular file, directory or
  // symlink (device, socket, FIFO). It is listed but has no actions.
  FILE_KIND_SPECIAL = 4;
}

// FileEntry describes one entry under a root.
message FileEntry {
  string name = 1;
  FileKind kind = 2;
  int64 size = 3;
  // mode is the entry's permission bits (0o777 mask).
  uint32 mode = 4;
  google.protobuf.Timestamp modified_at = 5;
  // symlink_target is the link target when kind is FILE_KIND_SYMLINK.
  string symlink_target = 6;
  // etag is the RFC 7232 quoted entity tag "dev:ino:mtime_ns:size".
  string etag = 7;
  // owner is the owning user's name, or the numeric uid when it does not
  // resolve. Empty only from an agent that predates this field.
  string owner = 8;
  // group is the owning group's name, or the numeric gid when it does not
  // resolve. Empty only from an agent that predates this field.
  string group = 9;
}

// ListResponse is one page of a directory listing.
message ListResponse {
  repeated FileEntry entries = 1;
  // truncated is true when more entries exist beyond this page.
  bool truncated = 2;
  // cursor is the opaque base64 token to resume a truncated listing with; it is
  // empty when truncated is false. A truncated page always carries a non-empty
  // cursor that makes progress.
  string cursor = 3;
}

// StatRequest stats one entry.
message StatRequest {
  string root = 1;
  string path = 2;
}

// StatResponse carries the entry.
message StatResponse {
  FileEntry entry = 1;
}

// DirectorySizeRequest asks for one directory's recursive size.
message DirectorySizeRequest {
  string root = 1;
  // path is relative to the root; empty or "." sizes the root itself.
  string path = 2;
}

// DirectorySizeResponse is one folder's recursive size. bytes sums regular-file
// sizes (lstat, not disk blocks) per name, so a hard-linked file is counted once
// per link rather than once per inode (it may differ from `du`); entries counts
// every name visited; symlinks and special files are counted in skipped and
// never followed; truncated reports a partial result the walk stopped at the
// entry or depth cap with.
message DirectorySizeResponse {
  int64 bytes = 1;
  int64 entries = 2;
  uint64 skipped = 3;
  bool truncated = 4;
}

// SearchRequest searches one directory tree by entry name.
message SearchRequest {
  string root = 1;
  // path is the directory to search within, relative to the root; empty or "."
  // searches the root itself.
  string path = 2;
  // query is the case-insensitive substring every returned name must contain.
  // An empty or whitespace-only query is rejected with InvalidArgument.
  string query = 3;
  // recursive descends into subdirectories (bounded by the agent's depth cap)
  // when true; when false only path's immediate entries are matched.
  bool recursive = 4;
}

// SearchResult is one matching entry with its root-relative path.
message SearchResult {
  // path is the entry's root-relative path (its name when the search is not
  // recursive), so two same-named files in different directories stay distinct.
  string path = 1;
  FileEntry entry = 2;
}

// SearchResponse is one bounded result set.
message SearchResponse {
  repeated SearchResult results = 1;
  // truncated is true when the result, depth or scan cap stopped the search
  // before it finished. A truncated set is never presented as complete.
  bool truncated = 2;
}

// ReadRequest reads one file.
message ReadRequest {
  string root = 1;
  string path = 2;
  // offset starts the read that many bytes into the file (0 = the start).
  // limit caps the read at that many bytes (0 = to EOF). Zero/zero reads the
  // whole file, so a request without both behaves exactly as before. An agent
  // that predates these fields ignores them and streams from the start; the
  // control plane then sees a body over its editor ceiling and answers 413
  // (the download-only fallback), never a head presented as a tail.
  int64 offset = 3;
  int64 limit = 4;
}

// ReadChunk is one slice of a file body.
message ReadChunk {
  bytes data = 1;
}

// WriteRequest is one message of a Write stream.
message WriteRequest {
  oneof part {
    WriteHeader header = 1;
    bytes data = 2;
    WriteCommit commit = 3;
  }
}

// WriteHeader is the first request of a Write stream.
message WriteHeader {
  string root = 1;
  string path = 2;
  // size is the exact number of body bytes that follow.
  int64 size = 3;
  // expect_etag is the etag the client last read. Empty means the target must
  // not exist yet (exclusive create). A non-empty etag that no longer matches
  // is a failed precondition (FAILED_PRECONDITION), even when overwrite is set:
  // overwrite authorises replacing a target the caller has not read, never
  // clobbering a newer one.
  string expect_etag = 4;
  // overwrite permits replacing an existing target when no expect_etag is
  // given (or when it matches). It never overrides a stale expect_etag.
  bool overwrite = 5;
  // mode is the permission bits for a newly created file.
  uint32 mode = 6;
}

// WriteCommit optionally closes a Write with the body digest.
message WriteCommit {
  // sha256 is the hex digest of the whole body.
  string sha256 = 1;
}

// WriteResponse reports the committed file.
message WriteResponse {
  FileEntry entry = 1;
  // created is true when the call created a new file.
  bool created = 2;
  // write_mode reports how the agent committed ("rename" or "in_place"). A
  // "rename" commit is atomic. An "in_place" commit rewrites the same inode so
  // a foreign-owned, hard-linked or bind-mounted file keeps its owner, ACLs and
  // mount; it is not atomic: the agent reserves the new length before writing
  // and refuses when the target's filesystem cannot hold the body, but a crash
  // or I/O error during the rewrite can leave the file half-written. See the
  // "Deviations" section of docs/plans/18-file-manager.md.
  string write_mode = 3;
}

// CopyRequest copies one entry within a single root.
message CopyRequest {
  string root = 1;
  string source = 2;
  string destination = 3;
  // overwrite permits replacing an existing destination.
  bool overwrite = 4;
}

// DeleteRequest removes one entry. By default the entry is moved into the
// root's recycle bin (see ListTrash/Restore); permanent deletes it outright.
message DeleteRequest {
  string root = 1;
  string path = 2;
  // recursive removes a non-empty directory. A non-recursive delete of a
  // non-empty directory is still refused.
  bool recursive = 3;
  // permanent skips the recycle bin and removes the entry from the filesystem.
  bool permanent = 4;
}

// TrashEntry is one entry held in a root's recycle bin.
message TrashEntry {
  // id identifies the entry within the bin; it is opaque to the caller and is
  // the handle Restore/Purge take.
  string id = 1;
  // original_path is the root-relative path the entry was deleted from.
  string original_path = 2;
  // name is the base name of original_path, for display.
  string name = 3;
  google.protobuf.Timestamp deleted_at = 4;
  // size is the entry's size in bytes (a directory's own size, not its tree).
  int64 size = 5;
  FileKind kind = 6;
}

// ListTrashRequest lists one root's recycle bin.
message ListTrashRequest {
  string root = 1;
}

// ListTrashResponse lists the bin, newest first.
message ListTrashResponse {
  repeated TrashEntry entries = 1;
  // truncated is true when the bin holds more entries than this page; the
  // oldest are omitted. It is never a silent cap.
  bool truncated = 2;
}

// RestoreRequest moves one trash entry back to its original path. Missing
// parent directories are recreated with the mode recorded when the entry was
// trashed, or 0755 when no mode was recorded.
message RestoreRequest {
  string root = 1;
  // id is the TrashEntry handle to restore.
  string id = 2;
  // destination overrides the recorded original path when non-empty.
  string destination = 3;
  // overwrite permits replacing an existing destination.
  bool overwrite = 4;
}

// RestoreResponse returns the restored entry at its destination.
message RestoreResponse {
  FileEntry entry = 1;
  // path is the root-relative destination the entry was restored to (the
  // recorded original path when the request carried no destination).
  string path = 2;
}

// PurgeRequest permanently removes one trash entry.
message PurgeRequest {
  string root = 1;
  string id = 2;
}

// PurgeResponse is empty.
message PurgeResponse {}

// EmptyTrashRequest empties one root's recycle bin.
message EmptyTrashRequest {
  string root = 1;
}

// EmptyTrashResponse reports how many entries were permanently removed.
message EmptyTrashResponse {
  uint64 removed = 1;
}

// Progress reports the state of a long Copy, Delete, Compress or Extract.
message Progress {
  // path is the entry currently in flight, relative to the root.
  string path = 1;
  int64 bytes_done = 2;
  // bytes_total is -1 when the total is not known up front.
  int64 bytes_total = 3;
  // done is true on the final message of the stream.
  bool done = 4;
  // skipped is the number of entries the operation refused to store or
  // restore: on Compress a symbolic link or special file that was left out of
  // the archive, on Extract an entry that was skipped (currently always 0,
  // since Extract refuses such entries outright). It is meaningful on the
  // final (done) message; earlier messages leave it 0.
  uint64 skipped = 5;
}

// ArchiveFormat selects an archive's container and compression.
enum ArchiveFormat {
  ARCHIVE_FORMAT_UNSPECIFIED = 0;
  ARCHIVE_FORMAT_ZIP = 1;
  ARCHIVE_FORMAT_TAR = 2;
  ARCHIVE_FORMAT_TAR_GZ = 3;
}

// CompressRequest builds one archive inside a root.
message CompressRequest {
  string root = 1;
  // sources are files or directories relative to the root; an empty list is
  // refused. A source that is a symbolic link or a special file is skipped.
  repeated string sources = 2;
  // destination is the archive path relative to the root. It must not equal,
  // or lie inside, a source directory.
  string destination = 3;
  // format selects the container. ARCHIVE_FORMAT_UNSPECIFIED is refused.
  ArchiveFormat format = 4;
  // overwrite permits replacing an existing destination archive.
  bool overwrite = 5;
}

// ExtractRequest unpacks one archive inside a root.
message ExtractRequest {
  string root = 1;
  // source is the archive path relative to the root. Its extension selects the
  // format (.zip, .tar, .tar.gz or .tgz); an unknown extension is refused.
  string source = 2;
  // destination is the directory relative to the root to unpack into. It must
  // already exist.
  string destination = 3;
  // overwrite permits replacing an existing file. An existing directory is
  // reused, never removed.
  bool overwrite = 4;
}

// TransferCapabilitiesRequest is empty: bounds are node-local configuration.
message TransferCapabilitiesRequest {}

// TransferCapabilitiesResponse reports whether bundles are supported and the
// effective bounds. A caller must not offer the feature when available is
// false, and must cap its request by these values rather than its own.
message TransferCapabilitiesResponse {
  // available is true when this node implements bundle staging.
  bool available = 1;
  // max_bundle_bytes caps the compressed bundle (the archive a Prepare returns
  // and a Receive accepts).
  uint64 max_bundle_bytes = 2;
  // max_expanded_bytes caps the extracted contents.
  uint64 max_expanded_bytes = 3;
  // max_entries caps the number of archive entries.
  uint64 max_entries = 4;
  // max_sources caps how many relative paths one PrepareBundle may select.
  uint32 max_sources = 5;
  // max_concurrency is the number of transfer operations this node runs at
  // once. It is the same slot pool Compress/Extract/Write use.
  uint32 max_concurrency = 6;
}

// PrepareBundleRequest selects sources from one root.
message PrepareBundleRequest {
  // transfer_id identifies the caller's transfer. Artifacts are scoped to it.
  string transfer_id = 1;
  // root is the FileService root name the sources are read from. It may be a
  // read-only root.
  string root = 2;
  // sources are relative paths of files or directories under root. A name
  // whose base name duplicates another selection is refused, as is one that
  // overlaps another selection. At most 1,024 sources are accepted.
  repeated string sources = 3;
}

// SkippedEntry is one source entry a bundle left out, for reporting.
message SkippedEntry {
  // path is the entry's path inside the bundle.
  string path = 1;
  // reason is "symlink" or "special".
  string reason = 2;
}

// PrepareBundleResponse describes the completed bundle.
message PrepareBundleResponse {
  string transfer_id = 1;
  // artifact is the opaque handle ReadArtifact/DiscardArtifact take. It is not
  // a filesystem path and is unguessable.
  string artifact = 2;
  // compressed_bytes is the bundle's exact size.
  uint64 compressed_bytes = 3;
  // sha256 is the bundle's hex SHA-256; a Receive must present the same digest.
  string sha256 = 4;
  // expanded_bytes is the sum of the regular-file sizes the bundle expands to.
  uint64 expanded_bytes = 5;
  // entry_count is the number of archive entries (directories included).
  uint64 entry_count = 6;
  // top_level are the top-level names the bundle stores, in selection order.
  repeated string top_level = 7;
  // skipped_count counts symbolic links and special files left out.
  uint64 skipped_count = 8;
  // skipped holds up to a bounded number of skipped-entry samples; skipped_count
  // is authoritative when it is larger.
  repeated SkippedEntry skipped = 9;
}

// ReadArtifactRequest reads one prepared artifact.
message ReadArtifactRequest {
  string transfer_id = 1;
  string artifact = 2;
}

// ArtifactChunk is one slice of a bundle.
message ArtifactChunk {
  bytes data = 1;
}

// ReceiveArtifactRequest is one message of a ReceiveArtifact stream.
message ReceiveArtifactRequest {
  oneof part {
    // header must be the first message of the stream.
    ReceiveArtifactHeader header = 1;
    // data is a slice of the bundle.
    bytes data = 2;
  }
}

// ReceiveArtifactHeader binds a received bundle to its transfer and destination.
message ReceiveArtifactHeader {
  string transfer_id = 1;
  // root is the destination FileService root; it must be writable.
  string root = 2;
  // directory is the destination directory relative to root. It must already
  // exist; missing parent directories are never created.
  string directory = 3;
  // length is the exact number of body bytes that follow.
  uint64 length = 4;
  // sha256 is the hex digest of the whole body; a mismatch refuses the bundle.
  string sha256 = 5;
  // expanded_bytes and entry_count are the values the PrepareBundle response
  // reported. ApplyArtifact checks the extracted archive against them.
  uint64 expanded_bytes = 6;
  uint64 entry_count = 7;
  // top_level is the prepared selection's top-level names. ApplyArtifact
  // publishes exactly these names and refuses an archive that stores others.
  repeated string top_level = 8;
}

// ReceiveArtifactResponse reports the staged artifact.
message ReceiveArtifactResponse {
  string transfer_id = 1;
  string artifact = 2;
  uint64 length = 3;
  string sha256 = 4;
}

// ApplyArtifactRequest applies one received artifact.
message ApplyArtifactRequest {
  string transfer_id = 1;
  string artifact = 2;
  // root and directory must match the values the bundle was received for.
  string root = 3;
  string directory = 4;
  // top_level must match the selection the bundle was received for.
  repeated string top_level = 5;
}

// ApplyArtifactEvent is one message of an ApplyArtifact stream.
message ApplyArtifactEvent {
  oneof event {
    TransferPhase phase = 1;
    TransferOutcome outcome = 2;
  }
}

// TransferPhase reports which phase the apply is in and its progress.
message TransferPhase {
  // phase is "extract", "publish" or "done".
  string phase = 1;
  // path is the entry or top-level name in flight, relative to the destination
  // directory.
  string path = 2;
  int64 bytes_done = 3;
  // bytes_total is -1 when unknown.
  int64 bytes_total = 4;
}

// TransferOutcomeStatus is the durable filesystem result for one top-level.
enum TransferOutcomeStatus {
  TRANSFER_OUTCOME_STATUS_UNSPECIFIED = 0;
  // PUBLISHED means the top-level was renamed into place.
  TRANSFER_OUTCOME_STATUS_PUBLISHED = 1;
  // SKIPPED means an existing destination name was left untouched.
  TRANSFER_OUTCOME_STATUS_SKIPPED = 2;
}

// TransferOutcome reports one top-level name's result.
message TransferOutcome {
  // name is the top-level basename, relative to the destination directory.
  string name = 1;
  TransferOutcomeStatus status = 2;
  // reason carries the conflict detail when status is SKIPPED.
  string reason = 3;
}

// DiscardArtifactRequest drops one artifact's staging.
message DiscardArtifactRequest {
  string transfer_id = 1;
  string artifact = 2;
}

// DiscardArtifactResponse is empty.
message DiscardArtifactResponse {}

// MkdirRequest creates one directory.
message MkdirRequest {
  string root = 1;
  string path = 2;
  uint32 mode = 3;
}

// MkdirResponse returns the created entry.
message MkdirResponse {
  FileEntry entry = 1;
}

// RenameRequest renames or moves one entry within a single root.
message RenameRequest {
  string root = 1;
  string source = 2;
  string destination = 3;
  // overwrite permits replacing an existing destination.
  bool overwrite = 4;
}

// RenameResponse returns the renamed entry.
message RenameResponse {
  FileEntry entry = 1;
}

// ChmodRequest changes one entry's permission bits.
message ChmodRequest {
  string root = 1;
  string path = 2;
  // mode is the new permission bits. It is optional so the agent can refuse a
  // request that omits it (INVALID_ARGUMENT): unlike a create, a chmod has no
  // safe default, and a missing mode must never silently mean 000.
  optional uint32 mode = 3;
}

// ChmodResponse is empty.
message ChmodResponse {}

// ProxyConfigFile is one generated Traefik configuration document.
message ProxyConfigFile {
  // path is relative to the node's proxy config directory, e.g. "traefik.yml"
  // or "dynamic/gotham.yml". Absolute paths and paths containing ".." are
  // rejected so a compromised control plane cannot escape the config dir.
  string path = 1;
  // content is the rendered document (YAML or TOML).
  bytes content = 2;
}

// WriteProxyConfigRequest carries the files to write.
message WriteProxyConfigRequest {
  repeated ProxyConfigFile files = 1;
  // verify asks the agent to ping Traefik after the write. When false the
  // agent only writes (used before the Traefik container exists).
  bool verify = 2;
}

// WriteProxyConfigResponse reports what the agent did.
message WriteProxyConfigResponse {
  // written lists the relative paths that were written.
  repeated string written = 1;
  // reloaded is true when verify was set and Traefik answered its ping after
  // the write. Traefik documents /ping as process liveness and reloads
  // configuration asynchronously, so this is a health signal, not a claim
  // that the document was accepted.
  bool reloaded = 2;
  // ping_error carries the ping failure detail when reloaded is false and
  // verify was set; empty otherwise.
  string ping_error = 3;
}

// ReadACMEStorageRequest is empty: the storage path is a node-local layout
// constant and is never supplied by the control plane.
message ReadACMEStorageRequest {}

// ACMECertificateInfo is one stored certificate, reduced to the metadata the
// control plane reports: the resolver section that stored it, the primary
// domain, its subject alternative names and the leaf's expiry. The private
// key, the ACME account key and the certificate bytes themselves are never
// part of this message.
message ACMECertificateInfo {
  // resolver is the ACME resolver section of the storage file the entry came
  // from, e.g. "letsencrypt" or "letsencrypt-dns-cloudflare".
  string resolver = 1;
  // main is the certificate's primary domain as stored by Traefik.
  string main = 2;
  // sans are the certificate's subject alternative names as stored by
  // Traefik.
  repeated string sans = 3;
  // not_after is the leaf certificate's expiry time.
  google.protobuf.Timestamp not_after = 4;
}

// ReadACMEStorageResponse reports the node's stored certificate metadata.
message ReadACMEStorageResponse {
  // present is false when the node has no ACME storage file yet; the
  // certificate list is empty then.
  bool present = 1;
  // certificates are the stored certificate metadata entries.
  repeated ACMECertificateInfo certificates = 2;
}

// RegisterRequest carries the node's static identity and capabilities.
message RegisterRequest {
  string node_id = 1;
  string os = 2;
  string docker_version = 3;
  string arch = 4;
  int64 total_mem = 5;   // bytes
  int64 total_disk = 6;  // bytes
  // csr is a PEM-encoded PKCS#10 certificate signing request generated from
  // the agent's private key. When present, the CP signs it and returns the
  // resulting certificate in RegisterResponse.cert.
  bytes csr = 7;
}

// RegisterResponse returns the cert the agent must present to the CP when its
// DockerService is dialed, plus the CP version for compatibility logging.
message RegisterResponse {
  bytes cert = 1;        // PEM-encoded agent certificate
  string cp_version = 2;
}

// HeartbeatRequest reports live resource usage.
message HeartbeatRequest {
  double cpu_usage = 1;    // fraction 0..1
  double mem_usage = 2;    // fraction 0..1
  double disk_usage = 3;   // fraction 0..1
  int64 container_count = 4;
  google.protobuf.Timestamp sent_at = 5;
  // net_rx_bps, net_tx_bps, disk_read_bps and disk_write_bps are host I/O
  // rates in bytes per second, computed by the agent from consecutive counter
  // samples. They are zero on a platform that cannot report them (for example
  // Darwin) and on the agent's first sample.
  double net_rx_bps = 6;
  double net_tx_bps = 7;
  double disk_read_bps = 8;
  double disk_write_bps = 9;
  // agent_version is the agent build version the node currently runs. It lets
  // the control plane keep a version map that updates after a self-update and
  // survive a reconnect. Empty when the agent is older than this contract.
  string agent_version = 10;
}

// HeartbeatResponse acknowledges the stream once it closes.
message HeartbeatResponse {
  google.protobuf.Timestamp received_at = 1;
}

// MetricStatus distinguishes a measured value from missing evidence. A
// METRIC_STATUS_OK value is a real measurement: zero is a real measured zero.
// Every other status means the value must be ignored (not rendered as zero).
enum MetricStatus {
  METRIC_STATUS_UNSPECIFIED = 0;
  // METRIC_STATUS_OK means the value was measured in this report.
  METRIC_STATUS_OK = 1;
  // METRIC_STATUS_UNSUPPORTED means the platform cannot report this metric.
  METRIC_STATUS_UNSUPPORTED = 2;
  // METRIC_STATUS_ERROR means the read failed in this report.
  METRIC_STATUS_ERROR = 3;
  // METRIC_STATUS_WARMING means the metric needs a previous counter sample;
  // rates are not known yet and must not be reported as zero.
  METRIC_STATUS_WARMING = 4;
}

// Metric is one measured value with its evidence. Values are validated by the
// control plane: fractions are 0..1 and rates are bytes/second.
message Metric {
  MetricStatus status = 1;
  double value = 2;
  // reason is a short machine-readable detail for a non-OK status.
  string reason = 3;
}

// HostObservation is the host-level evidence in one report.
message HostObservation {
  Metric cpu_usage = 1;       // fraction 0..1
  Metric mem_usage = 2;       // fraction 0..1
  Metric disk_usage = 3;      // fraction 0..1
  Metric net_rx_bps = 4;      // bytes/second
  Metric net_tx_bps = 5;      // bytes/second
  Metric disk_read_bps = 6;   // bytes/second
  Metric disk_write_bps = 7;  // bytes/second
  uint64 total_mem = 8;       // bytes, 0 when unknown
  uint64 total_disk = 9;      // bytes, 0 when unknown
}

// FilesystemObservation is one local filesystem's capacity evidence. Paths on
// the same device are deduplicated by the agent, so a separate Docker or backup
// mount is reported independently from the root filesystem.
message FilesystemObservation {
  string path = 1;
  // purpose is one of "root", "docker_data", "managed_storage" or "backup".
  string purpose = 2;
  MetricStatus status = 3;
  // reason is a short machine-readable detail for a non-OK status.
  string reason = 4;
  uint64 total_bytes = 5;
  uint64 available_bytes = 6;
  // inode_status is METRIC_STATUS_UNSUPPORTED when the filesystem reports no
  // inode data; total_inodes/free_inodes are then unknown, not zero.
  MetricStatus inode_status = 7;
  string inode_reason = 8;
  uint64 total_inodes = 9;
  uint64 free_inodes = 10;
}

// ContainerObservation is one managed container. Only Gotham's ownership
// labels are carried; environment variables, secrets, arbitrary labels and
// logs are never collected.
message ContainerObservation {
  string id = 1;
  string state = 2;
  string health = 3;
  int64 restart_count = 4;
  bool oom_killed = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  bool managed = 9;
  string app_id = 10;
  string deployment_id = 11;
  string database_id = 12;
  string compose_project = 13;
  string compose_service = 14;
  string role = 15;
  // exit_code is Docker's recorded exit code for a terminated container. It
  // is evidence only: a non-zero code never proves OOM, and zero alone does
  // not make a long-running service a completed one-shot job.
  int32 exit_code = 16;
  // restart_policy is the container's native Docker restart policy ("no",
  // "always", "unless-stopped" or "on-failure"). Empty from an agent that
  // predates it or when the engine could not answer. The runtime detector
  // treats a successful exit under "no" as a supported one-shot completion.
  string restart_policy = 17;
  // replica is the Compose container number (com.docker.compose.container-number)
  // so replicas of one service stay distinct across recreations. Empty for a
  // non-Compose container or an older agent.
  string replica = 18;
}

// ContainerInventory is one generation of managed container evidence.
message ContainerInventory {
  // complete is false when the collection failed, was capped or an inspect
  // failed. An incomplete inventory cannot prove a container disappeared.
  bool complete = 1;
  // reason is a short machine-readable detail when complete is false.
  string reason = 2;
  bool truncated = 3;
  repeated ContainerObservation containers = 4;
}

// ObservationReport is one observation generation pushed by the agent.
message ObservationReport {
  // node_id must match the authenticated peer; the control plane rejects a
  // mismatch instead of attributing the report to another node.
  string node_id = 1;
  // session_id changes on every agent process start, so a reconnect starts a
  // new session and an old session's reports can never overwrite newer state.
  string session_id = 2;
  // sequence increases within one session; duplicates and out-of-order
  // reports are ignored by the control plane.
  uint64 sequence = 3;
  // observed_at is when the agent collected this generation.
  google.protobuf.Timestamp observed_at = 4;
  // sampling_interval_ms is the agent's effective collection interval.
  int64 sampling_interval_ms = 5;
  HostObservation host = 6;
  repeated FilesystemObservation filesystems = 7;
  ContainerInventory inventory = 8;
  string agent_version = 9;
  // container_samples carries numeric resource samples for managed containers.
  // The agent samples at most every 30 seconds, independently of the heartbeat
  // and of this report's cadence. A missing metric is unknown, never zero.
  repeated ContainerResourceSample container_samples = 10;
}

// ContainerResourceSample is one numeric resource sample for a managed
// container. The control plane maps id back to the ownership labels in the
// report's inventory; labels, paths and secrets are never carried here.
message ContainerResourceSample {
  string id = 1;
  google.protobuf.Timestamp observed_at = 2;
  // cpu_cores is CPU used in core units: 1.0 is one full core, so a container
  // using half a core reports 0.5. WARMING means no previous counter sample.
  Metric cpu_cores = 3;
  // mem_working_set_bytes is usage minus reclaimable page cache.
  Metric mem_working_set_bytes = 4;
  // mem_limit_bytes is the configured container memory limit. mem_unlimited
  // means the container has no configured limit; the limit is then unknown,
  // not zero, and the control plane must not invent a percentage.
  Metric mem_limit_bytes = 5;
  bool mem_unlimited = 6;
  Metric net_rx_bps = 7;
  Metric net_tx_bps = 8;
  Metric disk_read_bps = 9;
  Metric disk_write_bps = 10;
}

// ObservationAck reports whether the control plane accepted a report.
message ObservationAck {
  google.protobuf.Timestamp received_at = 1;
  // accepted_sequence is the newest sequence the control plane stored for the
  // node's session.
  uint64 accepted_sequence = 2;
  // accepted is false for a duplicate, obsolete or otherwise superseded report.
  bool accepted = 3;
  // expected_interval_ms is the control plane's effective sampling interval.
  int64 expected_interval_ms = 4;
}

// UpdateRequest asks the CP about available agent versions. The agent reports
// its running version plus the platform it runs on so the CP can select the
// matching release asset.
message UpdateRequest {
  string agent_version = 1;
  // os is the agent's GOOS (e.g. "linux"). The agent only ever runs on linux
  // today; the field keeps the contract explicit for the CP's asset selection.
  string os = 2;
  // arch is the agent's GOARCH (e.g. "amd64", "arm64").
  string arch = 3;
}

// UpdateResponse reports whether an update is available and, when it is, the
// signed release material the agent needs to download and verify it. The CP
// only ever returns material it has itself verified; an empty asset_url with
// update_available=false means no update.
message UpdateResponse {
  bool update_available = 1;
  string latest_version = 2;
  // asset_url is the platform binary to download. It is served over the same
  // trusted channel as the manifest; the agent additionally re-validates the
  // URL (https-only, bounded redirects, no link-local dials).
  string asset_url = 3;
  // manifest_url is the signed release manifest (version, channel, arch, file,
  // sha256). It is the root of the update trust chain.
  string manifest_url = 4;
  // manifest_signature_url is the detached Ed25519 signature over manifest_url.
  string manifest_signature_url = 5;
  // sha256 is the artifact digest the signed manifest must also carry; the
  // agent binds it to the manifest it verifies.
  string sha256 = 6;
  // channel is the release channel the offer came from ("stable"/"beta").
  string channel = 7;
  // rollout is true when an operator has triggered an "update all agents"
  // rollout that includes this agent. An agent applies an offer when rollout is
  // set even if its own unattended auto-update is disabled; a plain offer is
  // informational and only applied when AGENT_AUTO_UPDATE is on.
  bool rollout = 8;
}

// ToolService runs on the node agent. The control plane dials it to list the
// host tools the platform needs and their detected state, and — from a later
// package on — to install and uninstall them. The whole contract (list,
// install, uninstall) is defined here so those later packages never touch this
// file again; the install/uninstall RPCs answer codes.Unimplemented until the
// installer lands.
service ToolService {
  // ListTools returns every catalog entry with its detected state on this node.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  // InstallTool installs one catalog tool, streaming the command's output
  // lines and a final result. Not implemented yet: it answers
  // codes.Unimplemented.
  rpc InstallTool(InstallToolRequest) returns (stream ToolEvent);
  // UninstallTool removes one catalog tool the same way. Not implemented yet:
  // it answers codes.Unimplemented.
  rpc UninstallTool(InstallToolRequest) returns (stream ToolEvent);
}

// ListToolsRequest is empty: the catalog is node-local.
message ListToolsRequest {}

// ToolInfo is one catalog entry with its state on this node.
message ToolInfo {
  // id is the stable catalog handle, e.g. "railpack" or "docker".
  string id = 1;
  string name = 2;
  string description = 3;
  // category groups entries for display: "build", "runtime" or "network".
  string category = 4;
  // installed reports whether the tool was detected on this node.
  bool installed = 5;
  // version is the detected version, empty when unknown.
  string version = 6;
  // path is the resolved executable path; empty for a tool that is not a
  // command of its own (the BuildKit container, the systemd units probed
  // through systemctl) or that is not installed.
  string path = 7;
  // installable and uninstallable gate the manager. Both are false for a
  // detect-only host unit (systemd-networkd/resolved, networkctl) the platform
  // never installs or removes; docker and systemctl are installable but never
  // uninstalled.
  bool installable = 8;
  bool uninstallable = 9;
  // needs_root is true when install/uninstall needs root.
  bool needs_root = 10;
  // deps are the catalog ids this tool needs to be usable.
  repeated string deps = 11;
  // min_version is the minimum version the platform needs (for example git
  // "2.37"); empty when no minimum is required.
  string min_version = 12;
  // version_ok reports whether the detected version meets min_version. It is
  // true when the tool declares no minimum, and false when a minimum is
  // declared but the observed version is missing or lower.
  bool version_ok = 13;
}

// ListToolsResponse lists the catalog with each entry's detected state.
message ListToolsResponse {
  repeated ToolInfo tools = 1;
}

// HostService runs on the node agent. The control plane dials it to read and
// change this node's host settings through the root-owned gotham-hostctl
// helper, which the agent reaches through a verb-pinned sudoers drop-in. The
// helper re-validates every value, so this service is a transport, not a
// trust boundary of its own. A node that predates this service answers
// codes.Unimplemented; the control plane reports it as an outdated agent.
service HostService {
  // Status reports the helper capability and the live host settings: the
  // default-route network, hostname, NTP state and timezone.
  rpc Status(HostStatusRequest) returns (HostStatusResponse);
  // ApplyNetwork applies network and DNS values and arms the host-side revert
  // timer; the host restores the previous state when nothing confirms in
  // time, even when the link to the control plane is gone.
  rpc ApplyNetwork(HostApplyNetworkRequest) returns (HostApplyNetworkResponse);
  // ConfirmNetwork cancels the pending revert and keeps the applied values.
  rpc ConfirmNetwork(HostConfirmNetworkRequest) returns (HostConfirmNetworkResponse);
  // RevertNetwork restores the state snapshotted by ApplyNetwork. It is
  // idempotent: reverting with no pending change succeeds.
  rpc RevertNetwork(HostRevertNetworkRequest) returns (HostRevertNetworkResponse);
  // ApplySystem applies the hostname, NTP and timezone. An empty hostname or
  // timezone leaves that value unchanged.
  rpc ApplySystem(HostApplySystemRequest) returns (HostApplySystemResponse);
}

// HostCapability is the overall host-control state of this node. Anything but
// READY means the control plane shows read-only host forms with a reason.
enum HostCapability {
  HOST_CAPABILITY_UNSPECIFIED = 0;
  HOST_CAPABILITY_READY = 1;
  // UNSUPPORTED_STACK: the helper works, but this host lacks the systemd
  // stack (networkd/resolved/timesyncd) the platform needs.
  HOST_CAPABILITY_UNSUPPORTED_STACK = 2;
  // HELPER_MISSING: gotham-hostctl is not installed on this node.
  HOST_CAPABILITY_HELPER_MISSING = 3;
  // HELPER_DENIED: the helper exists but the agent may not run it.
  HOST_CAPABILITY_HELPER_DENIED = 4;
  // HELPER_OUTDATED: gotham-hostctl predates the fields this control plane
  // reads (its status has no timezone), so the helper needs an update.
  HOST_CAPABILITY_HELPER_OUTDATED = 5;
}

// HostStatusRequest is empty: the host is the one the agent runs on.
message HostStatusRequest {}

// HostNetworkConfig is the default-route interface as the host sees it.
message HostNetworkConfig {
  string interface = 1;
  repeated string dns_servers = 2;
  HostIPv4Config ipv4 = 3;
  HostIPv6Config ipv6 = 4;
}

message HostIPv4Config {
  // mode is "dhcp" or "static".
  string mode = 1;
  // address is CIDR, empty in DHCP mode.
  string address = 2;
  string gateway = 3;
}

message HostIPv6Config {
  bool enabled = 1;
  string mode = 2;
  string address = 3;
  string gateway = 4;
}

// HostStatusResponse reports the live host settings. Empty hostname or
// timezone means the host could not report it.
message HostStatusResponse {
  HostCapability capability = 1;
  // network is null when the host has no usable default-route network
  // configuration to report.
  HostNetworkConfig network = 2;
  string hostname = 3;
  bool ntp_enabled = 4;
  repeated string ntp_servers = 5;
  string timezone = 6;
}

// HostApplyNetworkRequest carries the whole desired network state, exactly as
// the local host helper takes it.
message HostApplyNetworkRequest {
  repeated string dns_servers = 1;
  string ipv4_mode = 2;
  string ipv4_address = 3;
  string ipv4_gateway = 4;
  bool ipv6_enabled = 5;
  string ipv6_mode = 6;
  string ipv6_address = 7;
  string ipv6_gateway = 8;
  // revert_after is the revert countdown in seconds; the helper accepts
  // 30..600.
  uint32 revert_after = 9;
  // dns_only changes only the resolver, never the interface file.
  bool dns_only = 10;
}

// HostApplyNetworkResponse is empty: a failure is a gRPC error.
message HostApplyNetworkResponse {}

message HostConfirmNetworkRequest {}

message HostConfirmNetworkResponse {}

message HostRevertNetworkRequest {}

message HostRevertNetworkResponse {}

message HostApplySystemRequest {
  // hostname is left unchanged when empty.
  string hostname = 1;
  bool ntp_enabled = 2;
  repeated string ntp_servers = 3;
  // timezone is an IANA zone name; empty leaves it unchanged.
  string timezone = 4;
}

message HostApplySystemResponse {}

// InstallToolRequest names the catalog tool to install or uninstall.
message InstallToolRequest {
  string id = 1;
}

// ToolEvent is one message of an install/uninstall stream: an output line, or
// the final result that closes the stream.
message ToolEvent {
  oneof event {
    ToolOutput output = 1;
    ToolResult result = 2;
  }
}

// ToolOutput is one line of the command's output.
message ToolOutput {
  // line is one output line with no trailing newline.
  string line = 1;
  // stream names the source: "stdout" or "stderr".
  string stream = 2;
}

// ToolResult closes an install/uninstall stream with the command's exit
// status.
message ToolResult {
  // status is a short machine-readable outcome: "succeeded" or "failed".
  string status = 1;
  // exit_code is the command's exit code; -1 when it did not run.
  int32 exit_code = 2;
}

// ListContainersRequest filters the container list.
message ListContainersRequest {
  bool all = 1; // include stopped containers
  // labels restricts the list to containers carrying every key=value pair.
  // The agent applies them through Docker's native label filter, so only the
  // matching containers travel back (the terminal id resolution asks for one
  // compose project instead of listing the whole node).
  map<string, string> labels = 2;
  // resolve_volume_devices asks the agent to resolve the configured host
  // device of each named volume (an extra Docker volume inspect per distinct
  // volume). Off by default so a heartbeat or a node-wide listing never pays
  // for it; the volume listing sets it.
  bool resolve_volume_devices = 3;
}

// ContainerInfo describes one container.
message ContainerInfo {
  string id = 1;
  string name = 2;
  string image = 3;
  string status = 4;
  string state = 5;
  google.protobuf.Timestamp created_at = 6;
  map<string, string> labels = 7;
  // ports are the published bindings Docker reports for the container; empty
  // for a container with no published ports or an engine that reports none.
  repeated PortBinding ports = 8;
  // mounts are the container's bind mounts as the engine reports them.
  repeated ContainerMount mounts = 9;
  // restart_policy is the container's native Docker restart policy. The agent
  // fills it for managed proxy containers only; empty means unknown.
  string restart_policy = 10;
  // health is the container's Docker health status ("starting", "healthy" or
  // "unhealthy") when the container declares a native healthcheck; empty when
  // it does not. The control plane gates database readiness on "healthy" so a
  // container that is merely up does not report ready before its engine
  // accepts connections.
  string health = 11;
}

// ContainerMount is one mount of a container.
message ContainerMount {
  // source is the host path of the mount as the engine reports it: a bind
  // source, or a named volume's Docker mountpoint.
  string source = 1;
  // destination is the path inside the container.
  string destination = 2;
  // read_only is true for a read-only mount.
  bool read_only = 3;
  // type is the engine's mount type ("bind", "volume", "tmpfs", "npipe"),
  // empty from an agent that predates it.
  string type = 4;
  // volume_name is the Docker volume name for a "volume" mount, empty
  // otherwise.
  string volume_name = 5;
  // volume_device is the configured host device of a local volume whose
  // driver options bind it to a directory (the managed compose volumes).
  // Empty for a volume without a configured device; source then remains the
  // volume's Docker mountpoint. Never inferred from the volume name.
  string volume_device = 6;
  // volume_device_unverified is true when the agent tried to resolve the
  // volume's device (resolve_volume_devices) and the engine could not answer,
  // so the caller must treat the backing directory as unknown rather than
  // falling back to the Docker mountpoint.
  bool volume_device_unverified = 7;
}

// PortBinding is one published container port as the engine reports it.
message PortBinding {
  // ip is the host bind address, e.g. "0.0.0.0" or "127.0.0.1".
  string ip = 1;
  // private_port is the container port.
  int32 private_port = 2;
  // public_port is the host port.
  int32 public_port = 3;
}

message ListContainersResponse {
  repeated ContainerInfo containers = 1;
}

// ContainerActionRequest targets one container.
message ContainerActionRequest {
  string container_id = 1;
}

message ContainerActionResponse {
  string container_id = 1;
}

message ListVolumesRequest {}

// VolumeInfo describes one Docker volume.
message VolumeInfo {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  // size_bytes is the volume's data size as the engine reports it; 0 when the
  // engine reports no usage data.
  int64 size_bytes = 3;
  // ref_count is the number of containers mounting the volume.
  int64 ref_count = 4;
}

message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;
}

// VolumeActionRequest targets one named volume.
message VolumeActionRequest {
  string name = 1;
}

message VolumeActionResponse {}

// VolumeArchiveCapabilitiesRequest is empty: the capability is node-local.
message VolumeArchiveCapabilitiesRequest {}

// VolumeArchiveCapabilitiesResponse reports the volume-archive transport.
message VolumeArchiveCapabilitiesResponse {
  // available is true when this node implements ArchiveVolumes and
  // RestoreVolumes.
  bool available = 1;
  // capabilities lists the feature identifiers this node supports. A caller
  // must check for "volume_archive.v1" and refuse the node otherwise.
  repeated string capabilities = 2;
}

// ArchiveSource names one directory the archive helper mounts.
message ArchiveSource {
  // name is the manifest key and the directory name inside the archive. It is
  // not a host path: the agent maps it to a mount inside the helper.
  string name = 1;
  oneof source {
    // volume is a named Docker volume.
    string volume = 2;
    // path is an absolute bind path on the node.
    string path = 3;
  }
}

// ArchiveVolumesRequest selects the sources of one archive.
message ArchiveVolumesRequest {
  repeated ArchiveSource sources = 1;
}

// ArchiveChunk is one message of an ArchiveVolumes stream.
message ArchiveChunk {
  oneof part {
    // data is a slice of the tar.gz. The first tar entry is the manifest.
    bytes data = 1;
    // result is the final message. It is sent once, after the last data
    // message, and reports the helper's exit status and stderr tail.
    ArchiveResult result = 2;
  }
}

// ArchiveResult is the final ArchiveVolumes message.
message ArchiveResult {
  bool ok = 1;
  int32 exit_code = 2;
  // stderr_tail is the last few KiB of the helper's stderr, bounded by the
  // agent. It never contains archive data.
  string stderr_tail = 3;
  // error is set when the agent could not produce an archive; ok is false.
  string error = 4;
  // bytes is the verified archive size the agent streamed. It equals the
  // helper's produced size; a mismatch fails the call.
  uint64 bytes = 5;
  // sha256 is the helper's SHA-256 of the produced archive, lowercase hex.
  string sha256 = 6;
}

// RestoreMode selects how a restore treats files already in the target.
enum RestoreMode {
  RESTORE_MODE_UNSPECIFIED = 0;
  // RESTORE_MODE_REPLACE clears each target before extracting.
  RESTORE_MODE_REPLACE = 1;
  // RESTORE_MODE_OVERLAY keeps files that the archive does not contain.
  RESTORE_MODE_OVERLAY = 2;
}

// RestoreVolumesHeader binds a restore stream to its targets. It must be the
// first message of the stream.
message RestoreVolumesHeader {
  repeated ArchiveSource targets = 1;
  RestoreMode mode = 2;
}

// RestoreVolumesRequest is one message of a RestoreVolumes stream.
message RestoreVolumesRequest {
  oneof part {
    RestoreVolumesHeader header = 1;
    bytes data = 2;
  }
}

// RestoreVolumesResponse reports a completed restore.
message RestoreVolumesResponse {
  int32 restored_sources = 1;
}

// PullImageRequest pulls an image from a registry. username/password carry
// one private-registry credential for this pull only: the agent builds the
// Docker X-Registry-Auth header from them and never persists them. Empty
// means the node-local registry credential (for node-owned images) or an
// anonymous pull.
message PullImageRequest {
  string image = 1;
  string username = 2;
  string password = 3;
}

// PullImageResponse reports the resolved image digest (sha256:...) the node
// pulled, so the control plane can record it on the deployment and pin
// rollbacks to it. Empty when the engine reported no digest.
message PullImageResponse {
  string digest = 1;
}

// CreateContainerRequest describes a container to create and (for RunImage)
// start immediately.
message CreateContainerRequest {
  string image = 1;
  string name = 2;
  repeated string env = 3;       // KEY=VALUE
  repeated string command = 4;
  repeated string entrypoint = 5;
  map<string, string> labels = 6;
  repeated string ports = 7;     // [host-ip:]host:container (bare container port allowed)
  repeated string volumes = 8;   // host:container[:ro]
  repeated string networks = 9;
  // restart_policy is the native Docker restart policy name ("always",
  // "unless-stopped", "on-failure"); empty leaves Docker's default.
  string restart_policy = 10;
  // healthcheck configures the container's native Docker healthcheck. The
  // control plane uses it for managed databases so readiness is an engine
  // probe (the image's own ping tool run inside the container) rather than the
  // bare container state. Empty leaves the image's own healthcheck (or none).
  ContainerHealthcheck healthcheck = 11;
  // pids_limit, memory_bytes and nano_cpus are optional resource bounds. They
  // are settable only by the control plane over the mTLS DockerService (never
  // by a browser/tenant), zero keeps Docker's default and therefore the
  // previous behaviour, and the agent rejects negative values or values above
  // its capped maxima. The terminal e2e safety harness is the current caller.
  int64 pids_limit = 12;
  int64 memory_bytes = 13;
  int64 nano_cpus = 14;
  // log_config overrides the node daemon's log driver for this container. The
  // volume-archive helper bounds its own diagnostics with a tiny json-file
  // rotation; its archive bytes travel through a file, never through logs.
  ContainerLogConfig log_config = 15;
}

// ContainerLogConfig is a container's native Docker log configuration.
message ContainerLogConfig {
  string driver = 1;
  map<string, string> options = 2;
}

// ContainerHealthcheck is a container's native Docker healthcheck. test is the
// exec-form command Docker runs inside the container; an empty test disables
// the healthcheck.
message ContainerHealthcheck {
  repeated string test = 1;
  int64 interval_seconds = 2;
  int64 timeout_seconds = 3;
  int32 retries = 4;
  int64 start_period_seconds = 5;
}

// StreamLogsRequest tails the logs of one container.
message StreamLogsRequest {
  string container_id = 1;
  bool follow = 2;
  int64 tail = 3; // number of lines from the end; 0 = default
}

// LogChunk is one chunk of a container log stream.
message LogChunk {
  bytes data = 1;
}

// BuildImageRequest is one part of a BuildImage stream: either the build
// parameters (first message only) or a slice of the build context tarball.
message BuildImageRequest {
  oneof part {
    BuildMeta meta = 1;
    bytes context_chunk = 2;
  }
}

// BuildMeta describes one image build.
message BuildMeta {
  // app_id and deploy_id form the standardized image tag
  // gotham/{app_id}:{deploy_id}. Both must be non-empty ref path segments
  // (letters, digits, dot, underscore, dash).
  string app_id = 1;
  string deploy_id = 2;
  // dockerfile is the Dockerfile path relative to the context root.
  // Empty means "Dockerfile".
  string dockerfile = 3;
  // build_args are forwarded to the Docker build as --build-arg values.
  map<string, string> build_args = 4;
  // engine selects what the node runs against the uploaded context: empty,
  // "dockerfile" (the default) or "static" build the context as a Dockerfile;
  // "railpack" and "buildpacks" run that toolchain on the node, so a build
  // engine that needs a language toolchain is not tied to the control plane.
  string engine = 5;
}

// BuildImageResponse is one message of a BuildImage stream: either a build
// log chunk or, exactly once when the build succeeds, the build result.
message BuildImageResponse {
  oneof event {
    // log carries raw build output (build and push progress merged).
    BuildLogChunk log = 1;
    // result closes a successful build.
    BuildImageResult result = 2;
  }
}

// BuildLogChunk is one chunk of build output.
message BuildLogChunk {
  bytes data = 1;
}

// BuildImageResult reports a completed build and push.
message BuildImageResult {
  // image_tag is the standardized local tag: gotham/{app_id}:{deploy_id}.
  string image_tag = 1;
  // registry_image is the full pushed reference:
  // {registry_addr}/gotham/{app_id}:{deploy_id}.
  string registry_image = 2;
  // digest is the pushed image manifest digest: sha256:...
  string digest = 3;
  // registry_addr is the node-local registry the image was pushed to, e.g.
  // "127.0.0.1:5000". It is returned so the control plane can persist it.
  string registry_addr = 4;
}

// ComposeValidateRequest carries one project's compose document for
// validation. The document is the control-plane rendered compose file (the
// control plane resolves ${VAR} substitutions before sending), so the agent
// only writes and inspects it.
message ComposeValidateRequest {
  // project_name is the compose project name: "gotham-<service uuid>". The
  // agent rejects anything outside that strict pattern, so a compromised
  // control plane cannot direct writes at another directory.
  string project_name = 1;
  // compose_yaml is the complete compose document, capped at 1 MiB. Nothing
  // is started by a validate.
  bytes compose_yaml = 2;
  // unconfined opts out of the application-scope confinement allowlist for
  // the document (no host namespaces, devices, capabilities or binds
  // outside the managed volumes). The Services surface sets it; application
  // deploys leave it unset, so the safe state is the zero value and a
  // caller that omits the field can never relax the node. Unknown fields
  // are ignored by older agents, so the flag rolls out safely.
  bool unconfined = 3;
}

// ComposeValidateResponse reports what a valid document declares.
message ComposeValidateResponse {
  // services are the compose service names, in the CLI's dependency order.
  repeated string services = 1;
  // volumes are the named volumes the document declares, sorted.
  repeated string volumes = 2;
  // confined_enforced reports whether the node applied the
  // application-scope confinement allowlist to this document. It is false
  // for unconfined (Services) requests and for agents that predate the
  // enforcement, so the control plane gates on this field — never on the
  // mere absence of an error.
  bool confined_enforced = 3;
}

// ComposeUpRequest starts (or restarts) a project's compose document.
message ComposeUpRequest {
  // project_name is the compose project name: "gotham-<service uuid>".
  string project_name = 1;
  // compose_yaml is the rendered compose document, capped at 1 MiB. It
  // replaces the project's previous file before the deploy runs, so every
  // deploy is versioned on the node by the file it ran.
  bytes compose_yaml = 2;
  // restart requests `docker compose restart` of the project's existing
  // containers instead of a `docker compose up -d` create/recreate pass. The
  // document is still written and validated first.
  bool restart = 3;
  // unconfined opts out of the application-scope confinement allowlist,
  // like ComposeValidateRequest.unconfined. The deploy control plane leaves
  // it unset for application projects; service projects set it.
  bool unconfined = 4;
}

// ComposeUpResponse is empty: the observable result of an up is the project's
// container list, read back with ComposePs.
message ComposeUpResponse {}

// ComposeDownRequest tears one project down.
message ComposeDownRequest {
  // project_name is the compose project name: "gotham-<service uuid>".
  string project_name = 1;
  // compose_yaml is the rendered compose document the project was last
  // deployed with, capped at 1 MiB. The CLI needs it to resolve the project,
  // and it is the record of which named volumes belong to the project.
  bytes compose_yaml = 2;
  // unconfined opts out of the application-scope confinement allowlist,
  // like ComposeValidateRequest.unconfined. Teardown runs no containers,
  // but the document still replaces the on-disk project file, so the same
  // scope rule applies.
  bool unconfined = 3;
  // remove_volumes removes the project's own named volumes once the project
  // is down: the project-prefixed defaults declared by compose_yaml. External
  // volumes and volumes with a custom `name:` are kept, because another
  // resource may own them, and are reported in volume_warnings.
  bool remove_volumes = 4;
}

// ComposeDownResponse reports volumes that outlived a teardown.
message ComposeDownResponse {
  // volume_warnings lists the declared volumes that could not be removed
  // (for example because another container still uses them). The project is
  // down either way, so a caller treats these as warnings, not a failure.
  repeated string volume_warnings = 1;
}

// ComposeLogsRequest tails one project's logs.
message ComposeLogsRequest {
  // project_name is the compose project name: "gotham-<service uuid>".
  string project_name = 1;
  // service selects one compose service of the project; empty means the whole
  // project.
  string service = 2;
  // follow keeps the stream open; false returns the tail and closes.
  bool follow = 3;
  // tail is the number of lines to read from the end before following;
  // 0 selects the CLI default (all available lines).
  int64 tail = 4;
}

// ComposeLogChunk is one chunk of merged compose output. Output is raw bytes:
// compose logs carry no framing, so the control plane forwards them as-is.
message ComposeLogChunk {
  // data is a slice of the command's merged stdout/stderr. Empty on the
  // acceptance frame.
  bytes data = 1;
  // ready acknowledges that the agent accepted the request and is about to
  // start the command; it is sent exactly once, before any output. It exists
  // so the control plane can commit a stream response before the first line
  // (a following stream may legitimately stay quiet) while still failing
  // fast when the agent refuses the request (unknown project or compose
  // service). Consumers must not treat it as log content.
  bool ready = 2;
}

// ComposePsRequest lists one project's containers.
message ComposePsRequest {
  // project_name is the compose project name: "gotham-<service uuid>".
  string project_name = 1;
}

// ComposeContainer is one container of a compose project as the CLI reports
// it.
message ComposeContainer {
  // service is the compose service name the container belongs to.
  string service = 1;
  // container_id is the Docker container id.
  string container_id = 2;
  // name is the container name (project-prefixed by compose).
  string name = 3;
  // image is the image reference the container runs.
  string image = 4;
  // state is the Docker state, e.g. "running", "exited", "created".
  string state = 5;
  // status is the human-readable status line, e.g. "Up 2 minutes".
  string status = 6;
  // health is the healthcheck result ("healthy", "unhealthy", "starting") or
  // empty when the service defines no healthcheck.
  string health = 7;
  // ports are the port mappings as the CLI reports them, e.g.
  // "0.0.0.0:8080->80/tcp". They are passed through unparsed on purpose: the
  // control plane only displays them.
  repeated string ports = 8;
}

// ComposePsResponse lists a project's containers.
message ComposePsResponse {
  repeated ComposeContainer containers = 1;
}

// TerminalService runs on the node agent. The control plane dials it to open a
// host PTY or an interactive container exec and stream bytes over the existing
// mTLS channel.
//
// The RPC is one bounded bidirectional stream whose first client message must
// be TerminalOpen; every other message is input, resize or close. Output and
// the final exit travel back on the same stream. There is no session id in the
// protocol: the stream *is* the session, so a dropped stream always tears the
// PTY (or the exec attachment) down and a reconnect can never resume (or
// replay input into) the old shell. The control plane opens a new stream only
// for a new session.
//
// Trust boundary: host shell access is a platform-operator capability. The
// agent confines the initial working directory to a FileService root with the
// same no-escape policy as the file manager, but the shell itself is a host
// process running as the agent's service identity and is not confined to those
// roots — that privilege boundary is owned by the agent, which runs the shell
// as its service identity and confines it only to the initial directory.
// The agent bounds message size, session count and idle lifetime, and kills the
// whole process group when the stream ends for any reason.
service TerminalService {
  // OpenTerminal opens one PTY-backed host shell. The first request carries
  // TerminalOpen (target, root, cwd and initial dimensions); the following
  // requests carry input, resize and close. The response stream carries one
  // TerminalOpened, zero or more TerminalOutput chunks and exactly one
  // TerminalExited unless the stream was cancelled. An agent that predates this
  // service answers codes.Unimplemented, which the control plane reports as
  // unsupported rather than retrying.
  rpc OpenTerminal(stream TerminalRequest) returns (stream TerminalResponse);
}

// TerminalRequest is one client message of an OpenTerminal stream.
message TerminalRequest {
  oneof part {
    // open must be the first message of the stream.
    TerminalOpen open = 1;
    // input is raw keyboard/paste bytes written to the PTY master. The agent
    // bounds it per message.
    bytes input = 2;
    TerminalResize resize = 3;
    // close asks the agent to end the session and release the PTY.
    TerminalClose close = 4;
  }
}

// TerminalOpen selects the terminal target and its initial working directory.
message TerminalOpen {
  // target selects what the PTY runs in. "host" (or empty, for compatibility
  // with a caller that omits it) runs a host shell as the agent's service
  // identity. "container" runs an interactive exec in container_id, attached
  // over the same stream and bounded by the same lifecycle. Any other target
  // answers InvalidArgument; an agent that predates a target never silently
  // falls back to the host.
  string target = 1;
  // root is the FileService root name the initial cwd is resolved under. The
  // agent resolves it against its own allow-list; an unknown root is refused.
  // It is only used by the host target.
  string root = 2;
  // cwd is the initial working directory relative to root. Empty or "." means
  // the root itself. It must be an existing directory that resolves inside the
  // root: absolute paths, ".." segments and symlink escapes are refused. The
  // agent sets it directly on the child process, never through a shell
  // command, so no quoting or interpolation is involved. It is only used by
  // the host target.
  string cwd = 3;
  // cols and rows are the initial PTY dimensions. They are bounded by the
  // agent and a zero or out-of-range value is refused.
  uint32 cols = 4;
  uint32 rows = 5;
  // container_id is the Docker container the container target runs in. The
  // control plane resolves it server-side from the application's running
  // deployment and never accepts it from a browser unvalidated. The agent
  // verifies the container still exists and is running before starting the
  // exec; the call never falls back to another container or to the host.
  string container_id = 6;
  // shell optionally names the shell inside the container. Empty lets the
  // agent pick the first supported shell (/bin/bash, /bin/sh, /bin/ash) and
  // report the choice in TerminalOpened.shell. An image without any of them
  // answers FailedPrecondition instead of starting a broken terminal.
  string shell = 7;
}

// TerminalResize changes the PTY window size.
message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// TerminalClose asks for an orderly shutdown. The agent closes the PTY, kills
// the process group and answers with TerminalExited. A stream context
// cancellation has the same effect, so close is an optimization, not a
// requirement.
message TerminalClose {
  // reason is a bounded diagnostic tag such as "client_close"; it is never
  // written to a log line and never echoed to the terminal.
  string reason = 1;
}

// TerminalResponse is one agent message of an OpenTerminal stream.
message TerminalResponse {
  oneof event {
    TerminalOpened opened = 1;
    // output is raw PTY bytes (UTF-8 plus ANSI escape sequences). Consumers
    // must write it to the terminal without interpreting or re-encoding it.
    bytes output = 2;
    TerminalExited exited = 3;
  }
}

// TerminalOpened acknowledges a started shell.
message TerminalOpened {
  // shell is the absolute path of the executable the agent started, for
  // display and audit. It is chosen by the node, never by the caller.
  string shell = 1;
  // cols and rows are the dimensions the PTY actually has.
  uint32 cols = 2;
  uint32 rows = 3;
  // service_user is the user the shell runs as: the agent's OS identity for
  // a host shell, or the container's configured user ("root" when unset) for
  // a container exec. The UI states the privilege boundary from it.
  string service_user = 4;
}

// TerminalExited closes a session with the child's termination status.
message TerminalExited {
  // exit_code is the shell's exit code, or -1 when it was terminated by a
  // signal.
  int32 exit_code = 1;
  // signal is the terminating signal name ("SIGHUP", "SIGKILL"), empty for a
  // normal exit.
  string signal = 2;
}
