name: UI E2E

# Browser-level smoke for the embedded SPA against a real control plane.
# Separate from ci.yml (unit/build) and internal/e2e (API-level suite) so the
# Playwright run only fires on UI changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ui-e2e.yml"

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright smoke (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gotham
          POSTGRES_PASSWORD: gotham
          POSTGRES_DB: gotham_ui_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gotham -d gotham_ui_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dedicated test database and fixed port, kept off the production
      # defaults used by the shared test server.
      GOTHAM_DATABASE_DSN: postgres://gotham:gotham@localhost:5432/gotham_ui_e2e?sslmode=disable
      GOTHAM_REDIS_ADDR: localhost:6379
      GOTHAM_SERVER_ADDR: 127.0.0.1
      GOTHAM_SERVER_PORT: "8099"
      GOTHAM_GRPC_ADDR: 127.0.0.1:9442
      GOTHAM_LOG_LEVEL: info
      GOTHAM_LOG_FORMAT: text
      # Applications are enabled by default; pinned explicitly so the smoke
      # would catch an accidental default flip.
      FEATURE_APPLICATIONS: "true"
      # The SSL surface (BE-6.2) refuses credential writes without a secret
      # key; the domains smoke exercises the DNS-provider CRUD path.
      GOTHAM_SECRET_KEY: "ui-e2e-secret-key-not-for-production"
      GOTHAM_E2E_BASE_URL: http://127.0.0.1:8099

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Migrate test database
        run: go run ./cmd/gotham migrate up

      - name: Build control plane
        run: go build -o bin/gotham ./cmd/gotham

      - name: Start control plane
        run: |
          nohup ./bin/gotham serve > gotham-ui-e2e.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8099/healthz" >/dev/null; then
              echo "control plane is up"
              exit 0
            fi
            sleep 1
          done
          echo "control plane failed to become healthy"
          cat gotham-ui-e2e.log
          exit 1

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke
        working-directory: web
        run: npm run e2e

      - name: Show control-plane log on failure
        if: failure()
        run: cat gotham-ui-e2e.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
