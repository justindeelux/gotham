name: marimo
icon: marimo
description: marimo reactive Python notebook with a persistent app volume, a password and an optional routed domain.
homepage: https://marimo.io/
category:
  - devtools
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: password
    label: Password
    type: secret
    required: true
    generate: true
    help: Required to open a notebook; use Generate for a strong value.
routes:
  - service: marimo
    port: 8080
    domain_field: domain
