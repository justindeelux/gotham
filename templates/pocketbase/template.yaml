name: PocketBase
icon: pocketbase
description: PocketBase single-file backend with persistent data and hooks volumes and an optional routed domain.
homepage: https://pocketbase.io/docs/
category:
  - backend
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: pocketbase
    port: 8080
    domain_field: domain
