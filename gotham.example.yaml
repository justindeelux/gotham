# Gotham control-plane configuration example.
#
# Copy to gotham.yaml in the working directory and edit as needed. Every key is
# optional; the defaults shown below apply when a key is omitted. A missing
# gotham.yaml is not an error.
#
# Environment variables override the file. Supported variables:
#   GOTHAM_SERVER_ADDR, GOTHAM_SERVER_PORT, GOTHAM_TRUSTED_PROXIES,
#   GOTHAM_DATABASE_DSN,
#   GOTHAM_REDIS_ADDR, GOTHAM_LOG_LEVEL, GOTHAM_LOG_FORMAT,
#   GOTHAM_AUTH_JWT_PRIVATE_KEY_PATH, GOTHAM_AUTH_JWT_PUBLIC_KEY_PATH,
#   GOTHAM_OAUTH_GITHUB_CLIENT_ID, GOTHAM_OAUTH_GITHUB_CLIENT_SECRET,
#   GOTHAM_OAUTH_GITHUB_REDIRECT_URL,
#   GOTHAM_GRPC_ADDR, GOTHAM_CA_DIR, GOTHAM_SECRET_KEY
#   GOTHAM_GRPC_HOSTS     extra gRPC listener SAN hosts, comma-separated
#   GOTHAM_MANAGED_VOLUME_ROOT  parent of application bind mounts (default
#                          /var/lib/gotham/volumes); every application bind must
#                          live in <root>/<app id>. The node must agree via
#                          GOTHAM_AGENT_MANAGED_VOLUME_ROOT.
#
# Self-update variables (read directly, not from this file):
#   FEATURE_UPDATES        kill switch for the update surface (default on)
#   AUTO_UPDATE            run the scheduled check/apply loop (default off)
#   AUTO_UPDATE_INTERVAL   auto-update interval, e.g. 6h (default 6h)
#   GOTHAM_UPDATE_CHANNEL  stable (default) or beta
#   GOTHAM_UPDATE_REPO     GitHub repository (default justindeelux/gotham)
#   GOTHAM_UPDATE_BASE_URL Releases API base (default https://api.github.com;
#                          a local mirror must be http(s), http loopback only)
#   GOTHAM_UPDATE_PUBLIC_KEY  release public key (PEM or base64); release
#                          builds embed it with -ldflags instead
#   GOTHAM_UPDATE_SCRIPT   restart wrapper (default /usr/libexec/gotham/gotham-update)
#   GOTHAM_UPDATE_STATUS   root-owned status file (default /var/lib/gotham-updater/update.status)
#   GOTHAM_UPDATE_PENDING  staged gate marker (default /var/lib/gotham/update.pending)
#   GOTHAM_UPDATE_BINARY   fixed target binary (default /var/lib/gotham/bin/gotham)
#   GOTHAM_UPDATE_LOCK     update lock shared with the wrapper (default /var/lib/gotham/update.lock)
#   GOTHAM_UPDATE_BACKOFF  control-plane failed-attempt count for the AUTO_UPDATE
#                          loop (default /var/lib/gotham/update.backoff); cleared
#                          by `gotham update reset`
#   GOTHAM_UPDATE_DOWNLOAD_TIMEOUT  release-artifact body timeout (default 10m);
#                          the API/manifest keep the short fixed bound
#   GOTHAM_UPDATE_CURRENT  override the running version (wrappers/tests)
#   GOTHAM_UPDATE_OFFER_CACHE_TTL  agent-offer cache TTL (default 10m); bounds
#                          the release-API load from a polling fleet
#
# The restart wrapper (fixed, root-owned, no arguments) and its sudoers rule
# live in deploy/; see deploy/README.md for the privilege model and layout.
#
# Node-agent remote update (read directly by the agent, not from this file):
#   GOTHAM_AGENT_AUTO_UPDATE      apply a plain CP offer unattended (default off;
#                                 an operator-triggered rollout always applies)
#   GOTHAM_AGENT_UPDATE_INTERVAL  poll interval, e.g. 5m (default 5m)
#   GOTHAM_AGENT_UPDATE_CHANNEL   release channel accepted, stable (default) or beta
#   GOTHAM_AGENT_BINARY           fixed agent binary (default /var/lib/gotham-agent/bin/gotham-agent)
#   GOTHAM_AGENT_UPDATE_SCRIPT    agent restart wrapper (default /usr/libexec/gotham/gotham-agent-update)
#   GOTHAM_AGENT_UPDATE_STATUS    root-owned agent status (default /var/lib/gotham-agent-updater/update.status)
#   GOTHAM_AGENT_UPDATE_PENDING   agent staged gate (default /var/lib/gotham-agent/update.pending)
#   GOTHAM_AGENT_UPDATE_LOCK      agent update lock (default /var/lib/gotham-agent/update.lock)
#   GOTHAM_AGENT_UPDATE_RETRY     agent retry marker (default /var/lib/gotham-agent/update.retry)
#   GOTHAM_AGENT_UPDATE_BACKOFF   agent failed-attempt count (default /var/lib/gotham-agent/update.backoff)
#   GOTHAM_AGENT_HEALTH_ADDR      loopback health endpoint (default 127.0.0.1:8001)
#   GOTHAM_AGENT_MANAGED_VOLUME_ROOT  parent of application bind mounts the node
#                                 accepts (default /var/lib/gotham/volumes);
#                                 falls back to the shared GOTHAM_MANAGED_VOLUME_ROOT.
#                                 Every application bind must live in <root>/<app id>.
#   GOTHAM_AGENT_PROXY_ROOT       node Traefik directory the proxy container may
#                                 mount (default /var/lib/gotham-agent/traefik)
# The agent's release public key is embedded at build time; GOTHAM_UPDATE_PUBLIC_KEY
# is the development override and applies only when no key is embedded.

# HTTP listener.
server:
  # Interface to bind. Default: 0.0.0.0
  addr: 0.0.0.0
  # TCP port to listen on. Default: 8000
  port: 8000
  # Reverse proxies whose X-Forwarded-For / X-Forwarded-Proto headers are
  # trusted. Comma-separated IPs and CIDRs via GOTHAM_TRUSTED_PROXIES, or a
  # YAML list. Empty (default) trusts no peer: rate limits key on the direct
  # connection and forwarded headers are ignored. Set this behind a
  # TLS-terminating proxy so clients do not share one rate-limit bucket and
  # HTTPS is detected correctly.
  #
  # List the proxy's exact addresses and keep ranges as narrow as possible:
  # EVERY host inside a trusted range can spoof the client address and scheme,
  # so a range like 10.0.0.0/8 lets anything on that network defeat the limiter.
  # The proxy must set/replace X-Forwarded-Proto and append the client to
  # X-Forwarded-For. Changing this value requires a restart.
  # trusted_proxies:
  #   - 10.0.0.5
  #   - 10.0.0.6

# PostgreSQL connection.
database:
  # libpq/pgx connection string used by the health check, the store, and the
  # embedded migrations (`gotham migrate` / `make migrate`).
  # Default: postgres://gotham:gotham@localhost:5432/gotham?sslmode=disable
  dsn: postgres://gotham:gotham@localhost:5432/gotham?sslmode=disable

# Redis connection.
redis:
  # host:port of the Redis server. Default: localhost:6379
  addr: localhost:6379

# gRPC gateway that node agents dial (AgentService + UpdateService).
grpc:
  # host:port to bind. Default: :9442
  addr: ":9442"
  # Extra DNS names and IPs added to the listener certificate SANs, so a remote
  # agent dialing the control plane by that name verifies. The loopback names
  # and the machine hostname are always included. Default: none
  # hosts:
  #   - cp.example.com
  #   - 203.0.113.10
  # Insecure is the explicit development opt-in that lets the gateway start in
  # plaintext when no CA is present. Without a CA serve refuses to start unless
  # this is true. Set from GOTHAM_GRPC_INSECURE=true.
  # insecure: false

# Certificate authority used to issue agent and control-plane mTLS certificates.
# Without one, serve refuses to start unless GOTHAM_GRPC_INSECURE=true
# (development only); the CA is required in production.
ca:
  # Directory holding ca.crt and ca.key (ca.key must be 0600). Default: ./data/ca/
  dir: ./data/ca/

# Secret used to encrypt stored SSH private keys (AES-256-GCM). When empty an
# ephemeral secret is generated at startup and a warning is logged: encrypted
# keys then do not survive a restart.
# secret_key: <32+ random bytes, e.g. `openssl rand -base64 32`>

# Logging.
log:
  # One of: debug, info, warn, error. Default: info
  level: info
  # One of: json, text. Default: json
  format: json

# Authentication.
auth:
  # PEM-encoded Ed25519 keypair signing access tokens. The private key must be
  # PKCS#8 ("PRIVATE KEY") and the public key PKIX ("PUBLIC KEY"), as produced
  # by `openssl genpkey -algorithm ed25519`. Both paths must be set together.
  # When unset, an ephemeral keypair is generated at startup and sessions do not
  # survive a restart.
  # jwt_private_key_path: /etc/gotham/jwt_ed25519.key
  # jwt_public_key_path: /etc/gotham/jwt_ed25519.pub

# OAuth2 identity providers. A provider is disabled while its client_id or
# client_secret is empty; its login route then answers 404.
oauth:
  github:
    # GitHub OAuth app credentials (Settings > Developer settings > OAuth apps).
    # The app's "Authorization callback URL" must be:
    #   http://localhost:8000/api/v1/auth/oauth/github/callback
    # client_id: <github-oauth-app-client-id>
    # client_secret: <github-oauth-app-client-secret>
    # Must match the registered callback URL. When empty the browser is sent to
    # a relative /oauth/callback route on the current origin.
    # redirect_url: http://localhost:8000/api/v1/auth/oauth/github/callback

# Hot reload: Gotham watches this file (fsnotify) and re-applies changes at
# runtime, including the log level. No SIGHUP signal is required.
