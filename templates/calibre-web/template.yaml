name: calibre-web
icon: calibre-web
description: Calibre-web is a web app providing a clean interface for browsing, reading and downloading eBooks.
homepage: https://github.com/linuxserver/docker-calibre-web
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: calibre-web
    port: 8083
    domain_field: domain
