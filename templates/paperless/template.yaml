name: Paperless-ngx
icon: paperless
description: Paperless-ngx turns scanned documents into a searchable archive, with Redis, a generated secret key and persistent named volumes.
homepage: https://docs.paperless-ngx.com/configuration/
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: paper.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: admin_user
    label: Admin user
    type: text
    default: admin
    pattern: ^[A-Za-z0-9_.@-]{1,150}$
    max_length: 150
    help: Created on first start only.
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
    help: Created on first start only; use Generate for a strong value.
  - key: secret_key
    label: Secret key
    type: secret
    required: true
    generate: true
    help: Signs sessions and tokens; keep it to keep existing logins valid.
routes:
  - service: paperless
    port: 8000
    domain_field: domain
