name: Cockpit
icon: cockpit
description: Cockpit headless content platform with persistent config, spaces and storage volumes.
homepage: https://getcockpit.com/documentation/
category:
  - cms
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: cms.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: cockpit
    port: 80
    domain_field: domain
