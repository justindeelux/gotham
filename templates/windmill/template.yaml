name: Windmill
icon: windmill
description: "Windmill automation platform with PostgreSQL and a worker, persistent named volumes and an optional routed domain. The default admin is admin@windmill.dev / changeme; change it after the first login."
homepage: https://www.windmill.dev/docs/
category:
  - automation
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: windmill.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: windmill-server
    port: 8000
    domain_field: domain
