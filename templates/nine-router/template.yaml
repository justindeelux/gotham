name: 9Router
icon: 9router
description: 9Router AI gateway with four generated secrets, a persistent named volume and an optional routed domain.
homepage: https://github.com/decolua/9router
category:
  - ai
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: router.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: initial_password
    label: Initial password
    type: secret
    required: true
    generate: true
  - key: jwt_secret
    label: JWT secret
    type: secret
    required: true
    generate: true
  - key: api_key_secret
    label: API key secret
    type: secret
    required: true
    generate: true
  - key: machine_id_salt
    label: Machine ID salt
    type: secret
    required: true
    generate: true
routes:
  - service: router
    port: 20128
    domain_field: domain
