name: Forgejo
icon: forgejo
description: Forgejo lightweight software forge with a persistent data volume, SQLite storage and a routed domain.
homepage: https://forgejo.org/docs
category:
  - git
fields:
  - key: domain
    label: Domain
    type: text
    required: true
    placeholder: app.example.com
    help: The public host served by the node's Traefik proxy.
    pattern: ^[A-Za-z0-9][A-Za-z0-9.-]*$
    max_length: 253
routes:
  - service: forgejo
    port: 3000
    domain_field: domain
