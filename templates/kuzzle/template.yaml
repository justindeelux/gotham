name: Kuzzle
icon: kuzzle
description: Kuzzle backend with Redis and Elasticsearch, persistent named volumes and an optional routed domain.
homepage: https://kuzzle.io
category:
  - backend
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: kuzzle
    port: 7512
    domain_field: domain
