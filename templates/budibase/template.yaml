name: Budibase
icon: budibase
description: Budibase low-code apps with CouchDB, MinIO and Redis, persistent named volumes and an optional routed domain.
homepage: https://docs.budibase.com/docs/docker-compose
category:
  - automation
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: budibase.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: couchdb_password
    label: CouchDB password
    type: secret
    required: true
    generate: true
  - key: minio_password
    label: Object storage password
    type: secret
    required: true
    generate: true
  - key: redis_password
    label: Redis password
    type: secret
    required: true
    generate: true
  - key: internal_api_key
    label: Internal API key
    type: secret
    required: true
    generate: true
  - key: api_encryption_key
    label: API encryption key
    type: secret
    required: true
    generate: true
  - key: encryption_key
    label: Encryption key
    type: secret
    required: true
    generate: true
  - key: jwt_secret
    label: JWT secret
    type: secret
    required: true
    generate: true
routes:
  - service: proxy-service
    port: 10000
    domain_field: domain
