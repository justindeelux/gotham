name: Databasus
icon: databasus
description: Databasus PostgreSQL, MySQL and MongoDB backups with a persistent data volume and an optional routed domain.
homepage: https://databasus.com/installation
category:
  - devtools
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: databasus
    port: 4005
    domain_field: domain
