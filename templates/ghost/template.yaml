name: Ghost
icon: ghost
description: Ghost publishing platform with MySQL, persistent named volumes and an optional routed domain.
homepage: https://ghost.org
category:
  - cms
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: blog.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_name
    label: Database name
    type: text
    default: ghost
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: ghost
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: db_root_password
    label: MySQL root password
    type: secret
    required: true
    generate: true
routes:
  - service: ghost
    port: 2368
    domain_field: domain
