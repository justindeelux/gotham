services:
  synapse:
    image: matrixdotorg/synapse:v1.165.0
    restart: unless-stopped
    ports:
      - "8008"
    environment:
      SYNAPSE_SERVER_NAME: "{{ .domain }}"
      SYNAPSE_REPORT_STATS: "{{ .report_stats }}"
      ENABLE_REGISTRATION: "{{ .enable_registration }}"
      SYNAPSE_ADMIN_USER: "{{ .admin_user }}"
      SYNAPSE_ADMIN_PASSWORD: "{{ .admin_password }}"
    volumes:
      - synapse_data:/data
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [ ! -f /data/homeserver.yaml ]; then
          /start.py generate
          if ! grep -q "public_baseurl" /data/homeserver.yaml; then
            sed -i "/^server_name:/a public_baseurl: https://$${SYNAPSE_SERVER_NAME}/" /data/homeserver.yaml
          fi
          sed -i 's/bind_addresses: \[.*\]/bind_addresses: ["0.0.0.0"]/' /data/homeserver.yaml
          sed -i '/x_forwarded:/d' /data/homeserver.yaml
          sed -i '/type: http/a \    x_forwarded: true' /data/homeserver.yaml
          if [ "$${ENABLE_REGISTRATION}" = "true" ] && ! grep -q "enable_registration" /data/homeserver.yaml; then
            echo "enable_registration: true" >> /data/homeserver.yaml
          fi
        fi
        if [ -n "$${SYNAPSE_ADMIN_USER}" ]; then
          (
            while ! curl -sf http://localhost:8008/health > /dev/null 2>&1; do sleep 2; done
            register_new_matrix_user -a -u "$${SYNAPSE_ADMIN_USER}" -p "$${SYNAPSE_ADMIN_PASSWORD}" \
              -c /data/homeserver.yaml http://localhost:8008 2>/dev/null || true
          ) &
        fi
        exec /start.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
volumes:
  synapse_data:
