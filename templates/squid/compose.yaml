services:
  squid:
    image: ubuntu/squid:6.6-24.04_edge
    restart: unless-stopped
    ports:
      - "{{ .http_port }}:{{ .http_port }}"
    environment:
      PROXY_USER: "{{ .username }}"
      PROXY_PASSWORD: "{{ .password }}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cat > /etc/squid/auth.sh <<'EOF'
        #!/bin/sh
        while read -r user pass; do
          if [ "$$user" = "$$PROXY_USER" ] && [ "$$pass" = "$$PROXY_PASSWORD" ]; then
            echo OK
          else
            echo ERR
          fi
        done
        EOF
        chmod 755 /etc/squid/auth.sh
        cat > /etc/squid/gotham.conf <<'EOF'
        http_port {{ .http_port }}
        cache deny all
        auth_param basic program /etc/squid/auth.sh
        auth_param basic children 5
        auth_param basic realm Gotham proxy
        auth_param basic credentialsttl 2 hours
        acl authenticated proxy_auth REQUIRED
        http_access allow authenticated
        http_access deny all
        cache_effective_user proxy
        pid_filename /run/squid.pid
        access_log /var/log/squid/access.log squid
        cache_log /var/log/squid/cache.log
        coredump_dir /var/spool/squid
        EOF
        chmod 644 /etc/squid/gotham.conf
        exec /usr/local/bin/entrypoint.sh -f /etc/squid/gotham.conf -NYC
