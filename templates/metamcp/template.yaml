name: MetaMCP
icon: metamcp
description: MetaMCP gateway with PostgreSQL, persistent named volumes and an optional routed domain.
homepage: https://github.com/metatool-ai/metamcp
category:
  - mcp
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: metamcp.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: auth_secret
    label: Auth secret
    type: secret
    required: true
    generate: true
routes:
  - service: app
    port: 12008
    domain_field: domain
