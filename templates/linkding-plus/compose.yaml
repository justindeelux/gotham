services:
  linkding-plus:
    image: sissbruecker/linkding:1.47.0-plus
    restart: unless-stopped
    ports:
      - '9090'
    environment:
      LD_SUPERUSER_NAME: '{{ .superuser_name }}'
      LD_SUPERUSER_PASSWORD: '{{ .superuser_password }}'
    volumes:
      - linkding_data:/etc/linkding/data
volumes:
  linkding_data:
