services:
  documenso:
    image: documenso/documenso:v2.22.0
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      NEXTAUTH_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      NEXTAUTH_SECRET: "{{ .auth_secret }}"
      NEXT_PRIVATE_ENCRYPTION_KEY: "{{ .encryption_key }}"
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: "{{ .secondary_encryption_key }}"
      NEXT_PUBLIC_WEBAPP_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      NEXT_PRIVATE_DATABASE_URL: "postgresql://{{ .db_user }}:{{ .db_password }}@database:5432/documenso?schema=public"
      NEXT_PRIVATE_DIRECT_DATABASE_URL: "postgresql://{{ .db_user }}:{{ .db_password }}@database:5432/documenso?schema=public"
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /app/certs/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: "{{ .signing_passphrase }}"
      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      CERT_VALID_DAYS: "365"
      CERT_INFO_COUNTRY_NAME: DO
      CERT_INFO_STATE_OR_PROVIDENCE: Santiago
      CERT_INFO_LOCALITY_NAME: Santiago
      CERT_INFO_ORGANIZATION_NAME: Gotham
      CERT_INFO_ORGANIZATIONAL_UNIT: IT
      CERT_INFO_EMAIL: admin@example.com
      NEXT_PUBLIC_DISABLE_SIGNUP: "${DISABLE_LOGIN:-false}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        CERT_PASSPHRASE="$${NEXT_PRIVATE_SIGNING_PASSPHRASE}"
        CERT_DIR="/app/certs"
        mkdir -p "$$CERT_DIR"
        echo -n "$$CERT_PASSPHRASE" > /tmp/cert_passphrase
        chmod 600 /tmp/cert_passphrase
        cat <<EOF > /tmp/cert_info_path
        [ req ]
        distinguished_name = req_distinguished_name
        prompt = no
        [ req_distinguished_name ]
        C            = $${CERT_INFO_COUNTRY_NAME}
        ST           = $${CERT_INFO_STATE_OR_PROVIDENCE}
        L            = $${CERT_INFO_LOCALITY_NAME}
        O            = $${CERT_INFO_ORGANIZATION_NAME}
        OU           = $${CERT_INFO_ORGANIZATIONAL_UNIT}
        CN           = ${GOTHAM_DOMAIN:-localhost}
        emailAddress = $${CERT_INFO_EMAIL}
        EOF
        cd "$$CERT_DIR"
        openssl genrsa -out private.key 2048
        openssl req -new -x509 -key private.key -out certificate.crt -days $${CERT_VALID_DAYS} -config /tmp/cert_info_path
        openssl pkcs12 -export -out cert.p12 -inkey private.key -in certificate.crt -legacy -passout file:/tmp/cert_passphrase
        rm -f /tmp/cert_passphrase
        chmod 400 cert.p12 private.key certificate.crt
        cd /app
        ./start.sh
    volumes:
      - documenso_certs:/app/certs
    depends_on:
      - database
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: documenso
    volumes:
      - documenso_postgresql_data:/var/lib/postgresql/data
volumes:
  documenso_certs:
  documenso_postgresql_data:
