name: CI

on:
  # pull_request covers branch PRs; the push event is limited to main so a
  # push to a PR branch does not run the same suite twice (push + pull_request).
  push:
    branches:
      - main
  pull_request:

# A new push to a PR cancels the superseded run; main always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: fmt + vet + test + build (go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        go:
          - "1.27.x"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        if: ${{ hashFiles('go.sum') != '' }}
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

      - name: Upload gotham binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gotham-${{ matrix.os }}-go${{ matrix.go }}
          path: bin/gotham
          if-no-files-found: error

      - name: Upload gotham-agent binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gotham-agent-${{ matrix.os }}-go${{ matrix.go }}
          path: bin/gotham-agent
          if-no-files-found: error

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0

  web:
    name: web build + type-check + dist drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 22+ provides a global WebSocket, which the frontend harness
          # checks (mock-ws-check.mjs) require.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npm run type-check

      - name: Frontend harness checks
        working-directory: web
        run: npm test

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

      - name: Check committed dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- internal/server/webdist)" ]; then
            echo "webdist: committed SPA is out of date (rebuild with npm run build):"
            git status --porcelain -- internal/server/webdist
            exit 1
          fi

  sqlc:
    name: sqlc drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install sqlc
        # The tarball is executed, so verify it against a pinned SHA-256 before
        # extraction: a compromised release mirror must not become code execution
        # on the runner.
        run: |
          set -eu
          version="1.31.1"
          sha256="497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354"
          url="https://github.com/sqlc-dev/sqlc/releases/download/v${version}/sqlc_${version}_linux_amd64.tar.gz"
          curl -sSfL "${url}" -o sqlc.tar.gz
          echo "${sha256}  sqlc.tar.gz" | sha256sum --check --strict -
          tar -xzf sqlc.tar.gz
          chmod +x sqlc
          sudo mv sqlc /usr/local/bin/

      - name: Generate and check drift
        run: |
          sqlc generate
          if [ -n "$(git status --porcelain -- internal/store/sqlc)" ]; then
            echo "sqlc: generated code is out of date:"
            git status --porcelain -- internal/store/sqlc
            exit 1
          fi

  proto:
    name: proto lint + drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: Set up buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.73.0"

      - name: Install protoc plugins
        # Pinned to the versions in go.mod so the regenerated code is identical
        # to the committed .pb.go files.
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: buf lint + generated-code drift check
        run: make proto-check

  db-test:
    name: DB-backed tests (postgres + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gotham
          POSTGRES_PASSWORD: gotham
          POSTGRES_DB: gotham_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U gotham -d gotham_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - "6380:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Setting GOTHAM_TEST_DSN is the explicit opt-in the DB-backed suites use
      # to fail instead of skip, so a broken database is a red job rather than
      # a green run with invisible skips.
      GOTHAM_DATABASE_DSN: postgres://gotham:gotham@localhost:5433/gotham_test?sslmode=disable
      GOTHAM_TEST_DSN: postgres://gotham:gotham@localhost:5433/gotham_test?sslmode=disable
      GOTHAM_TEST_REDIS: 127.0.0.1:6380

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: Download modules
        if: ${{ hashFiles('go.sum') != '' }}
        run: go mod download

      - name: Apply migrations
        # Runs the real migration chain against a fresh database, so a broken
        # migration fails here even before the test suite enters the picture.
        run: go run ./cmd/gotham migrate up

      - name: Run DB-backed tests
        run: go test ./internal/... -count=1

  installer:
    name: installer scripts (shell + actionlint + release chain)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: Shell syntax check
        run: |
          for f in deploy/*.sh; do sh -n "$f"; done

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Release install chain (test-release-install.sh)
        run: sh deploy/test-release-install.sh

      - name: Agent reinstall behaviours (test-agent-install.sh)
        run: sh deploy/test-agent-install.sh
