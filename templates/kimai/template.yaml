name: Kimai
icon: kimai
description: Kimai time tracking with MySQL, persistence and a routed domain.
homepage: https://www.kimai.org/
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: time.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: kimai
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: db_root_password
    label: MySQL root password
    type: secret
    required: true
    generate: true
  - key: app_secret
    label: Application secret
    type: secret
    required: true
    generate: true
    help: Signs sessions; use Generate for a strong value.
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
routes:
  - service: kimai
    port: 8001
    domain_field: domain
