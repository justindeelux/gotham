name: NocoBase
icon: nocobase
description: NocoBase no-code platform with PostgreSQL, persistent named volumes and an optional routed domain.
homepage: https://docs.nocobase.com/
category:
  - development
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: app_key
    label: App key
    type: secret
    required: true
    generate: true
    help: Encrypts stored data; use Generate for a strong value.
  - key: db_name
    label: Database name
    type: text
    default: nocobase
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: nocobase
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
    help: Used by NocoBase and PostgreSQL; use Generate for a strong value.
routes:
  - service: nocobase
    port: 13000
    domain_field: domain
