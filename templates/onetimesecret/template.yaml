name: OneTime Secret
icon: onetimesecret
description: OneTime Secret self-destructing links backed by Redis, with generated secrets.
homepage: https://docs.onetimesecret.com
category:
  - security
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: secrets.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: secret
    label: Application secret
    type: secret
    required: true
    generate: true
    help: Signs and encrypts the one-time links; use Generate for a strong value.
  - key: redis_password
    label: Redis password
    type: secret
    required: true
    generate: true
routes:
  - service: onetimesecret
    port: 3000
    domain_field: domain
