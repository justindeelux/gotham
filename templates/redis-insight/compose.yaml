services:
  redis-insight:
    image: redis/redisinsight:2.70
    restart: unless-stopped
    ports:
      - "5540"
    environment:
      RI_APP_HOST: 0.0.0.0
      RI_APP_PORT: "5540"
      RI_ENCRYPTION_KEY: "{{ .encryption_key }}"
      RI_LOG_LEVEL: info
    volumes:
      - redis_insight_data:/data
volumes:
  redis_insight_data:
