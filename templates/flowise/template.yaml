name: Flowise
icon: flowise
description: Flowise low-code LLM orchestration with a persistent named volume and an optional routed domain.
homepage: https://docs.flowiseai.com/
category:
  - ai
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: flowise.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: admin_user
    label: Admin user
    type: text
    default: admin
    pattern: ^[A-Za-z0-9_.@-]{1,64}$
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
routes:
  - service: flowise
    port: 3001
    domain_field: domain
