services:
  wikijs:
    image: ghcr.io/requarks/wiki:3
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      ADMIN_EMAIL: "{{ .admin_email }}"
      ADMIN_PASS: "{{ .admin_password }}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: "{{ .db_user }}"
      DB_PASS: "{{ .db_password }}"
      DB_NAME: "{{ .db_name }}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "{{ .db_name }}"
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
    volumes:
      - wikijs_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  wikijs_postgres_data:
