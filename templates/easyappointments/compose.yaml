services:
  easyappointments:
    image: alextselegidis/easyappointments:1.6.1
    restart: unless-stopped
    ports:
      - "80"
    environment:
      BASE_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      DB_HOST: mysql
      DB_NAME: easyappointments
      DB_USERNAME: root
      DB_PASSWORD: "{{ .db_password }}"
    depends_on:
      - mysql
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "{{ .db_password }}"
      MYSQL_DATABASE: easyappointments
    volumes:
      - easyappointments_mysql_data:/var/lib/mysql
volumes:
  easyappointments_mysql_data:
