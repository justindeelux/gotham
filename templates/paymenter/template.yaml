name: Paymenter
icon: paymenter
description: Paymenter billing platform with MariaDB and Redis, persistent named volumes and an optional routed domain.
homepage: https://paymenter.org/docs/guides/docker
category:
  - finance
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: billing.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: app_key
    label: Application key
    type: secret
    generate:
      length: 32
      charset: base64
      prefix: "base64:"
  - key: db_name
    label: Database name
    type: text
    default: paymenter
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: paymenter
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: db_root_password
    label: MariaDB root password
    type: secret
    required: true
    generate: true
  - key: redis_password
    label: Redis password
    type: secret
    required: true
    generate: true
routes:
  - service: paymenter
    port: 80
    domain_field: domain
