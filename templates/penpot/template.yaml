name: Penpot
icon: penpot
description: Penpot is an open source design and prototyping platform, backed by PostgreSQL and Valkey with persistent named volumes.
homepage: https://help.penpot.app/technical-guide/getting-started/
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: design.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: secret_key
    label: Secret key
    type: secret
    required: true
    generate: true
    help: Signs sessions; changing it logs every user out.
  - key: db_user
    label: Database user
    type: text
    default: penpot
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
    help: Used by Penpot and PostgreSQL; use Generate for a strong value.
routes:
  - service: frontend
    port: 8080
    domain_field: domain
