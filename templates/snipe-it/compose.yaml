services:
  app:
    image: snipe/snipe-it:v8.8.3
    restart: unless-stopped
    ports:
      - "80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "{{ .app_key }}"
      APP_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      APP_TIMEZONE: UTC
      APP_LOCALE: en-US
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: "{{ .db_name }}"
      DB_USERNAME: "{{ .db_user }}"
      DB_PASSWORD: "{{ .db_password }}"
      MAIL_MAILER: log
    volumes:
      - storage:/var/lib/snipeit
    depends_on:
      - mariadb
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "{{ .db_name }}"
      MYSQL_USER: "{{ .db_user }}"
      MYSQL_PASSWORD: "{{ .db_password }}"
      MYSQL_ROOT_PASSWORD: "{{ .db_root_password }}"
    volumes:
      - db_data:/var/lib/mysql
volumes:
  storage:
  db_data:
