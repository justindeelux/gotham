name: OneDev
icon: onedev
description: OneDev Git server with CI/CD and kanban, PostgreSQL, persistent named volumes and a routed domain.
homepage: https://docs.onedev.io/
category:
  - git
fields:
  - key: domain
    label: Domain
    type: text
    required: true
    placeholder: app.example.com
    help: The public host served by the node's Traefik proxy.
    pattern: ^[A-Za-z0-9][A-Za-z0-9.-]*$
    max_length: 253
  - key: admin_user
    label: Admin user
    type: text
    default: admin
    pattern: ^[A-Za-z0-9_.-]{1,32}$
    max_length: 32
    help: Created on the first start only.
  - key: admin_email
    label: Admin email
    type: text
    required: true
    placeholder: admin@example.com
    pattern: ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$
    max_length: 254
    help: The admin account created on the first start, so the instance is not open to a first visitor.
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
    help: Created on the first start only; use Generate for a strong value.
  - key: db_name
    label: Database name
    type: text
    default: onedev
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: onedev
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
    help: Used by OneDev and PostgreSQL; use Generate for a strong value.
routes:
  - service: onedev
    port: 6610
    domain_field: domain
