services:
  qdrant:
    image: qdrant/qdrant:v1.20.1
    restart: unless-stopped
    ports:
      - "6333"
    environment:
      QDRANT__SERVICE__API_KEY: "{{ .api_key }}"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
volumes:
  qdrant_storage:
