name: Honcho
icon: honcho
description: Honcho agent memory service with PostgreSQL, Redis, persistent named volumes and an optional routed domain.
homepage: https://honcho.dev/docs/v3/contributing/self-hosting
category:
  - ai
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: honcho.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: api
    port: 8000
    domain_field: domain
