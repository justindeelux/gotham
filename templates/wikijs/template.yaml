name: Wiki.js
icon: wikijs
description: Wiki.js with PostgreSQL, a persistent database volume and an optional routed domain.
homepage: https://docs.js.wiki
category:
  - cms
  - documentation
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: wiki.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: admin_email
    label: Admin email
    type: text
    default: admin@example.com
    pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    max_length: 254
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    generate: true
  - key: db_name
    label: Database name
    type: text
    default: wiki
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: wiki
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: wikijs
    port: 3000
    domain_field: domain
