name: Vikunja
icon: vikunja
description: Vikunja is a self-hosted to-do app with lists, teams and reminders, storing tasks in a persistent named SQLite volume.
homepage: https://vikunja.io
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: tasks.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: jwt_secret
    label: JWT secret
    type: secret
    required: true
    pattern: ^[A-Za-z0-9]{32,}$
    help: Signs JWT sessions; at least 32 characters. Generate one with openssl rand -hex 32. Changing it logs every user out.
routes:
  - service: vikunja
    port: 3456
    domain_field: domain
