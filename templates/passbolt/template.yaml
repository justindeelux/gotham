name: Passbolt
icon: passbolt
description: Passbolt password manager with MariaDB and persistent GPG and JWT volumes.
homepage: https://www.passbolt.com/ce/docker
category:
  - auth
fields:
  - key: domain
    label: Domain
    type: text
    required: true
    placeholder: passbolt.example.com
    help: Public host Passbolt uses for its links; required on the first start.
    pattern: ^[A-Za-z0-9][A-Za-z0-9.-]*$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: passbolt
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: db_name
    label: Database name
    type: text
    default: passbolt
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: mariadb_root_password
    label: MariaDB root password
    type: secret
    required: true
    generate: true
routes:
  - service: passbolt
    port: 80
    domain_field: domain
