name: BentoPDF
icon: bento-pdf
description: BentoPDF tools that process PDF files in the browser, with no server-side storage.
homepage: https://bentopdf.com/docs
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: pdf.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: bento-pdf
    port: 8080
    domain_field: domain
