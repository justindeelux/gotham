services:
  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      DATABASE_URL: "postgresql://{{ .db_user }}:{{ .db_password }}@postgresql:5432/{{ .db_name }}"
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3000/health
      interval: 5s
      timeout: 20s
      retries: 10
  postgresql:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: "{{ .db_name }}"
    volumes:
      - martin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "{{ .db_user }}" -d "{{ .db_name }}"
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  martin_postgres_data:
