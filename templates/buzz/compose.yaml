services:
  buzz:
    image: ghcr.io/block/buzz:0.3.0
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      RELAY_URL: wss://${GOTHAM_DOMAIN:-localhost}
      BUZZ_MEDIA_BASE_URL: https://${GOTHAM_DOMAIN:-localhost}/media
      BUZZ_MEDIA_SERVER_DOMAIN: ${GOTHAM_DOMAIN:-localhost}
      BUZZ_CORS_ORIGINS: https://${GOTHAM_DOMAIN:-localhost},tauri://localhost,http://tauri.localhost
      DATABASE_URL: postgres://{{ .postgres_user }}:{{ .postgres_password }}@postgres:5432/buzz
      REDIS_URL: redis://:{{ .redis_password }}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ACCESS_KEY: "{{ .minio_user }}"
      BUZZ_S3_SECRET_KEY: "{{ .minio_password }}"
      BUZZ_S3_BUCKET: "{{ .s3_bucket }}"
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_RELAY_PRIVATE_KEY: "{{ .relay_private_key }}"
      BUZZ_GIT_HOOK_HMAC_SECRET: "{{ .git_hmac_secret }}"
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "true"
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      RELAY_OWNER_PUBKEY: "{{ .relay_owner_pubkey }}"
      RUST_LOG: buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
    volumes:
      - buzz_git_data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/_readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "{{ .postgres_user }}"
      POSTGRES_PASSWORD: "{{ .postgres_password }}"
      POSTGRES_DB: buzz
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - buzz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "{{ .redis_password }}"]
    environment:
      REDIS_PASSWORD: "{{ .redis_password }}"
    volumes:
      - buzz_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "{{ .minio_user }}"
      MINIO_ROOT_PASSWORD: "{{ .minio_password }}"
    volumes:
      - buzz_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: "{{ .minio_user }}"
      BUZZ_S3_SECRET_KEY: "{{ .minio_password }}"
      BUZZ_S3_BUCKET: "{{ .s3_bucket }}"
    entrypoint:
      - /bin/sh
      - -euc
      - |
        mc alias set local http://minio:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
volumes:
  buzz_git_data:
  buzz_postgres_data:
  buzz_redis_data:
  buzz_minio_data:
