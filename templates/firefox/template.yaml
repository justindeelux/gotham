name: Firefox
icon: firefox
description: Containerized Firefox browser with a persistent profile volume.
homepage: https://github.com/jlesage/docker-firefox
category:
  - productivity
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: browser.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: tz
    label: Timezone
    type: text
    default: UTC
    placeholder: Europe/Berlin
    pattern: ^[A-Za-z0-9_/+-]+$
    max_length: 64
    help: IANA timezone name used by the container clock.
routes:
  - service: firefox
    port: 5800
    domain_field: domain
