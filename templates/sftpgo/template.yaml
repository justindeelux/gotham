name: SFTPGo
icon: sftpgo
description: SFTPGo SFTP, FTP, WebDAV and web file server with PostgreSQL.
homepage: https://docs.sftpgo.com/2.7/
category:
  - storage
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: sftp.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: sftpgo
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: db_name
    label: Database name
    type: text
    default: sftpgo
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
routes:
  - service: sftpgo
    port: 8080
    domain_field: domain
