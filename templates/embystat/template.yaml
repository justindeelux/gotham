name: EmbyStat
icon: embystat
description: "EmbyStat statistics for Emby servers, a persistent named volume and an optional routed domain."
homepage: https://github.com/mregni/EmbyStat
category:
  - analytics
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: embystat.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: tz
    label: Timezone
    type: text
    default: UTC
    pattern: ^[A-Za-z0-9_/+-]+$
    max_length: 64
    help: IANA timezone name used by the container clock.
routes:
  - service: embystat
    port: 6555
    domain_field: domain
