name: Prefect
icon: prefect
description: Prefect workflow orchestration with PostgreSQL, a persistent named volume and an optional routed domain.
homepage: https://www.prefect.io/
category:
  - automation
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: prefect.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: api_key
    label: API key
    type: secret
    required: true
    generate: true
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: prefect
    port: 4200
    domain_field: domain
