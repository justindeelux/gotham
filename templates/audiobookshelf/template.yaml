name: audiobookshelf
icon: audiobookshelf
description: Self-hosted audiobook, ebook, and podcast server
homepage: https://www.audiobookshelf.org/
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: audiobookshelf
    port: 80
    domain_field: domain
