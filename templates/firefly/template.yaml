name: Firefly III
icon: firefly
description: Firefly III personal finance manager with MariaDB, persistent named volumes and an optional routed domain.
homepage: https://firefly-iii.org
category:
  - finance
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: money.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: app_key
    label: Application key
    type: secret
    generate:
      length: 32
      charset: base64
      prefix: "base64:"
  - key: cron_token
    label: Cron token
    type: secret
    generate:
      length: 32
      charset: hex
  - key: db_name
    label: Database name
    type: text
    default: firefly
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: firefly
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: db_root_password
    label: MariaDB root password
    type: secret
    required: true
    generate: true
routes:
  - service: firefly
    port: 8080
    domain_field: domain
