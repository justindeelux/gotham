name: miniflux
icon: miniflux
description: Miniflux is a minimalist and opinionated feed reader.
homepage: https://miniflux.app/docs/index.html
category:
  - rss
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: admin_username
    label: Admin user
    type: text
    required: false
    default: admin
    pattern: ^[A-Za-z0-9_.-]{1,64}$
    max_length: 64
  - key: admin_password
    label: Admin password
    type: secret
    required: true
    help: Created on first start when the admin user does not exist.
    generate: true
  - key: db_user
    label: Database user
    type: text
    required: false
    default: miniflux
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: miniflux
    port: 8080
    domain_field: domain
