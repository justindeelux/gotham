services:
  joplin:
    image: joplin/server:3.7.5
    restart: unless-stopped
    ports:
      - "22300"
    environment:
      APP_BASE_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      DB_CLIENT: pg
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PORT: "5432"
      POSTGRES_HOST: postgres
    depends_on:
      - postgres
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_DB: joplin
    volumes:
      - joplin_postgresql_data:/var/lib/postgresql/data
volumes:
  joplin_postgresql_data:
