services:
  proxy:
    image: makeplane/plane-proxy:v1.4.3
    restart: unless-stopped
    ports:
      - "80"
    environment:
      APP_DOMAIN: "${GOTHAM_DOMAIN:-localhost}"
      SITE_ADDRESS: ":80"
      FILE_SIZE_LIMIT: "5242880"
      BUCKET_NAME: uploads
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live
  web:
    image: makeplane/plane-frontend:v1.4.3
    restart: unless-stopped
    depends_on:
      - api
      - worker
  space:
    image: makeplane/plane-space:v1.4.3
    restart: unless-stopped
    depends_on:
      - api
      - worker
      - web
  admin:
    image: makeplane/plane-admin:v1.4.3
    restart: unless-stopped
    depends_on:
      - api
      - web
  live:
    image: makeplane/plane-live:v1.4.3
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://plane-redis:6379/
      LIVE_SERVER_SECRET_KEY: "{{ .live_secret }}"
    depends_on:
      - api
      - web
  api:
    image: makeplane/plane-backend:v1.4.3
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    environment:
      WEB_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      CORS_ALLOWED_ORIGINS: "https://${GOTHAM_DOMAIN:-localhost}"
      APP_DOMAIN: "${GOTHAM_DOMAIN:-localhost}"
      DEBUG: "0"
      GUNICORN_WORKERS: "1"
      USE_MINIO: "1"
      DATABASE_URL: "postgresql://{{ .db_user }}:{{ .db_password }}@plane-db/plane"
      SECRET_KEY: "{{ .secret_key }}"
      LIVE_SERVER_SECRET_KEY: "{{ .live_secret }}"
      AMQP_URL: "amqp://{{ .rabbitmq_user }}:{{ .rabbitmq_password }}@plane-mq:5672/plane"
      REDIS_URL: redis://plane-redis:6379/
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      AWS_ACCESS_KEY_ID: "{{ .minio_user }}"
      AWS_SECRET_ACCESS_KEY: "{{ .minio_password }}"
      FILE_SIZE_LIMIT: "5242880"
      BUCKET_NAME: uploads
    volumes:
      - logs_api:/code/plane/logs
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
  worker:
    image: makeplane/plane-backend:v1.4.3
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      WEB_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      CORS_ALLOWED_ORIGINS: "https://${GOTHAM_DOMAIN:-localhost}"
      APP_DOMAIN: "${GOTHAM_DOMAIN:-localhost}"
      DEBUG: "0"
      GUNICORN_WORKERS: "1"
      USE_MINIO: "1"
      DATABASE_URL: "postgresql://{{ .db_user }}:{{ .db_password }}@plane-db/plane"
      SECRET_KEY: "{{ .secret_key }}"
      LIVE_SERVER_SECRET_KEY: "{{ .live_secret }}"
      AMQP_URL: "amqp://{{ .rabbitmq_user }}:{{ .rabbitmq_password }}@plane-mq:5672/plane"
      REDIS_URL: redis://plane-redis:6379/
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      AWS_ACCESS_KEY_ID: "{{ .minio_user }}"
      AWS_SECRET_ACCESS_KEY: "{{ .minio_password }}"
      FILE_SIZE_LIMIT: "5242880"
      BUCKET_NAME: uploads
    volumes:
      - logs_worker:/code/plane/logs
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
  beat-worker:
    image: makeplane/plane-backend:v1.4.3
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      WEB_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      CORS_ALLOWED_ORIGINS: "https://${GOTHAM_DOMAIN:-localhost}"
      APP_DOMAIN: "${GOTHAM_DOMAIN:-localhost}"
      DEBUG: "0"
      GUNICORN_WORKERS: "1"
      USE_MINIO: "1"
      DATABASE_URL: "postgresql://{{ .db_user }}:{{ .db_password }}@plane-db/plane"
      SECRET_KEY: "{{ .secret_key }}"
      LIVE_SERVER_SECRET_KEY: "{{ .live_secret }}"
      AMQP_URL: "amqp://{{ .rabbitmq_user }}:{{ .rabbitmq_password }}@plane-mq:5672/plane"
      REDIS_URL: redis://plane-redis:6379/
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      AWS_ACCESS_KEY_ID: "{{ .minio_user }}"
      AWS_SECRET_ACCESS_KEY: "{{ .minio_password }}"
      FILE_SIZE_LIMIT: "5242880"
      BUCKET_NAME: uploads
    volumes:
      - logs_beat:/code/plane/logs
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
  migrator:
    image: makeplane/plane-backend:v1.4.3
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      WEB_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      CORS_ALLOWED_ORIGINS: "https://${GOTHAM_DOMAIN:-localhost}"
      APP_DOMAIN: "${GOTHAM_DOMAIN:-localhost}"
      DEBUG: "0"
      GUNICORN_WORKERS: "1"
      USE_MINIO: "1"
      DATABASE_URL: "postgresql://{{ .db_user }}:{{ .db_password }}@plane-db/plane"
      SECRET_KEY: "{{ .secret_key }}"
      LIVE_SERVER_SECRET_KEY: "{{ .live_secret }}"
      AMQP_URL: "amqp://{{ .rabbitmq_user }}:{{ .rabbitmq_password }}@plane-mq:5672/plane"
      REDIS_URL: redis://plane-redis:6379/
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      AWS_ACCESS_KEY_ID: "{{ .minio_user }}"
      AWS_SECRET_ACCESS_KEY: "{{ .minio_password }}"
      FILE_SIZE_LIMIT: "5242880"
      BUCKET_NAME: uploads
    volumes:
      - logs_migrator:/code/plane/logs
    depends_on:
      - plane-db
      - plane-redis
  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=1000"]
    environment:
      POSTGRES_USER: "{{ .db_user }}"
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: plane
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "{{ .rabbitmq_user }}"
      RABBITMQ_DEFAULT_PASS: "{{ .rabbitmq_password }}"
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  plane-minio:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    restart: unless-stopped
    command: ["server", "/export", "--console-address", ":9090"]
    environment:
      MINIO_ROOT_USER: "{{ .minio_user }}"
      MINIO_ROOT_PASSWORD: "{{ .minio_password }}"
    volumes:
      - uploads:/export
volumes:
  proxy_config:
  proxy_data:
  logs_api:
  logs_worker:
  logs_beat:
  logs_migrator:
  pgdata:
  redisdata:
  rabbitmq_data:
  uploads:
