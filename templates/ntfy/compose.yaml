services:
  ntfy:
    image: binwiederhier/ntfy:v2.38.0
    restart: unless-stopped
    command:
      - serve
    ports:
      - "80"
    environment:
      NTFY_BASE_URL: https://${GOTHAM_DOMAIN:-localhost}
      TZ: "{{ .timezone }}"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_WEB_PUSH_FILE: /var/cache/ntfy/webpush.db
      NTFY_BEHIND_PROXY: "true"
      NTFY_ENABLE_SIGNUP: "{{ .enable_signup }}"
      NTFY_ENABLE_LOGIN: "{{ .enable_login }}"
      NTFY_CACHE_DURATION: 24h
      NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT: 1G
      NTFY_ATTACHMENT_FILE_SIZE_LIMIT: 10M
      NTFY_ATTACHMENT_EXPIRY_DURATION: 24h
      NTFY_AUTH_DEFAULT_ACCESS: read-write
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  ntfy_cache:
  ntfy_data:
