services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19
    restart: unless-stopped
    ports:
      - "1411"
    environment:
      APP_URL: "https://{{ .domain }}"
      TRUST_PROXY: "true"
      ENCRYPTION_KEY: "{{ .encryption_key }}"
    volumes:
      - pocket_id_data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  pocket_id_data:
