name: GoatCounter
icon: goatcounter
description: "GoatCounter web analytics with a persistent named volume and an optional routed domain."
homepage: https://www.goatcounter.com/help
category:
  - analytics
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: stats.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: goatcounter
    port: 8080
    domain_field: domain
