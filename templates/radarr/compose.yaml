services:
  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3
    restart: unless-stopped
    ports:
      - '7878'
    environment:
      _APP_URL: https://${GOTHAM_DOMAIN:-localhost}
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - radarr_config:/config
volumes:
  radarr_config:
