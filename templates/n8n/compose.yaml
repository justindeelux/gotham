services:
  n8n:
    image: n8nio/n8n:1
    restart: unless-stopped
    ports:
      - "5678"
    environment:
      N8N_HOST: "${GOTHAM_DOMAIN:-localhost}"
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: "https://${GOTHAM_DOMAIN:-localhost}/"
      N8N_ENCRYPTION_KEY: "{{ .encryption_key }}"
      GENERIC_TIMEZONE: "{{ .timezone }}"
      TZ: "{{ .timezone }}"
      N8N_LOG_LEVEL: "{{ .log_level }}"
      N8N_DIAGNOSTICS_ENABLED: "{{ .diagnostics }}"
      EXECUTIONS_DATA_MAX_AGE: "{{ .executions_retention_hours }}"
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
