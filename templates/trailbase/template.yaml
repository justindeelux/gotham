name: TrailBase
icon: trailbase
description: TrailBase Rust and SQLite application server with a persistent depot volume and an optional routed domain.
homepage: https://trailbase.io/
category:
  - backend
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: trailbase
    port: 4000
    domain_field: domain
