services:
  api:
    image: ghcr.io/plastic-labs/honcho:v3.6.1
    restart: unless-stopped
    entrypoint: ["sh", "docker/entrypoint.sh"]
    ports:
      - "8000"
    environment:
      DB_CONNECTION_URI: "postgresql+psycopg://postgres:{{ .db_password }}@database:5432/postgres"
      CACHE_URL: "redis://redis:6379/0?suppress=true"
      CACHE_ENABLED: "true"
      LOG_LEVEL: INFO
      AUTH_USE_AUTH: "false"
      VECTOR_STORE_TYPE: pgvector
    depends_on:
      - database
      - redis
  deriver:
    image: ghcr.io/plastic-labs/honcho:v3.6.1
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    environment:
      DB_CONNECTION_URI: "postgresql+psycopg://postgres:{{ .db_password }}@database:5432/postgres"
      CACHE_URL: "redis://redis:6379/0?suppress=true"
      CACHE_ENABLED: "true"
      LOG_LEVEL: INFO
      AUTH_USE_AUTH: "false"
      VECTOR_STORE_TYPE: pgvector
    depends_on:
      - api
      - database
      - redis
  database:
    image: pgvector/pgvector:0.8.7-pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "{{ .db_password }}"
    volumes:
      - honcho_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:8.10
    restart: unless-stopped
    volumes:
      - honcho_redis_data:/data
volumes:
  honcho_pgdata:
  honcho_redis_data:
