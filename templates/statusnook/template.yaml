name: Statusnook
icon: statusnook
description: "Status page and endpoint monitoring with a persistent named volume and an optional routed domain."
homepage: https://statusnook.com
category:
  - monitoring
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: status.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: statusnook
    port: 8000
    domain_field: domain
