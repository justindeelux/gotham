name: metube
icon: metube
description: A web GUI for youtube-dl with playlist support. It enables you to effortlessly download videos from YouTube and dozens of other sites.
homepage: https://github.com/alexta69/metube
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: metube
    port: 8081
    domain_field: domain
