name: Flipt
icon: flipt
description: Flipt feature flag server with a persistent storage volume and an optional routed domain. No authentication by default.
homepage: https://docs.flipt.io/cloud/overview
category:
  - backend
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: flipt
    port: 8080
    domain_field: domain
