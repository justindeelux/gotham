name: Portabase
icon: portabase
description: Portabase database backup and monitoring platform with PostgreSQL, persistent volumes and an optional routed domain.
homepage: https://portabase.io/docs
category:
  - database
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: backup.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: project_secret
    label: Project secret
    type: secret
    generate:
      length: 64
      charset: hex
  - key: db_name
    label: Database name
    type: text
    default: portabase
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: db_user
    label: Database user
    type: text
    default: portabase
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: portabase
    port: 80
    domain_field: domain
