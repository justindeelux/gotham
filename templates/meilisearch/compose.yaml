services:
  meilisearch:
    image: getmeili/meilisearch:v1.57.0
    restart: unless-stopped
    ports:
      - "7700"
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
      MEILI_MASTER_KEY: "{{ .master_key }}"
    volumes:
      - meilisearch_data:/meili_data
volumes:
  meilisearch_data:
