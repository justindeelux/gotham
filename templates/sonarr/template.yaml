name: sonarr
icon: sonarr
description: 'Sonarr is a PVR for Usenet and BitTorrent users: it watches feeds for new episodes, grabs, sorts and renames releases, and upgrades quality over time.'
homepage: https://hub.docker.com/r/linuxserver/sonarr
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: sonarr
    port: 8989
    domain_field: domain
