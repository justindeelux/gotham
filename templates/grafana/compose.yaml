services:
  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      GF_SERVER_ROOT_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      GF_SERVER_DOMAIN: "${GOTHAM_DOMAIN:-localhost}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ .admin_password }}"
    volumes:
      - grafana_data:/var/lib/grafana
volumes:
  grafana_data:
