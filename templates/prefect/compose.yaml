services:
  prefect:
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    ports:
      - "4200"
    environment:
      PREFECT_API_URL: "https://${GOTHAM_DOMAIN:-localhost}/api"
      PREFECT_API_DATABASE_CONNECTION_URL: "postgresql+asyncpg://prefect:{{ .db_password }}@postgresql:5432/prefect"
      PREFECT_API_KEY: "{{ .api_key }}"
      PREFECT_EXPERIMENTAL_WARN: "false"
      PREFECT_DEFAULT_WORK_POOL_NAME: default
    depends_on:
      - postgresql
  agent:
    image: prefecthq/prefect:3-python3.12
    restart: unless-stopped
    entrypoint: ["prefect", "worker", "start", "--pool", "default", "--name", "worker1"]
    environment:
      PREFECT_API_URL: "http://prefect:4200/api"
      PREFECT_API_KEY: "{{ .api_key }}"
    depends_on:
      - prefect
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: "{{ .db_password }}"
      POSTGRES_DB: prefect
    volumes:
      - prefect_postgres_data:/var/lib/postgresql/data
volumes:
  prefect_postgres_data:
