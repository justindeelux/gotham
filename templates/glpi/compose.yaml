services:
  glpi:
    image: glpi/glpi:12
    restart: unless-stopped
    ports:
      - "80"
    environment:
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: glpi-db
      GLPI_DB_USER: "{{ .db_user }}"
      GLPI_DB_PASSWORD: "{{ .db_password }}"
    volumes:
      - glpi_data:/var/glpi
    depends_on:
      glpi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  glpi-db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "{{ .db_root_password }}"
      MYSQL_DATABASE: glpi-db
      MYSQL_USER: "{{ .db_user }}"
      MYSQL_PASSWORD: "{{ .db_password }}"
    volumes:
      - glpi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 20s
      retries: 10
volumes:
  glpi_data:
  glpi_mysql_data:
