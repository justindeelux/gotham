name: qbittorrent
icon: qbittorrent
description: The qBittorrent project aims to provide an open-source software alternative to μTorrent.
homepage: https://docs.linuxserver.io/images/docker-qbittorrent/
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: vuetorrent-backend
    port: 8080
    domain_field: domain
