name: Langflow
icon: langflow
description: Langflow AI app builder with PostgreSQL, a persistent named volume and an optional routed domain.
homepage: https://docs.langflow.org
category:
  - ai
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: langflow.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: superuser
    label: Superuser name
    type: text
    default: admin
    pattern: ^[A-Za-z0-9_.@-]{1,64}$
  - key: superuser_password
    label: Superuser password
    type: secret
    required: true
    generate: true
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: langflow
    port: 7860
    domain_field: domain
