services:
  web:
    image: ghcr.io/karakeep-app/karakeep:0.35.0
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      NEXTAUTH_URL: "https://${GOTHAM_DOMAIN:-localhost}"
      NEXTAUTH_SECRET: "{{ .nextauth_secret }}"
      MEILI_MASTER_KEY: "{{ .meili_key }}"
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DISABLE_SIGNUPS: "${DISABLE_SIGNUPS:-false}"
      DATA_DIR: /data
    volumes:
      - karakeep_data:/data
    depends_on:
      - chrome
      - meilisearch
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:157.0.8103.78-r1
    restart: unless-stopped
    init: true
    command:
      - '--disable-gpu'
      - '--disable-dev-shm-usage'
      - '--hide-scrollbars'
      - '--disable-blink-features=AutomationControlled'
      - '--window-size=1440,900'
  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      NEXTAUTH_SECRET: "{{ .nextauth_secret }}"
      MEILI_MASTER_KEY: "{{ .meili_key }}"
      NEXTAUTH_URL: "https://${GOTHAM_DOMAIN:-localhost}"
    volumes:
      - karakeep_meilisearch:/meili_data
volumes:
  karakeep_data:
  karakeep_meilisearch:
