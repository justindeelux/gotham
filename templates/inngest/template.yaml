name: Inngest
icon: inngest
description: Inngest workflow engine with PostgreSQL and Redis, persistent named volumes and an optional routed domain.
homepage: https://www.inngest.com/docs/self-hosting
category:
  - automation
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: inngest.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: event_key
    label: Event key
    type: secret
    required: true
    generate: true
  - key: signing_key
    label: Signing key
    type: secret
    required: true
    generate: true
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: inngest
    port: 8288
    domain_field: domain
