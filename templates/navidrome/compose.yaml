services:
  navidrome:
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    ports:
      - '4533'
    environment:
      ND_BASEURL: https://${GOTHAM_DOMAIN:-localhost}
      ND_SCANSCHEDULE: ${ND_SCANSCHEDULE:-1h}
      ND_LOGLEVEL: ${ND_LOGLEVEL:-info}
      ND_SESSIONTIMEOUT: ${ND_SESSIONTIMEOUT:-24h}
      ND_ENABLEINSIGHTSCOLLECTOR: 'false'
    volumes:
      - navidrome_data:/data
      - navidrome_music:/music:ro
volumes:
  navidrome_data:
  navidrome_music:
