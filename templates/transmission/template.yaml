name: transmission
icon: transmission
description: Fast, easy, and free BitTorrent client.
homepage: https://docs.linuxserver.io/images/docker-transmission/
category:
  - media
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: username
    label: Web UI user
    type: text
    required: false
    default: admin
    help: User name for the download web interface.
    pattern: ^[A-Za-z0-9_.-]{1,32}$
    max_length: 32
  - key: password
    label: Web UI password
    type: secret
    required: true
    help: Password for the download web interface.
    generate: true
routes:
  - service: transmission
    port: 9091
    domain_field: domain
