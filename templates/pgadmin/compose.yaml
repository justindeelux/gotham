services:
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    restart: unless-stopped
    ports:
      - "80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "{{ .admin_email }}"
      PGADMIN_DEFAULT_PASSWORD: "{{ .admin_password }}"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
volumes:
  pgadmin_data:
