services:
  siyuan:
    image: b3log/siyuan:v3.8.10
    restart: unless-stopped
    ports:
      - "6806"
    environment:
      PUID: "1000"
      PGID: "1000"
      SIYUAN_ACCESS_AUTH_CODE: "{{ .access_code }}"
    volumes:
      - siyuan_workspace:/siyuan/workspace
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:6806/api/system/version"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
volumes:
  siyuan_workspace:
