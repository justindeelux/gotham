name: OpenWA
icon: openwa
description: OpenWA WhatsApp API gateway with PostgreSQL, Redis, persistent named volumes and an optional routed domain.
homepage: https://github.com/rmyndharis/OpenWA
category:
  - messaging
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: whatsapp.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: api_master_key
    label: API master key
    type: secret
    required: true
    generate: true
    help: Authenticates API clients; use Generate for a strong value.
  - key: db_user
    label: Database user
    type: text
    default: openwa
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
routes:
  - service: openwa
    port: 2785
    domain_field: domain
