services:
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.4
    restart: unless-stopped
    ports:
      - '9091'
    environment:
      PUID: '1000'
      PGID: '1000'
      USER: '{{ .username }}'
      PASS: '{{ .password }}'
    volumes:
      - transmission_config:/config
      - transmission_downloads:/downloads
      - transmission_watch:/watch
volumes:
  transmission_config:
  transmission_downloads:
  transmission_watch:
