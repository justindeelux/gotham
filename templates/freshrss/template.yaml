name: freshrss
icon: freshrss
description: A free, self-hostable feed aggregator.
homepage: https://freshrss.org/index.html
category:
  - rss
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: cron_min
    label: Feed refresh minutes
    type: text
    required: false
    default: 1,31
    help: Minutes of the hour when feeds are refreshed, for example 1,31.
    pattern: ^[0-9,*/-]{1,64}$
    max_length: 64
routes:
  - service: freshrss
    port: 80
    domain_field: domain
