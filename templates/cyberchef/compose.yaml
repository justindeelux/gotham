services:
  cyberchef:
    image: ghcr.io/gchq/cyberchef:11.5.0
    restart: unless-stopped
    ports:
      - "8080"
    volumes:
      - cyberchef_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  cyberchef_data:
