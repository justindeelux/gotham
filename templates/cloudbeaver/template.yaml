name: CloudBeaver
icon: cloudbeaver
description: CloudBeaver web database manager with a persistent workspace and an optional routed domain.
homepage: https://dbeaver.com/docs/cloudbeaver/
category:
  - devtools
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: app.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
routes:
  - service: cloudbeaver
    port: 8978
    domain_field: domain
