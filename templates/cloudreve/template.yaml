name: Cloudreve
icon: cloudreve
description: Cloudreve file management with PostgreSQL, Redis and a persistent data volume.
homepage: https://docs.cloudreve.org/
category:
  - storage
fields:
  - key: domain
    label: Domain
    type: text
    required: false
    default: ""
    placeholder: files.example.com
    help: Optional. Leave empty to add a domain later from the service page.
    pattern: ^([A-Za-z0-9][A-Za-z0-9.-]*)?$
    max_length: 253
  - key: db_user
    label: Database user
    type: text
    default: cloudreve
    pattern: ^[A-Za-z0-9_]{1,32}$
    max_length: 32
  - key: db_password
    label: Database password
    type: secret
    required: true
    generate: true
  - key: db_name
    label: Database name
    type: text
    default: cloudreve
    pattern: ^[A-Za-z0-9_]{1,64}$
    max_length: 64
  - key: redis_password
    label: Redis password
    type: secret
    required: true
    generate: true
routes:
  - service: cloudreve
    port: 5212
    domain_field: domain
